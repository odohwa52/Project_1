<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blueprint — FinOS</title>
<link rel="manifest" href="./frontend/manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.js"></script>

<style>
  :root {
    --cream: #EFEBE2;
    --charcoal: #2C2C2C;
    --terra: #D96A53;
    --ochre: #C49A45;
    --olive: #6B705C;
    --glass-bg: rgba(239,235,226,0.88);
    --glass-border: rgba(44,44,44,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Inter', sans-serif;
    height: 100vh; width: 100vw;
  }
  /* Grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.032; pointer-events: none; z-index: 9998;
  }
  /* Drafting grid */
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(44,44,44,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(44,44,44,0.05) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none; z-index: 1;
  }
  .font-serif { font-family: 'Cormorant Garamond', serif !important; }
  .font-mono  { font-family: 'IBM Plex Mono', monospace !important; }
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
  }
  /* Sidebar */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 60px;
    background: rgba(239,235,226,0.96);
    border-right: 1px solid rgba(44,44,44,0.1);
    z-index: 200; display: flex; flex-direction: column;
    align-items: center; padding: 20px 0; gap: 6px;
  }
  .nav-btn {
    width: 42px; height: 42px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(44,44,44,0.4); border: 1px solid transparent;
    transition: all 0.18s ease; background: transparent; position: relative;
  }
  .nav-btn:hover { color: var(--charcoal); background: rgba(44,44,44,0.06); }
  .nav-btn:hover .nav-tooltip {
    opacity: 1; transform: translateX(0); pointer-events: none;
  }
  .nav-btn.active {
    color: var(--terra); background: rgba(217,106,83,0.1);
    border-color: rgba(217,106,83,0.25);
  }
  .nav-tooltip {
    position: absolute; left: 52px; top: 50%; transform: translateY(-50%) translateX(-6px);
    background: var(--charcoal); color: var(--cream); font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; padding: 4px 10px; border-radius: 4px; white-space: nowrap;
    opacity: 0; transition: all 0.15s ease; pointer-events: none; z-index: 999;
    letter-spacing: 0.06em;
  }
  /* Main scroll area */
  .main-scroll {
    position: fixed; left: 60px; top: 0; right: 0; bottom: 0;
    overflow-y: auto; overflow-x: hidden; z-index: 10;
  }
  .main-scroll::-webkit-scrollbar { width: 3px; }
  .main-scroll::-webkit-scrollbar-thumb { background: rgba(44,44,44,0.14); border-radius: 2px; }
  /* Tab transition */
  .tab-view { animation: tabIn 0.3s ease; }
  @keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  /* Clock colon blink */
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .colon { animation: blink 1s ease-in-out infinite; }
  /* Radar spin */
  @keyframes radar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .radar-arm { transform-origin: 50% 50%; animation: radar 4s linear infinite; }
  /* Wave drift */
  @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-18px); } }
  .wave-a { animation: drift 14s ease-in-out infinite; }
  .wave-b { animation: drift 18s ease-in-out infinite reverse; }
  /* Helix flow */
  @keyframes helixflow { to { stroke-dashoffset: -300; } }
  .helix-line { animation: helixflow 7s linear infinite; }
  .helix-line-r { animation: helixflow 9s linear infinite; }
  /* Torn paper */
  .torn { clip-path: polygon(0% 8px,4% 0%,9% 7px,15% 1px,21% 8px,27% 0%,33% 7px,39% 1px,45% 8px,51% 0%,57% 7px,63% 1px,69% 8px,75% 0%,81% 7px,87% 1px,93% 8px,99% 0%,100% 0%,100% 100%,0% 100%); }
  /* Tag */
  .tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 7px; border: 1px solid currentColor;
    border-radius: 2px; display: inline-block;
  }
  /* Quick-log input */
  .quick-log input {
    background: rgba(44,44,44,0.04); border: 1px solid rgba(44,44,44,0.15);
    border-radius: 8px; padding: 10px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--charcoal); width: 100%; outline: none;
    transition: border-color 0.15s;
  }
  .quick-log input:focus { border-color: var(--terra); }
  .quick-log input::placeholder { color: rgba(44,44,44,0.35); }
  /* Task item */
  .task-item { transition: opacity 0.2s ease; }
  .task-item.done { opacity: 0.55; }
  /* Add task input */
  .add-task-input {
    background: transparent; border: none; border-bottom: 1px solid rgba(44,44,44,0.2);
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--charcoal);
    padding: 6px 4px; width: 100%; outline: none;
  }
  .add-task-input::placeholder { color: rgba(44,44,44,0.3); }
  /* Mobile responsive */
  @media (max-width: 700px) {
    .sidebar { width: 50px; }
    .main-scroll { left: 50px; }
    .grid-3 { grid-template-columns: 1fr !important; }
    .grid-2 { grid-template-columns: 1fr !important; }
    .hero-text { font-size: 42px !important; }
    .hero-pad { padding: 24px 20px 0 20px !important; }
    .hide-mobile { display: none !important; }
  }
  /* Toast notification */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--charcoal); color: var(--cream);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 10px 20px; border-radius: 6px; z-index: 9999;
    animation: toastIn 0.2s ease; letter-spacing: 0.04em;
  }
  @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(8px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
  /* Committee running state */
  @keyframes thinking { 0%,100%{opacity:0.3} 50%{opacity:1} }
  .thinking-dot { animation: thinking 1.2s ease-in-out infinite; }
  .thinking-dot:nth-child(2) { animation-delay: 0.4s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.8s; }
  /* Collage images */
  .collage-img { mix-blend-mode: multiply; filter: grayscale(1) contrast(1.15); }
  /* Button base */
  .btn-primary {
    background: var(--terra); color: var(--cream); border: none; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    padding: 9px 18px; border-radius: 6px; transition: opacity 0.15s;
    text-transform: uppercase;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  /* Error state */
  .error-banner {
    background: rgba(217,106,83,0.1); border: 1px solid rgba(217,106,83,0.3);
    border-radius: 8px; padding: 10px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--terra);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── Constants ─────────────────────────────────────────── */
const C = { terra:'#D96A53', ochre:'#C49A45', olive:'#6B705C', charcoal:'#2C2C2C', cream:'#EFEBE2' };
const LS_TASKS    = 'finos_tasks_v2';
const LS_EXPENSES = 'finos_expenses_v2';
const LS_COUNCIL  = 'finos_council_v2';

/* ── LocalStorage helpers ───────────────────────────────── */
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

/* ── Default data ───────────────────────────────────────── */
const DEFAULT_TASKS = [
  { id:1, label:'Japanese',           done:false, priority:'LOW',  cat:'Study',    due:'daily', recurring:true },
  { id:2, label:'Math Tutoring Prep', done:false, priority:'HIGH', cat:'Work',     due:'daily', recurring:true },
  { id:3, label:'Club Event',         done:false, priority:'MED',  cat:'Social',   due:null },
  { id:4, label:'Lab Reports',        done:false, priority:'HIGH', cat:'Academic', due:null },
  { id:5, label:'Gym Progress',       done:false, priority:'LOW',  cat:'Health',   due:'daily', recurring:true },
];
const DEFAULT_EXPENSES = [
  { id:1, label:'Clothes',        amt:89000, card:'A', cat:'Shopping',  date:'Mon', usd:false },
  { id:2, label:'Study Materials',amt:34500, card:'B', cat:'Education', date:'Tue', usd:false },
  { id:3, label:'Sinchon Cafe',   amt:12000, card:'C', cat:'Food',      date:'Wed', usd:false },
  { id:4, label:'Convenience',    amt:8700,  card:'C', cat:'Food',      date:'Thu', usd:false },
  { id:5, label:'Transport',      amt:5300,  card:'B', cat:'Transport', date:'Fri', usd:false },
];

/* ── Fuzzy category resolver ────────────────────────────── */
const PLACE_ALIASES = {
  // Food & Drink
  'cafe':['cafe','caffe','coffee','cof','kopi','카페','카피','cofee'],
  'gs25':['gs25','gs 25','gs','편의점','convenience'],
  'cu':['cu','씨유'],
  '7eleven':['7eleven','7-eleven','711','세븐'],
  'starbucks':['starbucks','sbux','스벅','스타벅스'],
  'meal':['meal','lunch','dinner','breakfast','식사','밥','점심','저녁'],
  'boba':['boba','bubble tea','공차','gongcha','버블'],
  // Transport
  'subway':['subway','metro','지하철'],
  'bus':['bus','버스'],
  'taxi':['taxi','kakao taxi','카카오택시','cab'],
  // Shopping
  'coupang':['coupang','쿠팡'],
  'olive young':['olive young','올리브영','oliveyoung'],
  'daiso':['daiso','다이소'],
  // Study/Work
  'book':['book','책','textbook','교재'],
  'printing':['print','printing','인쇄'],
  // Health
  'gym':['gym','헬스','fitness','운동'],
  'pharmacy':['pharmacy','약국','cvs'],
};
const CAT_MAP = {
  'cafe':'Food','gs25':'Food','cu':'Food','7eleven':'Food','starbucks':'Food','meal':'Food','boba':'Food',
  'subway':'Transport','bus':'Transport','taxi':'Transport',
  'coupang':'Shopping','olive young':'Shopping','daiso':'Shopping',
  'book':'Education','printing':'Education',
  'gym':'Health','pharmacy':'Health',
};
function fuzzyResolvePlace(input) {
  if (!input) return { canonical: input, cat: 'Other' };
  const s = input.toLowerCase().trim();
  for (const [canonical, aliases] of Object.entries(PLACE_ALIASES)) {
    if (aliases.some(a => s.includes(a) || a.includes(s))) {
      return { canonical: canonical.charAt(0).toUpperCase()+canonical.slice(1), cat: CAT_MAP[canonical]||'Other' };
    }
  }
  return { canonical: input.charAt(0).toUpperCase()+input.slice(1), cat: 'Other' };
}
function makeExpense(amt, place, card) {
  const { canonical, cat } = fuzzyResolvePlace(place);
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const now = new Date();
  return { id:Date.now(), label: canonical||'Expense', amt: parseInt(amt)||0, card: card||'B', cat, date:days[now.getDay()], usd: false, ts: Date.now(), month: now.getMonth(), year: now.getFullYear() };
}

/* ── Icon helper ────────────────────────────────────────── */
function Icon({ name, size=18, color, style:st={} }) {
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    ref.current.innerHTML = '';
    try {
      const key = name.split('-').map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join('');
      const iconData = window.lucide && window.lucide[key];
      if(!iconData) return;
      const svgNS = 'http://www.w3.org/2000/svg';
      function buildEl([tag, attrs, children]) {
        const el = document.createElementNS(svgNS, tag);
        Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,String(v)));
        (children||[]).forEach(child=>{ if(Array.isArray(child)) el.appendChild(buildEl(child)); });
        return el;
      }
      const [tag, attrs, children] = iconData;
      const svg = buildEl([tag, {...(attrs||{}), width:size, height:size, stroke: color||'currentColor'}, children]);
      ref.current.appendChild(svg);
    } catch(e) {}
  },[name,size,color]);
  return <span ref={ref} style={{display:'inline-flex',alignItems:'center',...st}} />;
}

/* ── Toast ──────────────────────────────────────────────── */
function Toast({ msg, onDone }) {
  useEffect(()=>{ const t=setTimeout(onDone,2200); return()=>clearTimeout(t); },[]);
  return <div className="toast">{msg}</div>;
}

/* ── Live Clock KST ─────────────────────────────────────── */
function useClock() {
  const [t,setT]=useState(new Date());
  useEffect(()=>{ const id=setInterval(()=>setT(new Date()),1000); return()=>clearInterval(id); },[]);
  return t;
}

/* ── Decorative SVGs ────────────────────────────────────── */
function TopologicalMap({width=320,height=180,color=C.terra,offsetX=0}){
  const lines=useMemo(()=>{
    const res=[];
    for(let i=0;i<14;i++){
      const y0=16+i*11; const amp=16+Math.sin(i*0.7)*12; const freq=0.016+i*0.002;
      let d=`M 0 ${y0}`;
      for(let x=0;x<=width;x+=5){ d+=` L ${x} ${y0+amp*Math.sin(x*freq+i*0.5+offsetX)}`; }
      res.push(<path key={i} d={d} stroke={color} strokeWidth="0.7" fill="none" opacity={0.55+((i%3)*0.12)}/>);
    }
    return res;
  },[width,height,color,offsetX]);
  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{overflow:'visible'}}>{lines}</svg>;
}

function Crosshair({size=40,color=C.ochre,opacity=0.5}){
  const r=size/2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{opacity}}>
      <circle cx={r} cy={r} r={r-2} stroke={color} strokeWidth="0.8" fill="none" strokeDasharray="3 4"/>
      <circle cx={r} cy={r} r={4} stroke={color} strokeWidth="0.8" fill="none"/>
      <line x1={0} y1={r} x2={size} y2={r} stroke={color} strokeWidth="0.8"/>
      <line x1={r} y1={0} x2={r} y2={size} stroke={color} strokeWidth="0.8"/>
      <circle cx={r} cy={r} r={1.5} fill={color}/>
    </svg>
  );
}

function RadarAccent({size=60,color=C.olive}){
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{opacity:0.38}}>
      <circle cx={size/2} cy={size/2} r={size/2-2} stroke={color} strokeWidth="0.7" fill="none" strokeDasharray="2 3"/>
      <circle cx={size/2} cy={size/2} r={size/3}   stroke={color} strokeWidth="0.7" fill="none" opacity="0.6"/>
      <circle cx={size/2} cy={size/2} r={size/6}   stroke={color} strokeWidth="0.7" fill="none" opacity="0.4"/>
      <g className="radar-arm">
        <line x1={size/2} y1={size/2} x2={size/2} y2={2} stroke={color} strokeWidth="1" opacity="0.8"/>
      </g>
    </svg>
  );
}

function FlowingDataWaves({w=1200,h=400}){
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid slice"
      style={{position:'absolute',top:0,left:0}}>
      <defs>
        <filter id="glow-t"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="glow-o"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g className="wave-b">
        {[0.6,0.72].map((yf,i)=>(
          <path key={i} d={`M -20 ${h*yf} C ${w*0.2} ${h*(yf-0.22)}, ${w*0.45} ${h*(yf+0.12)}, ${w*0.65} ${h*(yf-0.1)} S ${w*0.88} ${h*(yf-0.28)}, ${w+20} ${h*(yf-0.08)}`}
            stroke={C.ochre} strokeWidth={1.1-i*0.15} fill="none" opacity={0.42-i*0.07} filter="url(#glow-o)"/>
        ))}
      </g>
      <g className="wave-a">
        {[0.35,0.48,0.56].map((yf,i)=>(
          <path key={i} d={`M -20 ${h*yf} C ${w*0.15} ${h*(yf-0.2)}, ${w*0.38} ${h*(yf+0.2)}, ${w*0.58} ${h*(yf-0.07)} S ${w*0.82} ${h*(yf-0.18)}, ${w+20} ${h*(yf+0.05)}`}
            stroke={C.terra} strokeWidth={1.7-i*0.25} fill="none" opacity={0.48-i*0.09} filter="url(#glow-t)"/>
        ))}
      </g>
      {[[w*0.28,h*0.35],[w*0.55,h*0.28],[w*0.72,h*0.44],[w*0.42,h*0.61]].map(([x,y],i)=>(
        <g key={i}><circle cx={x} cy={y} r={3} fill={C.terra} opacity={0.7}/><circle cx={x} cy={y} r={7} stroke={C.terra} strokeWidth="0.8" fill="none" opacity={0.28}/></g>
      ))}
      {Array.from({length:18},(_,i)=>(
        <line key={i} x1={i*(w/18)} y1={h-6} x2={i*(w/18)} y2={i%6===0?h-14:h-10}
          stroke={C.charcoal} strokeWidth="0.7" opacity="0.1"/>
      ))}
    </svg>
  );
}

function DataHelix({height=800}){
  const cx=75, amp=52, period=88;
  const steps=Math.floor(height/4);
  let lp='', rp='';
  const dots=[], crossY=[];
  for(let i=0;i<=steps;i++){
    const y=i*4, x=cx+amp*Math.sin((y/period)*2*Math.PI), x2=cx-amp*Math.sin((y/period)*2*Math.PI);
    lp += i===0?`M ${x} ${y}`:`L ${x} ${y}`;
    rp += i===0?`M ${x2} ${y}`:`L ${x2} ${y}`;
    if(Math.abs(Math.sin((y/period)*2*Math.PI))<0.06){ dots.push({x:cx,y,c:true}); crossY.push(y); }
    else if(i%14===0) dots.push({x,y,c:false});
  }
  return (
    <svg width={cx*2+amp+16} height={height} style={{position:'absolute',right:0,top:0,opacity:0.2}}>
      <defs><filter id="hglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <path d={lp} stroke={C.terra} strokeWidth="1.2" fill="none" strokeDasharray="200" className="helix-line" filter="url(#hglow)"/>
      <path d={rp} stroke={C.ochre} strokeWidth="1.2" fill="none" strokeDasharray="200" className="helix-line-r" filter="url(#hglow)"/>
      {dots.map((d,i)=><circle key={i} cx={d.x} cy={d.y} r={d.c?3:1.5} fill={d.c?C.olive:C.terra} opacity={d.c?1:0.7}/>)}
      {crossY.map((y,i)=>(
        <g key={i}><line x1={cx-14} y1={y} x2={cx+14} y2={y} stroke={C.olive} strokeWidth="0.7" opacity="0.5"/>
        <text x={cx+amp+4} y={y+3} fill={C.charcoal} fontSize="7" style={{fontFamily:'IBM Plex Mono',opacity:0.3}}>{String(i).padStart(2,'0')}</text></g>
      ))}
    </svg>
  );
}

/* ── Sparkline (seeded stable) ──────────────────────────── */
function Sparkline({seed,color,w=100,h=36}){
  const data = useMemo(()=>{
    // Seeded pseudo-random so it doesn't regenerate
    let s=seed;
    const rng=()=>{ s=(s*9301+49297)%233280; return s/233280; };
    return Array.from({length:18},(_,i)=>42+rng()*18+i*1.2);
  },[seed]);
  const min=Math.min(...data), max=Math.max(...data);
  const pts=data.map((v,i)=>[( i/(data.length-1))*w, h-((v-min)/(max-min||1))*(h-4)-2]);
  const d=pts.map((p,i)=>(i===0?`M ${p[0]} ${p[1]}`:`L ${p[0]} ${p[1]}`)).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <path d={d} stroke={color} strokeWidth="1.5" fill="none"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r={2.5} fill={color}/>
    </svg>
  );
}

/* ══════════════════════════════════════════════════════════
   VIEW 1 — BRIEFING
══════════════════════════════════════════════════════════ */
function BriefingView({ expenses, onAddExpense, onDeleteExpense, onEditExpense }) {
  const time = useClock();
  const kst  = new Date(time.toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
  const hh=String(kst.getHours()).padStart(2,'0');
  const mm=String(kst.getMinutes()).padStart(2,'0');
  const ss=String(kst.getSeconds()).padStart(2,'0');
  const dateStr=kst.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Seoul'});

  // Structured log form
  const [logAmt,  setLogAmt]  = useState('');
  const [logPlace,setLogPlace]= useState('');
  const [logCard, setLogCard] = useState('B');
  const [logSuggestion, setLogSuggestion] = useState(null);
  const [logErr, setLogErr]   = useState('');
  // Edit state
  const [editId, setEditId]   = useState(null);
  const [editAmt, setEditAmt] = useState('');
  const [editLabel, setEditLabel] = useState('');
  const [editCard, setEditCard]   = useState('B');
  // Filter state
  const [filterCard, setFilterCard] = useState('All');
  const [filterCat,  setFilterCat]  = useState('All');
  // Month navigation — default to current month
  const nowDate = new Date();
  const [viewYear,  setViewYear]  = useState(nowDate.getFullYear());
  const [viewMonth, setViewMonth] = useState(nowDate.getMonth()); // 0-indexed
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const isCurrentViewMonth = viewYear===nowDate.getFullYear() && viewMonth===nowDate.getMonth();
  function goExpMonth(dir){
    let m=viewMonth+dir, y=viewYear;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    setViewMonth(m); setViewYear(y);
  }

  // Fuzzy place suggestion while typing
  useEffect(()=>{
    if(!logPlace.trim()){ setLogSuggestion(null); return; }
    const { canonical, cat } = fuzzyResolvePlace(logPlace);
    if(canonical.toLowerCase()!==logPlace.toLowerCase()) setLogSuggestion({canonical,cat});
    else setLogSuggestion(null);
  },[logPlace]);

  // Real weather fetch
  const [wx, setWx] = useState([]);
  useEffect(()=>{
    const WC_COND=['Clear','Mainly Clear','Partly Cloudy','Overcast','Fog','Drizzle','Rain','Snow','Showers','Thunderstorm'];
    const WC_ICON=['☀️','🌤️','⛅','☁️','🌫️','🌦️','🌧️','🌨️','🌧️','⛈️'];
    function codeToIdx(code){
      if(code===0) return 0; if(code<=2) return 1; if(code===3) return 3;
      if(code<=49) return 4; if(code<=69) return 5; if(code<=79) return 7;
      if(code<=99) return 9; return 2;
    }
    const coords=[{loc:'Incheon',lat:37.456,lon:126.705},{loc:'Songdo',lat:37.383,lon:126.657},{loc:'Sinchon',lat:37.559,lon:126.937}];
    Promise.all(coords.map(c=>
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current_weather=true&hourly=relativehumidity_2m,apparent_temperature&timezone=Asia%2FSeoul`)
        .then(r=>r.json())
        .then(d=>{
          const idx=codeToIdx(d.current_weather.weathercode);
          const hr=new Date().getHours();
          return {
            loc:c.loc,
            temp:`${Math.round(d.current_weather.temperature)}°C`,
            feels:`${Math.round(d.hourly?.apparent_temperature?.[hr]||d.current_weather.temperature)}°C`,
            cond:WC_COND[idx],
            icon:WC_ICON[idx],
            hum: d.hourly?.relativehumidity_2m?.[hr]||'—',
          };
        })
        .catch(()=>({loc:c.loc,temp:'—',feels:'—',cond:'Unavailable',icon:'🌤️',hum:'—'}))
    )).then(setWx);
  },[]);

  const wxData = wx.length===3 ? wx : [{loc:'Incheon',temp:'—',feels:'—',cond:'Loading…',icon:'🌤️',hum:'—'},{loc:'Songdo',temp:'—',feels:'—',cond:'Loading…',icon:'🌥️',hum:'—'},{loc:'Sinchon',temp:'—',feels:'—',cond:'Loading…',icon:'🌫️',hum:'—'}];

  function handleLog(ev){
    ev.preventDefault();
    if(!logAmt.trim()||isNaN(parseInt(logAmt))){ setLogErr('Enter a valid amount'); return; }
    if(!logPlace.trim()){ setLogErr('Enter a place or description'); return; }
    const exp = makeExpense(logAmt, logPlace, logCard);
    onAddExpense(exp);
    setLogAmt(''); setLogPlace(''); setLogCard('B'); setLogErr(''); setLogSuggestion(null);
  }

  function startEdit(e){
    setEditId(e.id); setEditAmt(String(e.amt)); setEditLabel(e.label); setEditCard(e.card);
  }
  function saveEdit(){
    onEditExpense(editId,{amt:parseInt(editAmt)||0,label:editLabel,card:editCard});
    setEditId(null);
  }

  // Expenses for selected month — fallback: if expense has no month/year, use ts
  function expInMonth(e) {
    const m = e.month !== undefined ? e.month : (e.ts ? new Date(e.ts).getMonth() : -1);
    const y = e.year  !== undefined ? e.year  : (e.ts ? new Date(e.ts).getFullYear() : -1);
    return m===viewMonth && y===viewYear;
  }
  const monthExpenses = expenses.filter(expInMonth);

  // Spending chart — bar chart by category, filtered
  const filteredExpenses = monthExpenses.filter(e=>
    (filterCard==='All'||e.card===filterCard)&&
    (filterCat==='All'||e.cat===filterCat)
  );
  const chartExpenses = filteredExpenses.slice(-8);
  const chartMax = Math.max(...chartExpenses.map(e=>e.amt),1);
  const CHART_W=340, CHART_H=110, CHART_PAD_L=52, CHART_PAD_B=22, CHART_PAD_T=12, CHART_PAD_R=12;
  const plotW = CHART_W-CHART_PAD_L-CHART_PAD_R;
  const plotH = CHART_H-CHART_PAD_B-CHART_PAD_T;
  const barW = Math.max(16, (plotW/Math.max(chartExpenses.length,1))-8);
  // Y axis gridlines
  const yTicks = [0, Math.round(chartMax*0.5), chartMax];
  function yPos(amt){ return CHART_PAD_T + plotH - (amt/chartMax)*plotH; }
  const catColors={'Food':C.terra,'Transport':C.ochre,'Education':C.olive,'Shopping':'#8B6F5E','Health':'#5E7B8B','Other':C.charcoal};

  const cardBudgets=[
    {card:'A',label:'Personal debit',desc:'Direct debit, yours',spent:monthExpenses.filter(e=>e.card==='A').reduce((a,b)=>a+b.amt,0),cap:null,color:C.terra},
    {card:'B',label:'Monthly budget',desc:'Cap: ₩300K',spent:monthExpenses.filter(e=>e.card==='B').reduce((a,b)=>a+b.amt,0),cap:300000,color:C.ochre},
    {card:'C',label:'Credit card',desc:'Min spend: ₩500K',spent:monthExpenses.filter(e=>e.card==='C').reduce((a,b)=>a+b.amt,0),cap:500000,color:C.olive},
  ];

  return (
    <div className="tab-view" style={{minHeight:'100vh',paddingBottom:60,position:'relative'}}>
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
        <FlowingDataWaves w={1200} h={420}/>
        <div style={{position:'absolute',bottom:20,right:30,opacity:0.12}} className="hide-mobile">
          <TopologicalMap width={260} height={150} color={C.ochre} offsetX={1.2}/>
        </div>
      </div>

      <div style={{position:'relative',zIndex:10,padding:'44px 44px 0'}} className="hero-pad">
        <span className="tag" style={{color:C.olive,borderColor:C.olive,opacity:0.7,marginBottom:8,display:'inline-block'}}>KST — Seoul Operations</span>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
          <h1 className="font-serif hero-text" style={{fontSize:64,lineHeight:1,fontWeight:300,letterSpacing:'-0.02em',marginBottom:4}}>
            Morning<br/><em style={{color:C.terra}}>Briefing</em>
          </h1>
          {/* Month navigator */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginTop:12}}>
            <button onClick={()=>goExpMonth(-1)} style={{background:'none',border:'1px solid rgba(44,44,44,0.18)',borderRadius:6,cursor:'pointer',fontSize:14,color:C.charcoal,opacity:0.55,padding:'2px 10px',fontFamily:'IBM Plex Mono'}}>‹</button>
            <div style={{textAlign:'center',minWidth:120}}>
              <p className="font-mono" style={{fontSize:9,opacity:0.4,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:1}}>{viewYear}</p>
              <p className="font-serif" style={{fontSize:17,fontWeight:300,color:isCurrentViewMonth?C.terra:C.charcoal}}>{MONTH_NAMES[viewMonth]}</p>
            </div>
            <button onClick={()=>goExpMonth(1)} disabled={isCurrentViewMonth}
              style={{background:'none',border:'1px solid rgba(44,44,44,0.18)',borderRadius:6,cursor:isCurrentViewMonth?'not-allowed':'pointer',fontSize:14,color:C.charcoal,opacity:isCurrentViewMonth?0.2:0.55,padding:'2px 10px',fontFamily:'IBM Plex Mono'}}>›</button>
            {!isCurrentViewMonth&&(
              <button onClick={()=>{setViewYear(nowDate.getFullYear());setViewMonth(nowDate.getMonth());}}
                style={{fontFamily:'IBM Plex Mono',fontSize:8,color:C.terra,background:'transparent',border:`1px solid ${C.terra}`,borderRadius:4,padding:'3px 8px',cursor:'pointer',letterSpacing:'0.06em'}}>↩ Now</button>
            )}
          </div>
        </div>
        <div className="font-mono" style={{fontSize:13,opacity:0.55,marginBottom:28,letterSpacing:'0.12em'}}>
          {hh}<span className="colon">:</span>{mm}<span className="colon">:</span>{ss} · {dateStr}
        </div>

        {/* ── Quick Log ── */}
        <div className="glass" style={{borderRadius:12,padding:'18px 22px',marginBottom:22,maxWidth:680}}>
          <p className="font-mono" style={{fontSize:9,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:12}}>
            Quick Log · Expense Entry
          </p>
          <form onSubmit={handleLog}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 2fr 1fr auto',gap:10,alignItems:'end'}}>
              {/* Amount */}
              <div>
                <p className="font-mono" style={{fontSize:8,opacity:0.4,marginBottom:5,letterSpacing:'0.06em'}}>AMOUNT (₩)</p>
                <input value={logAmt} onChange={e=>{setLogAmt(e.target.value);setLogErr('');}}
                  placeholder="12000" type="number" min="0"
                  style={{background:'rgba(44,44,44,0.04)',border:`1px solid ${logErr&&!logAmt?C.terra:'rgba(44,44,44,0.15)'}`,borderRadius:8,padding:'9px 12px',fontFamily:'IBM Plex Mono',fontSize:12,color:C.charcoal,width:'100%',outline:'none'}}/>
              </div>
              {/* Place */}
              <div style={{position:'relative'}}>
                <p className="font-mono" style={{fontSize:8,opacity:0.4,marginBottom:5,letterSpacing:'0.06em'}}>WHERE / WHAT</p>
                <input value={logPlace} onChange={e=>{setLogPlace(e.target.value);setLogErr('');}}
                  placeholder="GS25, cafe, gym…"
                  style={{background:'rgba(44,44,44,0.04)',border:`1px solid ${logErr&&!logPlace?C.terra:'rgba(44,44,44,0.15)'}`,borderRadius:8,padding:'9px 12px',fontFamily:'IBM Plex Mono',fontSize:12,color:C.charcoal,width:'100%',outline:'none'}}/>
                {logSuggestion&&(
                  <div style={{position:'absolute',top:'100%',left:0,right:0,zIndex:50,marginTop:2,
                    background:C.cream,border:'1px solid rgba(44,44,44,0.15)',borderRadius:6,padding:'6px 10px',
                    display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',boxShadow:'0 4px 12px rgba(0,0,0,0.08)'}}
                    onClick={()=>{setLogPlace(logSuggestion.canonical);setLogSuggestion(null);}}>
                    <span className="font-mono" style={{fontSize:10,color:C.charcoal}}>→ {logSuggestion.canonical}</span>
                    <span className="tag" style={{fontSize:7,color:C.olive,borderColor:C.olive}}>{logSuggestion.cat}</span>
                  </div>
                )}
              </div>
              {/* Card selector */}
              <div>
                <p className="font-mono" style={{fontSize:8,opacity:0.4,marginBottom:5,letterSpacing:'0.06em'}}>CARD</p>
                <div style={{display:'flex',gap:4}}>
                  {[{k:'A',tip:'Personal debit'},{k:'B',tip:'Monthly ₩300K'},{k:'C',tip:'Credit card'}].map(({k,tip})=>(
                    <button key={k} type="button" title={tip} onClick={()=>setLogCard(k)}
                      style={{flex:1,height:36,borderRadius:6,border:`1px solid ${logCard===k?cardBudgets.find(c=>c.card===k).color:'rgba(44,44,44,0.15)'}`,
                        background:logCard===k?cardBudgets.find(c=>c.card===k).color+'22':'transparent',
                        fontFamily:'IBM Plex Mono',fontSize:11,color:logCard===k?cardBudgets.find(c=>c.card===k).color:C.charcoal,
                        cursor:'pointer',fontWeight:logCard===k?500:400,transition:'all 0.12s'}}>
                      {k}
                    </button>
                  ))}
                </div>
              </div>
              <button type="submit" className="btn-primary" style={{height:36,padding:'0 18px',whiteSpace:'nowrap',alignSelf:'end'}}>
                + Log
              </button>
            </div>
            {logErr && <p style={{fontSize:10,color:C.terra,marginTop:6,fontFamily:'IBM Plex Mono'}}>{logErr}</p>}
          </form>
        </div>

        {/* ── Weather ── */}
        <div className="grid-3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:20}}>
          {wxData.map(w=>(
            <div key={w.loc} className="glass" style={{borderRadius:12,padding:'18px 20px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                <div>
                  <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:3}}>Weather · {w.loc}</p>
                  <p className="font-serif" style={{fontSize:30,fontWeight:300,lineHeight:1}}>{w.temp}</p>
                  {w.feels!=='—'&&<p className="font-mono" style={{fontSize:9,opacity:0.4,marginTop:3}}>Feels {w.feels}</p>}
                </div>
                <span style={{fontSize:26}}>{w.icon}</span>
              </div>
              <p style={{fontSize:11,opacity:0.6}}>{w.cond}</p>
              {w.hum!=='—' && <p className="font-mono" style={{fontSize:9,color:C.olive,marginTop:4}}>Humidity {w.hum}%</p>}
            </div>
          ))}
        </div>

        {/* ── Expense filters ── */}
        {expenses.length>0&&(
          <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
            <span className="font-mono" style={{fontSize:8,opacity:0.4,letterSpacing:'0.06em'}}>FILTER:</span>
            {['All','A','B','C'].map(f=>(
              <button key={f} type="button" onClick={()=>setFilterCard(f)}
                style={{fontFamily:'IBM Plex Mono',fontSize:9,padding:'3px 10px',borderRadius:20,
                  border:`1px solid ${filterCard===f?(f==='All'?C.charcoal:cardBudgets.find(c=>c.card===f)?.color||C.charcoal):'rgba(44,44,44,0.18)'}`,
                  background:filterCard===f?'rgba(44,44,44,0.06)':'transparent',
                  color:filterCard===f?(f==='All'?C.charcoal:cardBudgets.find(c=>c.card===f)?.color||C.charcoal):C.charcoal,
                  cursor:'pointer',transition:'all 0.12s'}}>
                {f==='All'?'All Cards':`Card ${f}`}
              </button>
            ))}
            {['All','Food','Transport','Education','Shopping','Health','Other'].map(f=>(
              <button key={f} type="button" onClick={()=>setFilterCat(f)}
                style={{fontFamily:'IBM Plex Mono',fontSize:9,padding:'3px 10px',borderRadius:20,
                  border:`1px solid ${filterCat===f?C.ochre:'rgba(44,44,44,0.12)'}`,
                  background:filterCat===f?`${C.ochre}18`:'transparent',
                  color:filterCat===f?C.ochre:C.charcoal,
                  cursor:'pointer',transition:'all 0.12s',opacity:monthExpenses.some(e=>e.cat===f||f==='All')?1:0.3}}>
                {f}
              </button>
            ))}
          </div>
        )}

        {/* ── Spending chart + card budgets ── */}
        <div className="grid-2" style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:18,alignItems:'start'}}>
          <div className="glass" style={{borderRadius:12,padding:'22px 26px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div>
                <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em'}}>Recent · Expenditure</p>
                <p className="font-serif" style={{fontSize:20,fontWeight:300,marginTop:2}}>Spending Flow · {MONTH_NAMES[viewMonth].slice(0,3)}</p>
              </div>
              <p className="font-serif" style={{fontSize:22,color:C.terra,fontWeight:300}}>
                ₩{monthExpenses.reduce((a,e)=>a+e.amt,0).toLocaleString()}
              </p>
            </div>

            {/* Proper bar chart */}
            <svg width="100%" height={CHART_H} viewBox={`0 0 ${CHART_W} ${CHART_H}`} preserveAspectRatio="xMidYMid meet" style={{marginBottom:10,display:'block'}}>
              <defs>
                <filter id="mg2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              </defs>
              {/* Y-axis gridlines + labels */}
              {yTicks.map((v,i)=>{
                const y=yPos(v);
                const label = v>=10000?`${Math.round(v/1000)}K`:v>0?String(v):'0';
                return (
                  <g key={i}>
                    <line x1={CHART_PAD_L} y1={y} x2={CHART_W-CHART_PAD_R} y2={y} stroke={C.charcoal} strokeWidth="0.5" strokeDasharray="3 5" opacity="0.12"/>
                    <text x={CHART_PAD_L-4} y={y+3} fill={C.charcoal} fontSize="7.5" textAnchor="end" style={{fontFamily:'IBM Plex Mono',opacity:0.35}}>₩{label}</text>
                  </g>
                );
              })}
              {/* Y axis label */}
              <text transform={`rotate(-90) translate(-${CHART_H/2},10)`} fill={C.charcoal} fontSize="7" textAnchor="middle" style={{fontFamily:'IBM Plex Mono',opacity:0.25}}>AMOUNT (₩)</text>
              {/* Bars */}
              {chartExpenses.map((e,i)=>{
                const spacing = plotW/Math.max(chartExpenses.length,1);
                const cx = CHART_PAD_L + spacing*i + spacing/2;
                const barH = Math.max(3,(e.amt/chartMax)*plotH);
                const x = cx - barW/2;
                const y = CHART_PAD_T + plotH - barH;
                const color = catColors[e.cat]||C.charcoal;
                return (
                  <g key={e.id||i}>
                    <rect x={x} y={y} width={barW} height={barH} fill={color} opacity={0.65} rx={2}/>
                    <rect x={x} y={y} width={barW} height={2} fill={color} opacity={0.9} rx={1}/>
                    {/* Amount on hover via title */}
                    <title>{e.label}: ₩{e.amt.toLocaleString()}</title>
                    {/* Amount label on bar if tall enough */}
                    {barH>18&&<text x={cx} y={y+10} fill="#EFEBE2" fontSize="7" textAnchor="middle" style={{fontFamily:'IBM Plex Mono',opacity:0.85}}>
                      {e.amt>=1000?`${Math.round(e.amt/1000)}K`:e.amt}
                    </text>}
                    {/* X label: short place name */}
                    <text x={cx} y={CHART_H-5} fill={C.charcoal} fontSize="7.5" textAnchor="middle" style={{fontFamily:'IBM Plex Mono',opacity:0.5}}>{(e.label||'').slice(0,5)}</text>
                  </g>
                );
              })}
              {/* Axes */}
              <line x1={CHART_PAD_L} y1={CHART_PAD_T} x2={CHART_PAD_L} y2={CHART_PAD_T+plotH} stroke={C.charcoal} strokeWidth="0.7" opacity="0.2"/>
              <line x1={CHART_PAD_L} y1={CHART_PAD_T+plotH} x2={CHART_W-CHART_PAD_R} y2={CHART_PAD_T+plotH} stroke={C.charcoal} strokeWidth="0.7" opacity="0.2"/>
            </svg>

            {/* Legend */}
            <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:14}}>
              {Object.entries(catColors).filter(([cat])=>monthExpenses.some(e=>e.cat===cat)).map(([cat,col])=>(
                <div key={cat} style={{display:'flex',alignItems:'center',gap:4}}>
                  <div style={{width:8,height:8,borderRadius:2,background:col,opacity:0.7}}/>
                  <span className="font-mono" style={{fontSize:8,opacity:0.5}}>{cat}</span>
                </div>
              ))}
            </div>

            {/* Log list with edit/delete */}
            {filteredExpenses.length===0&&(
              <p className="font-mono" style={{fontSize:10,opacity:0.35,textAlign:'center',padding:'12px 0'}}>No entries match filter</p>
            )}
            {filteredExpenses.slice(-6).reverse().map((e,i,arr)=>(
              <div key={e.id}>
                {editId===e.id ? (
                  <div style={{display:'grid',gridTemplateColumns:'1fr 2fr auto auto',gap:8,padding:'8px 0',alignItems:'center'}}>
                    <input value={editAmt} onChange={ev=>setEditAmt(ev.target.value)} type="number"
                      style={{fontFamily:'IBM Plex Mono',fontSize:11,border:'none',borderBottom:`1px solid ${C.terra}`,background:'transparent',outline:'none',color:C.charcoal,padding:'2px 4px'}}/>
                    <input value={editLabel} onChange={ev=>setEditLabel(ev.target.value)}
                      style={{fontFamily:'IBM Plex Mono',fontSize:11,border:'none',borderBottom:`1px solid ${C.terra}`,background:'transparent',outline:'none',color:C.charcoal,padding:'2px 4px'}}/>
                    <div style={{display:'flex',gap:4}}>
                      {['A','B','C'].map(k=>(
                        <button key={k} type="button" onClick={()=>setEditCard(k)}
                          style={{width:20,height:20,borderRadius:4,border:`1px solid ${editCard===k?C.terra:'rgba(44,44,44,0.2)'}`,
                            background:editCard===k?C.terra:'transparent',color:editCard===k?C.cream:C.charcoal,
                            fontFamily:'IBM Plex Mono',fontSize:9,cursor:'pointer'}}>{k}</button>
                      ))}
                    </div>
                    <div style={{display:'flex',gap:6}}>
                      <button onClick={saveEdit} style={{fontFamily:'IBM Plex Mono',fontSize:9,background:C.olive,color:C.cream,border:'none',borderRadius:4,padding:'3px 8px',cursor:'pointer'}}>Save</button>
                      <button onClick={()=>setEditId(null)} style={{fontFamily:'IBM Plex Mono',fontSize:9,background:'transparent',color:C.charcoal,border:'1px solid rgba(44,44,44,0.2)',borderRadius:4,padding:'3px 8px',cursor:'pointer'}}>✕</button>
                    </div>
                  </div>
                ) : (
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',
                    borderBottom:i<arr.length-1?'1px solid rgba(44,44,44,0.06)':'none'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <span style={{width:20,height:20,borderRadius:'50%',background:`${catColors[e.cat]||C.charcoal}22`,
                        display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontFamily:'IBM Plex Mono',
                        color:catColors[e.cat]||C.charcoal,border:`1px solid ${catColors[e.cat]||C.charcoal}44`}}>{e.card}</span>
                      <div>
                        <span style={{fontSize:12}}>{e.label}</span>
                        <span className="font-mono" style={{fontSize:8,opacity:0.35,marginLeft:8}}>{e.cat}</span>
                      </div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <span className="font-mono" style={{fontSize:11,opacity:0.7}}>{e.usd?'$'+e.amt:'₩'+e.amt.toLocaleString()}</span>
                      <button onClick={()=>startEdit(e)} style={{background:'none',border:'none',cursor:'pointer',opacity:0.3,fontSize:11,color:C.charcoal,padding:'0 2px'}} title="Edit">✎</button>
                      <button onClick={()=>onDeleteExpense(e.id)} style={{background:'none',border:'none',cursor:'pointer',opacity:0.3,fontSize:14,color:C.charcoal,padding:'0 2px'}} title="Delete">×</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {cardBudgets.map(c=>(
              <div key={c.card} className="glass" style={{borderRadius:12,padding:'16px 18px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <div>
                    <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em'}}>Card {c.card}</p>
                    <p style={{fontSize:12,fontWeight:500,marginTop:1}}>{c.label}</p>
                    <p className="font-mono" style={{fontSize:8,opacity:0.4,marginTop:2}}>{c.desc}</p>
                  </div>
                  <Crosshair size={26} color={c.color} opacity={0.42}/>
                </div>
                <p className="font-serif" style={{fontSize:20,color:c.color,fontWeight:300}}>₩{c.spent.toLocaleString()}</p>
                {c.cap&&(
                  <div style={{marginTop:8}}>
                    <div style={{height:3,background:'rgba(44,44,44,0.08)',borderRadius:2}}>
                      <div style={{height:'100%',width:`${Math.min(100,(c.spent/c.cap)*100)}%`,
                        background:(c.spent/c.cap)>0.85?C.terra:c.color,borderRadius:2,opacity:0.7,transition:'width 0.4s ease'}}/>
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',marginTop:3}}>
                      <span className="font-mono" style={{fontSize:8,opacity:0.35}}>{Math.round((c.spent/c.cap)*100)}% used</span>
                      <span className="font-mono" style={{fontSize:8,opacity:0.35}}>of ₩{(c.cap/1000).toFixed(0)}K</span>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   VIEW 2 — MISSION
══════════════════════════════════════════════════════════ */
function MissionView({ tasks, onToggleTask, onAddTask, onDeleteTask }) {
  const [newTask,      setNewTask]      = useState('');
  const [newPri,       setNewPri]       = useState('MED');
  const [newCat,       setNewCat]       = useState('Study');
  const [newDueDate,   setNewDueDate]   = useState('');   // YYYY-MM-DD
  const [newDueTime,   setNewDueTime]   = useState('');   // HH:MM (24h)
  const [newRecurring, setNewRecurring] = useState(false);
  const [showAdd,      setShowAdd]      = useState(false);
  const [selectedDay,  setSelDay]       = useState(null);

  // Calendar month navigation
  const today = new Date();
  const [calYear,  setCalYear]  = useState(today.getFullYear());
  const [calMonth, setCalMonth] = useState(today.getMonth());

  const isCurrentMonth = calYear===today.getFullYear() && calMonth===today.getMonth();
  const calStart    = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const priColor    = {HIGH:C.terra, MED:C.ochre, LOW:C.olive};
  const DAY_NAMES   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS      = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function goMonth(dir){
    let m=calMonth+dir, y=calYear;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    setCalMonth(m); setCalYear(y); setSelDay(null);
  }

  // Pre-fill date picker with selected calendar day when add form opens
  function openAdd(){
    if(selectedDay){
      const mm = String(calMonth+1).padStart(2,'0');
      const dd = String(selectedDay).padStart(2,'0');
      setNewDueDate(`${calYear}-${mm}-${dd}`);
    } else {
      const mm = String(today.getMonth()+1).padStart(2,'0');
      const dd = String(today.getDate()).padStart(2,'0');
      setNewDueDate(`${today.getFullYear()}-${mm}-${dd}`);
    }
    setNewDueTime('');
    setShowAdd(true);
  }

  function submitTask(e){
    e.preventDefault();
    if(!newTask.trim()) return;
    // Store due as ISO date string (YYYY-MM-DD) or null for recurring
    const due = newRecurring ? 'daily' : (newDueDate||null);
    const dueTime = (!newRecurring && newDueDate && newDueTime) ? newDueTime : null;
    onAddTask({
      id: Date.now(), label: newTask.trim(), done: false,
      priority: newPri, cat: newCat,
      due, dueTime,
      recurring: newRecurring,
      createdDate: today.toDateString()
    });
    setNewTask(''); setNewDueDate(''); setNewDueTime('');
    setShowAdd(false); setNewRecurring(false);
  }

  // ── Task matching helpers ─────────────────────────────
  // Does a task belong on a given calendar date?
  function taskBelongsOnDate(t, year, month, dayNum) {
    if(t.recurring || t.due==='daily') return true;
    if(!t.due) return false;
    // ISO date string match: YYYY-MM-DD
    if(/^\d{4}-\d{2}-\d{2}$/.test(t.due)){
      const [ty, tm, td] = t.due.split('-').map(Number);
      return ty===year && tm===month+1 && td===dayNum;
    }
    // Legacy string fallbacks (Today, Mon, 15…)
    const date = new Date(year, month, dayNum);
    const dayName = DAY_NAMES[date.getDay()];
    const isToday = year===today.getFullYear() && month===today.getMonth() && dayNum===today.getDate();
    if(t.due==='Today' && isToday) return true;
    if(t.due==='Daily') return true;
    if(t.due===dayName) return true;
    if(t.due===String(dayNum)) return true;
    return false;
  }

  // Tasks to show in Sorties list: if a day is selected, filter to that day; otherwise show all non-done or today's
  const todayStr = today.toDateString();
  const processedTasks = tasks.map(t=>{
    if(t.done && (t.recurring||t.due==='daily') && t.completedDate && t.completedDate !== todayStr)
      return {...t, done:false, completedDate:null};
    return t;
  });

  const visibleTasks = selectedDay
    ? processedTasks.filter(t => taskBelongsOnDate(t, calYear, calMonth, selectedDay))
    : processedTasks.filter(t=>{
        // Always show recurring/daily tasks
        if(t.recurring || t.due==='daily' || t.due==='Daily') return true;
        // Show tasks with an ISO date due today
        if(/^\d{4}-\d{2}-\d{2}$/.test(t.due||'')){
          const [ty,tm,td] = t.due.split('-').map(Number);
          const isToday2 = ty===today.getFullYear() && tm===today.getMonth()+1 && td===today.getDate();
          if(isToday2) return true;
          // Show future tasks too (so nothing disappears until done)
          if(new Date(t.due) > today) return true;
          // Show overdue incomplete tasks
          if(!t.done) return true;
          // Show just-completed today
          return t.completedDate === todayStr;
        }
        // Legacy due values (Today/Mon/etc) — treat as one-time today only
        if(t.due==='Today'){
          return !t.done || t.completedDate===todayStr;
        }
        // Tasks with no due date — show if not done yet (user-added catch-all)
        if(!t.due) return !t.done || t.completedDate===todayStr;
        return false;
      });

  function handleToggle(id){ onToggleTask(id, todayStr); }

  // Calendar: tasks for each day (for dot indicator)
  function getTasksForDay(dayNum){
    return tasks.filter(t=>taskBelongsOnDate(t, calYear, calMonth, dayNum));
  }

  const dayTasks = selectedDay ? getTasksForDay(selectedDay) : [];

  // Format due label for display in task card
  function formatDueLabel(t){
    if(t.recurring||t.due==='daily') return 'Daily';
    if(!t.due) return '—';
    if(/^\d{4}-\d{2}-\d{2}$/.test(t.due)){
      const [, tm, td] = t.due.split('-').map(Number);
      const label = `${MONTH_SHORT[tm-1]} ${td}`;
      return t.dueTime ? `${label} · ${t.dueTime}` : label;
    }
    return t.due; // legacy
  }

  return (
    <div className="tab-view" style={{minHeight:'100vh',paddingBottom:60,position:'relative'}}>
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
        <img src="https://images.unsplash.com/photo-1618945524163-32451704cbb8?w=400&q=70" alt=""
          className="collage-img" style={{position:'absolute',top:-20,right:50,width:260,height:360,objectFit:'cover',opacity:0.2,borderRadius:8}}/>
        <div style={{position:'absolute',top:60,right:180,width:300,height:300,borderRadius:'50%',background:C.terra,opacity:0.07,mixBlendMode:'multiply'}}/>
        <div style={{position:'absolute',bottom:30,right:30,opacity:0.1}} className="hide-mobile">
          <TopologicalMap width={220} height={130} color={C.olive}/>
        </div>
      </div>

      <div style={{position:'relative',zIndex:10,padding:'44px 44px 0'}} className="hero-pad">
        <span className="tag" style={{color:C.terra,borderColor:C.terra,opacity:0.8,marginBottom:8,display:'inline-block'}}>Tactical · Operations</span>
        <h1 className="font-serif hero-text" style={{fontSize:64,lineHeight:1,fontWeight:300,letterSpacing:'-0.02em',marginBottom:28}}>
          Mission<br/><em style={{color:C.ochre}}>Control</em>
        </h1>

        <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1.1fr 0.9fr',gap:22}}>
          {/* ── Sorties list ── */}
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <h2 className="font-serif" style={{fontSize:26,fontWeight:400}}>Sorties</h2>
                {selectedDay
                  ? <span className="font-mono" style={{fontSize:9,color:C.terra}}>
                      {DAY_NAMES[new Date(calYear,calMonth,selectedDay).getDay()]} {selectedDay} {MONTH_SHORT[calMonth]}
                      <button onClick={()=>setSelDay(null)}
                        style={{marginLeft:6,background:'none',border:'none',cursor:'pointer',color:C.terra,fontSize:10,opacity:0.6}}>✕</button>
                    </span>
                  : <span className="font-mono" style={{fontSize:9,color:C.olive}}>{visibleTasks.filter(t=>t.done).length}/{visibleTasks.length} done</span>
                }
              </div>
              <button onClick={()=>{ if(showAdd){setShowAdd(false);}else{openAdd();} }} className="btn-primary" style={{fontSize:10,padding:'7px 14px'}}>
                {showAdd?'Cancel':'+ Add Task'}
              </button>
            </div>

            {showAdd&&(
              <form onSubmit={submitTask} className="glass torn" style={{borderRadius:10,padding:'18px 20px',marginBottom:14}}>
                <input className="add-task-input" value={newTask} onChange={e=>setNewTask(e.target.value)}
                  placeholder="Task label..." autoFocus style={{marginBottom:12}}/>

                {/* Priority + Category row */}
                <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
                  {['HIGH','MED','LOW'].map(p=>(
                    <button key={p} type="button" onClick={()=>setNewPri(p)}
                      style={{fontFamily:'IBM Plex Mono',fontSize:9,padding:'4px 12px',border:`1px solid ${priColor[p]}`,
                        borderRadius:3,background:newPri===p?priColor[p]:'transparent',
                        color:newPri===p?'#EFEBE2':priColor[p],cursor:'pointer',letterSpacing:'0.06em'}}>{p}</button>
                  ))}
                  <input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Category"
                    style={{fontFamily:'IBM Plex Mono',fontSize:10,border:'none',borderBottom:'1px solid rgba(44,44,44,0.2)',
                      background:'transparent',padding:'3px 4px',width:90,outline:'none',color:C.charcoal}}/>
                  <button type="button" onClick={()=>{setNewRecurring(v=>!v); if(!newRecurring){setNewDueDate('');setNewDueTime('');}}}
                    style={{fontFamily:'IBM Plex Mono',fontSize:9,padding:'4px 10px',border:`1px solid ${newRecurring?C.ochre:'rgba(44,44,44,0.2)'}`,
                      borderRadius:3,background:newRecurring?`${C.ochre}22`:'transparent',
                      color:newRecurring?C.ochre:C.charcoal,cursor:'pointer',letterSpacing:'0.04em'}}>
                    ↻ Daily
                  </button>
                </div>

                {/* Date + Time row (hidden for recurring) */}
                {!newRecurring&&(
                  <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:12,flexWrap:'wrap'}}>
                    <div>
                      <p className="font-mono" style={{fontSize:7.5,opacity:0.4,marginBottom:4,letterSpacing:'0.06em'}}>DUE DATE</p>
                      <input type="date" value={newDueDate} onChange={e=>setNewDueDate(e.target.value)}
                        style={{fontFamily:'IBM Plex Mono',fontSize:11,border:'1px solid rgba(44,44,44,0.2)',borderRadius:6,
                          padding:'6px 10px',background:'rgba(44,44,44,0.03)',color:C.charcoal,outline:'none',cursor:'pointer'}}/>
                    </div>
                    <div>
                      <p className="font-mono" style={{fontSize:7.5,opacity:0.4,marginBottom:4,letterSpacing:'0.06em'}}>TIME (24H) — OPTIONAL</p>
                      <input type="time" value={newDueTime} onChange={e=>setNewDueTime(e.target.value)}
                        style={{fontFamily:'IBM Plex Mono',fontSize:11,border:'1px solid rgba(44,44,44,0.2)',borderRadius:6,
                          padding:'6px 10px',background:'rgba(44,44,44,0.03)',color:C.charcoal,outline:'none',cursor:'pointer'}}/>
                    </div>
                  </div>
                )}

                <button type="submit" className="btn-primary" style={{fontSize:10,padding:'7px 18px'}}>Save</button>
              </form>
            )}

            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {visibleTasks.map(t=>{
                const dueLabel = formatDueLabel(t);
                // Highlight if overdue (has a date, not done, in the past)
                const isOverdue = !t.done && /^\d{4}-\d{2}-\d{2}$/.test(t.due||'') && new Date(t.due) < today && !t.recurring;
                return (
                  <div key={t.id} className={`glass task-item torn ${t.done?'done':''}`}
                    style={{borderRadius:10,padding:'14px 18px',borderLeft:`3px solid ${isOverdue?'#8B0000':priColor[t.priority]}`}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <button onClick={()=>handleToggle(t.id)} style={{
                          width:20,height:20,borderRadius:'50%',border:`1.5px solid ${priColor[t.priority]}`,
                          background:t.done?priColor[t.priority]:'transparent',
                          display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0
                        }}>
                          {t.done&&<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 4l2 2 4-4" stroke="#EFEBE2" strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>}
                        </button>
                        <div>
                          <p style={{fontSize:13,textDecoration:t.done?'line-through':'none',fontWeight:500}}>{t.label}</p>
                          <p className="font-mono" style={{fontSize:8,color:isOverdue?C.terra:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginTop:2}}>
                            {t.cat} · {dueLabel}{isOverdue?' · OVERDUE':''}
                          </p>
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span className="tag" style={{color:priColor[t.priority],borderColor:priColor[t.priority],fontSize:7}}>{t.priority}</span>
                        {t.recurring&&<span className="tag" style={{color:C.ochre,borderColor:C.ochre,fontSize:7}}>↻</span>}
                        <button onClick={()=>onDeleteTask(t.id)} style={{background:'none',border:'none',cursor:'pointer',opacity:0.3,fontSize:14,color:C.charcoal}} title="Delete">×</button>
                      </div>
                    </div>
                  </div>
                );
              })}
              {visibleTasks.length===0&&(
                <div className="glass" style={{borderRadius:10,padding:'20px',textAlign:'center',opacity:0.5}}>
                  <p className="font-mono" style={{fontSize:10}}>
                    {selectedDay ? `Nothing scheduled for ${DAY_NAMES[new Date(calYear,calMonth,selectedDay).getDay()]} ${selectedDay}` : 'All missions complete. Add a new sortie.'}
                  </p>
                </div>
              )}
            </div>

            {/* Progress */}
            <div className="glass" style={{borderRadius:10,padding:'14px 18px',marginTop:14}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                <span className="font-mono" style={{fontSize:8,opacity:0.45,textTransform:'uppercase'}}>Daily Progress</span>
                <span className="font-serif" style={{fontSize:18,color:C.terra,fontWeight:300}}>
                  {visibleTasks.length?Math.round((visibleTasks.filter(t=>t.done).length/visibleTasks.length)*100):0}%
                </span>
              </div>
              <div style={{height:4,background:'rgba(44,44,44,0.08)',borderRadius:2}}>
                <div style={{height:'100%',borderRadius:2,transition:'width 0.5s ease',
                  width:`${visibleTasks.length?Math.round((visibleTasks.filter(t=>t.done).length/visibleTasks.length)*100):0}%`,
                  background:`linear-gradient(90deg,${C.terra},${C.ochre})`}}/>
              </div>
            </div>
          </div>

          {/* ── Calendar ── */}
          <div>
            <div className="glass" style={{borderRadius:12,padding:'20px',marginBottom:16}}>
              <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:4}}>Temporal · Grid</p>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                <button onClick={()=>goMonth(-1)} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:C.charcoal,opacity:0.5,padding:'0 4px'}}>‹</button>
                <p className="font-serif" style={{fontSize:18,fontWeight:300}}>
                  {MONTHS[calMonth]} {calYear}
                  {!isCurrentMonth&&<span className="font-mono" style={{fontSize:8,color:C.terra,marginLeft:6,opacity:0.7}}>← nav</span>}
                </p>
                <button onClick={()=>goMonth(1)} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:C.charcoal,opacity:0.5,padding:'0 4px'}}>›</button>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:6}}>
                {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>(
                  <div key={d} className="font-mono" style={{fontSize:8,textAlign:'center',opacity:0.35,textTransform:'uppercase'}}>{d}</div>
                ))}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
                {Array.from({length:calStart},(_,i)=><div key={`p${i}`}/>)}
                {Array.from({length:daysInMonth},(_,i)=>{
                  const d=i+1;
                  const isToday=isCurrentMonth&&d===today.getDate();
                  const isPast=isCurrentMonth&&d<today.getDate();
                  const isSelected=selectedDay===d;
                  const daySpecificTasks=getTasksForDay(d);
                  const hasNonRecurring=daySpecificTasks.filter(t=>!t.recurring&&t.due!=='daily').length>0;
                  return (
                    <div key={d} onClick={()=>setSelDay(isSelected?null:d)}
                      style={{height:28,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                        borderRadius:5,cursor:'pointer',
                        background:isToday?C.terra:isSelected?'rgba(44,44,44,0.1)':'transparent'}}>
                      <span className="font-mono" style={{fontSize:9.5,color:isToday?'#EFEBE2':C.charcoal,opacity:isToday?1:isPast?0.3:0.75}}>{d}</span>
                      {hasNonRecurring&&!isToday&&<div style={{width:3,height:3,borderRadius:'50%',background:C.terra,marginTop:1}}/>}
                    </div>
                  );
                })}
              </div>

              {/* Day detail popover */}
              {selectedDay&&(
                <div style={{marginTop:12,borderTop:'1px solid rgba(44,44,44,0.1)',paddingTop:10}}>
                  <p className="font-mono" style={{fontSize:7.5,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:6}}>
                    {DAY_NAMES[new Date(calYear,calMonth,selectedDay).getDay()]} {selectedDay} {MONTH_SHORT[calMonth]}
                  </p>
                  {dayTasks.length===0?(
                    <p className="font-mono" style={{fontSize:9,opacity:0.3}}>Nothing scheduled</p>
                  ):dayTasks.map(t=>{
                    const pc={HIGH:C.terra,MED:C.ochre,LOW:C.olive};
                    return (
                      <div key={t.id} style={{display:'flex',alignItems:'center',gap:6,marginBottom:5,padding:'4px 6px',
                        borderRadius:4,background:'rgba(44,44,44,0.03)',borderLeft:`2px solid ${pc[t.priority]||C.charcoal}`}}>
                        <span className="font-mono" style={{fontSize:9,flex:1,opacity:t.done?0.4:0.8,textDecoration:t.done?'line-through':'none'}}>{t.label}</span>
                        {t.dueTime&&<span className="font-mono" style={{fontSize:8,color:C.ochre}}>{t.dueTime}</span>}
                        {(t.recurring||t.due==='daily')&&<span style={{fontSize:8,color:C.ochre}}>↻</span>}
                        <span className="font-mono" style={{fontSize:7,opacity:0.35}}>{t.cat}</span>
                      </div>
                    );
                  })}
                </div>
              )}
              {!isCurrentMonth&&(
                <button onClick={()=>{setCalYear(today.getFullYear());setCalMonth(today.getMonth());setSelDay(null);}}
                  style={{marginTop:10,fontFamily:'IBM Plex Mono',fontSize:8,color:C.terra,background:'transparent',
                    border:`1px solid ${C.terra}`,borderRadius:4,padding:'3px 10px',cursor:'pointer',letterSpacing:'0.06em'}}>
                  ↩ Today
                </button>
              )}
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              {[
                {label:'Done',    val:processedTasks.filter(t=>t.done).length,                    unit:'tasks',  color:C.terra},
                {label:'Pending', val:processedTasks.filter(t=>!t.done).length,                   unit:'sorties',color:C.ochre},
                {label:'High Pri',val:tasks.filter(t=>t.priority==='HIGH'&&!t.done).length,        unit:'urgent', color:C.terra},
                {label:'Week',    val:'W'+String(Math.ceil(today.getDate()/7)),                    unit:today.getFullYear(), color:C.charcoal},
              ].map(s=>(
                <div key={s.label} className="glass" style={{borderRadius:10,padding:'14px 16px'}}>

function useLivePrices() {
  const [prices, setPrices] = useState({});
  const [history, setHistory] = useState({});
  const [lastFetch, setLastFetch] = useState(null);
  const [loading, setLoading] = useState(true);

  async function fetchAll() {
    setLoading(true);
    const tickers = ASSET_DEFS.filter(a=>a.ticker).map(a=>a.ticker);
    const YAHOO = 'https://query1.finance.yahoo.com/v8/finance/chart/';
    const PROXY  = 'https://corsproxy.io/?url=';
    const results = {};
    const hist = {};

    await Promise.all(tickers.map(async ticker => {
      try {
        const url = `${YAHOO}${encodeURIComponent(ticker)}?interval=1d&range=1mo`;
        const r = await fetch(`${PROXY}${encodeURIComponent(url)}`);
        const d = await r.json();
        const meta = d.result?.[0]?.meta || d.chart?.result?.[0]?.meta;
        const closes = d.result?.[0]?.indicators?.quote?.[0]?.close ||
                       d.chart?.result?.[0]?.indicators?.quote?.[0]?.close || [];
        const validCloses = closes.filter(Boolean);
        if(meta) {
          results[ticker] = {
            price: meta.regularMarketPrice || meta.previousClose,
            prev:  meta.chartPreviousClose || meta.previousClose,
            currency: meta.currency,
          };
          hist[ticker] = validCloses.slice(-14);
        }
      } catch(e) { /* silent fail */ }
    }));

    setPrices(results); setHistory(hist);
    setLastFetch(new Date()); setLoading(false);
  }

  useEffect(()=>{ fetchAll(); }, []);
  return { prices, history, lastFetch, loading, refetch: fetchAll };
}

function LiveSparkline({ data, color, w=100, h=36 }) {
  if(!data||data.length<2) return <Sparkline seed={314} color={color} w={w} h={h}/>;
  const min=Math.min(...data), max=Math.max(...data);
  const pts=data.map((v,i)=>[(i/(data.length-1))*w, h-((v-min)/(max-min||1))*(h-4)-2]);
  const d=pts.map((p,i)=>(i===0?`M ${p[0]} ${p[1]}`:`L ${p[0]} ${p[1]}`)).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <path d={d} stroke={color} strokeWidth="1.5" fill="none"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r={2.5} fill={color}/>
    </svg>
  );
}
