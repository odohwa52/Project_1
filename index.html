<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blueprint — FinOS</title>
<link rel="manifest" href="./frontend/manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16/tailwind.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
  :root {
    --cream: #EFEBE2;
    --charcoal: #2C2C2C;
    --terra: #D96A53;
    --ochre: #C49A45;
    --olive: #6B705C;
    --glass-bg: rgba(239,235,226,0.88);
    --glass-border: rgba(44,44,44,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Inter', sans-serif;
    height: 100vh; width: 100vw;
  }
  /* Grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.032; pointer-events: none; z-index: 9998;
  }
  /* Drafting grid */
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(44,44,44,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(44,44,44,0.05) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none; z-index: 1;
  }
  .font-serif { font-family: 'Cormorant Garamond', serif !important; }
  .font-mono  { font-family: 'IBM Plex Mono', monospace !important; }
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
  }
  /* Sidebar */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 60px;
    background: rgba(239,235,226,0.96);
    border-right: 1px solid rgba(44,44,44,0.1);
    z-index: 200; display: flex; flex-direction: column;
    align-items: center; padding: 20px 0; gap: 6px;
  }
  .nav-btn {
    width: 42px; height: 42px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(44,44,44,0.4); border: 1px solid transparent;
    transition: all 0.18s ease; background: transparent; position: relative;
  }
  .nav-btn:hover { color: var(--charcoal); background: rgba(44,44,44,0.06); }
  .nav-btn:hover .nav-tooltip {
    opacity: 1; transform: translateX(0); pointer-events: none;
  }
  .nav-btn.active {
    color: var(--terra); background: rgba(217,106,83,0.1);
    border-color: rgba(217,106,83,0.25);
  }
  .nav-tooltip {
    position: absolute; left: 52px; top: 50%; transform: translateY(-50%) translateX(-6px);
    background: var(--charcoal); color: var(--cream); font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; padding: 4px 10px; border-radius: 4px; white-space: nowrap;
    opacity: 0; transition: all 0.15s ease; pointer-events: none; z-index: 999;
    letter-spacing: 0.06em;
  }
  /* Main scroll area */
  .main-scroll {
    position: fixed; left: 60px; top: 0; right: 0; bottom: 0;
    overflow-y: auto; overflow-x: hidden; z-index: 10;
  }
  .main-scroll::-webkit-scrollbar { width: 3px; }
  .main-scroll::-webkit-scrollbar-thumb { background: rgba(44,44,44,0.14); border-radius: 2px; }
  /* Tab transition */
  .tab-view { animation: tabIn 0.3s ease; }
  @keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  /* Clock colon blink */
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .colon { animation: blink 1s ease-in-out infinite; }
  /* Radar spin */
  @keyframes radar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .radar-arm { transform-origin: 50% 50%; animation: radar 4s linear infinite; }
  /* Wave drift */
  @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-18px); } }
  .wave-a { animation: drift 14s ease-in-out infinite; }
  .wave-b { animation: drift 18s ease-in-out infinite reverse; }
  /* Helix flow */
  @keyframes helixflow { to { stroke-dashoffset: -300; } }
  .helix-line { animation: helixflow 7s linear infinite; }
  .helix-line-r { animation: helixflow 9s linear infinite; }
  /* Torn paper */
  .torn { clip-path: polygon(0% 8px,4% 0%,9% 7px,15% 1px,21% 8px,27% 0%,33% 7px,39% 1px,45% 8px,51% 0%,57% 7px,63% 1px,69% 8px,75% 0%,81% 7px,87% 1px,93% 8px,99% 0%,100% 0%,100% 100%,0% 100%); }
  /* Tag */
  .tag {
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 7px; border: 1px solid currentColor;
    border-radius: 2px; display: inline-block;
  }
  /* Quick-log input */
  .quick-log input {
    background: rgba(44,44,44,0.04); border: 1px solid rgba(44,44,44,0.15);
    border-radius: 8px; padding: 10px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--charcoal); width: 100%; outline: none;
    transition: border-color 0.15s;
  }
  .quick-log input:focus { border-color: var(--terra); }
  .quick-log input::placeholder { color: rgba(44,44,44,0.35); }
  /* Task item */
  .task-item { transition: opacity 0.2s ease; }
  .task-item.done { opacity: 0.55; }
  /* Add task input */
  .add-task-input {
    background: transparent; border: none; border-bottom: 1px solid rgba(44,44,44,0.2);
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--charcoal);
    padding: 6px 4px; width: 100%; outline: none;
  }
  .add-task-input::placeholder { color: rgba(44,44,44,0.3); }
  /* Mobile responsive */
  @media (max-width: 700px) {
    .sidebar { width: 50px; }
    .main-scroll { left: 50px; }
    .grid-3 { grid-template-columns: 1fr !important; }
    .grid-2 { grid-template-columns: 1fr !important; }
    .hero-text { font-size: 42px !important; }
    .hero-pad { padding: 24px 20px 0 20px !important; }
    .hide-mobile { display: none !important; }
  }
  /* Toast notification */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--charcoal); color: var(--cream);
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 10px 20px; border-radius: 6px; z-index: 9999;
    animation: toastIn 0.2s ease; letter-spacing: 0.04em;
  }
  @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(8px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
  /* Committee running state */
  @keyframes thinking { 0%,100%{opacity:0.3} 50%{opacity:1} }
  .thinking-dot { animation: thinking 1.2s ease-in-out infinite; }
  .thinking-dot:nth-child(2) { animation-delay: 0.4s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.8s; }
  /* Collage images */
  .collage-img { mix-blend-mode: multiply; filter: grayscale(1) contrast(1.15); }
  /* Button base */
  .btn-primary {
    background: var(--terra); color: var(--cream); border: none; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    padding: 9px 18px; border-radius: 6px; transition: opacity 0.15s;
    text-transform: uppercase;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  /* Error state */
  .error-banner {
    background: rgba(217,106,83,0.1); border: 1px solid rgba(217,106,83,0.3);
    border-radius: 8px; padding: 10px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--terra);
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── Constants ─────────────────────────────────────────── */
const C = { terra:'#D96A53', ochre:'#C49A45', olive:'#6B705C', charcoal:'#2C2C2C', cream:'#EFEBE2' };
const LS_TASKS    = 'finos_tasks_v2';
const LS_EXPENSES = 'finos_expenses_v2';
const LS_COUNCIL  = 'finos_council_v2';

/* ── LocalStorage helpers ───────────────────────────────── */
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

/* ── Default data ───────────────────────────────────────── */
const DEFAULT_TASKS = [
  { id:1, label:'Japanese',           done:false, priority:'LOW',  cat:'Study',    due:'Today' },
  { id:2, label:'Math Tutoring Prep', done:false, priority:'HIGH', cat:'Work',     due:'Today' },
  { id:3, label:'Club Event',         done:false, priority:'MED',  cat:'Social',   due:'Fri'   },
  { id:4, label:'Lab Reports',        done:false, priority:'HIGH', cat:'Academic', due:'Thu'   },
  { id:5, label:'Gym Progress',       done:true,  priority:'LOW',  cat:'Health',   due:'Daily' },
];
const DEFAULT_EXPENSES = [
  { id:1, label:'Clothes',        amt:89000, card:'A', cat:'Shopping',  date:'Mon', usd:false },
  { id:2, label:'Study Materials',amt:34500, card:'B', cat:'Education', date:'Tue', usd:false },
  { id:3, label:'Sinchon Cafe',   amt:12000, card:'C', cat:'Food',      date:'Wed', usd:false },
  { id:4, label:'Convenience',    amt:8700,  card:'C', cat:'Food',      date:'Thu', usd:false },
  { id:5, label:'Transport',      amt:5300,  card:'B', cat:'Transport', date:'Fri', usd:false },
];

/* ── NL Expense Parser ──────────────────────────────────── */
function parseExpense(input) {
  const s = input.trim().toLowerCase();
  // Format: "8500 GS25 card B" or "89000 clothes A" or "$45 amazon B"
  const usd = s.startsWith('$');
  const clean = s.replace('$','');
  const tokens = clean.split(/\s+/);
  const amt = parseInt(tokens.find(t => /^\d+/.test(t)) || '0');
  const cardMatch = clean.match(/card\s*([abc])|([abc])\s*$/i);
  const card = cardMatch ? (cardMatch[1]||cardMatch[2]).toUpperCase() : 'B';
  const labelTokens = tokens.filter(t => !/^\d+$/.test(t) && !t.match(/^card$/i) && !t.match(/^[abc]$/i));
  const label = labelTokens.map(t=>t.charAt(0).toUpperCase()+t.slice(1)).join(' ') || 'Expense';
  const catMap = {
    'cafe':'Food','coffee':'Food','gs25':'Food','cu':'Food','food':'Food','meal':'Food',
    'transport':'Transport','bus':'Transport','metro':'Transport','taxi':'Transport',
    'book':'Education','study':'Education','library':'Education',
    'clothes':'Shopping','shirt':'Shopping','amazon':'Shopping',
    'gym':'Health','medicine':'Health',
  };
  const cat = Object.entries(catMap).find(([k])=>label.toLowerCase().includes(k))?.[1] || 'Other';
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return { id:Date.now(), label, amt, card, cat, date:days[new Date().getDay()], usd };
}

/* ── Icon helper ────────────────────────────────────────── */
function Icon({ name, size=18, color, style:st={} }) {
  const ref = useRef(null);
  useEffect(()=>{
    if(ref.current && window.lucide){
      ref.current.innerHTML='';
      const svg = window.lucide.createElement(name);
      if(svg){
        svg.setAttribute('width',size); svg.setAttribute('height',size);
        if(color) svg.setAttribute('stroke',color);
        ref.current.appendChild(svg);
      }
    }
  },[name,size,color]);
  return <span ref={ref} style={{display:'inline-flex',alignItems:'center',...st}} />;
}

/* ── Toast ──────────────────────────────────────────────── */
function Toast({ msg, onDone }) {
  useEffect(()=>{ const t=setTimeout(onDone,2200); return()=>clearTimeout(t); },[]);
  return <div className="toast">{msg}</div>;
}

/* ── Live Clock KST ─────────────────────────────────────── */
function useClock() {
  const [t,setT]=useState(new Date());
  useEffect(()=>{ const id=setInterval(()=>setT(new Date()),1000); return()=>clearInterval(id); },[]);
  return t;
}

/* ── Decorative SVGs ────────────────────────────────────── */
function TopologicalMap({width=320,height=180,color=C.terra,offsetX=0}){
  const lines=useMemo(()=>{
    const res=[];
    for(let i=0;i<14;i++){
      const y0=16+i*11; const amp=16+Math.sin(i*0.7)*12; const freq=0.016+i*0.002;
      let d=`M 0 ${y0}`;
      for(let x=0;x<=width;x+=5){ d+=` L ${x} ${y0+amp*Math.sin(x*freq+i*0.5+offsetX)}`; }
      res.push(<path key={i} d={d} stroke={color} strokeWidth="0.7" fill="none" opacity={0.55+((i%3)*0.12)}/>);
    }
    return res;
  },[width,height,color,offsetX]);
  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{overflow:'visible'}}>{lines}</svg>;
}

function Crosshair({size=40,color=C.ochre,opacity=0.5}){
  const r=size/2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{opacity}}>
      <circle cx={r} cy={r} r={r-2} stroke={color} strokeWidth="0.8" fill="none" strokeDasharray="3 4"/>
      <circle cx={r} cy={r} r={4} stroke={color} strokeWidth="0.8" fill="none"/>
      <line x1={0} y1={r} x2={size} y2={r} stroke={color} strokeWidth="0.8"/>
      <line x1={r} y1={0} x2={r} y2={size} stroke={color} strokeWidth="0.8"/>
      <circle cx={r} cy={r} r={1.5} fill={color}/>
    </svg>
  );
}

function RadarAccent({size=60,color=C.olive}){
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{opacity:0.38}}>
      <circle cx={size/2} cy={size/2} r={size/2-2} stroke={color} strokeWidth="0.7" fill="none" strokeDasharray="2 3"/>
      <circle cx={size/2} cy={size/2} r={size/3}   stroke={color} strokeWidth="0.7" fill="none" opacity="0.6"/>
      <circle cx={size/2} cy={size/2} r={size/6}   stroke={color} strokeWidth="0.7" fill="none" opacity="0.4"/>
      <g className="radar-arm">
        <line x1={size/2} y1={size/2} x2={size/2} y2={2} stroke={color} strokeWidth="1" opacity="0.8"/>
      </g>
    </svg>
  );
}

function FlowingDataWaves({w=1200,h=400}){
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid slice"
      style={{position:'absolute',top:0,left:0}}>
      <defs>
        <filter id="glow-t"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="glow-o"><feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g className="wave-b">
        {[0.6,0.72].map((yf,i)=>(
          <path key={i} d={`M -20 ${h*yf} C ${w*0.2} ${h*(yf-0.22)}, ${w*0.45} ${h*(yf+0.12)}, ${w*0.65} ${h*(yf-0.1)} S ${w*0.88} ${h*(yf-0.28)}, ${w+20} ${h*(yf-0.08)}`}
            stroke={C.ochre} strokeWidth={1.1-i*0.15} fill="none" opacity={0.42-i*0.07} filter="url(#glow-o)"/>
        ))}
      </g>
      <g className="wave-a">
        {[0.35,0.48,0.56].map((yf,i)=>(
          <path key={i} d={`M -20 ${h*yf} C ${w*0.15} ${h*(yf-0.2)}, ${w*0.38} ${h*(yf+0.2)}, ${w*0.58} ${h*(yf-0.07)} S ${w*0.82} ${h*(yf-0.18)}, ${w+20} ${h*(yf+0.05)}`}
            stroke={C.terra} strokeWidth={1.7-i*0.25} fill="none" opacity={0.48-i*0.09} filter="url(#glow-t)"/>
        ))}
      </g>
      {[[w*0.28,h*0.35],[w*0.55,h*0.28],[w*0.72,h*0.44],[w*0.42,h*0.61]].map(([x,y],i)=>(
        <g key={i}><circle cx={x} cy={y} r={3} fill={C.terra} opacity={0.7}/><circle cx={x} cy={y} r={7} stroke={C.terra} strokeWidth="0.8" fill="none" opacity={0.28}/></g>
      ))}
      {Array.from({length:18},(_,i)=>(
        <line key={i} x1={i*(w/18)} y1={h-6} x2={i*(w/18)} y2={i%6===0?h-14:h-10}
          stroke={C.charcoal} strokeWidth="0.7" opacity="0.1"/>
      ))}
    </svg>
  );
}

function DataHelix({height=800}){
  const cx=75, amp=52, period=88;
  const steps=Math.floor(height/4);
  let lp='', rp='';
  const dots=[], crossY=[];
  for(let i=0;i<=steps;i++){
    const y=i*4, x=cx+amp*Math.sin((y/period)*2*Math.PI), x2=cx-amp*Math.sin((y/period)*2*Math.PI);
    lp += i===0?`M ${x} ${y}`:`L ${x} ${y}`;
    rp += i===0?`M ${x2} ${y}`:`L ${x2} ${y}`;
    if(Math.abs(Math.sin((y/period)*2*Math.PI))<0.06){ dots.push({x:cx,y,c:true}); crossY.push(y); }
    else if(i%14===0) dots.push({x,y,c:false});
  }
  return (
    <svg width={cx*2+amp+16} height={height} style={{position:'absolute',right:0,top:0,opacity:0.2}}>
      <defs><filter id="hglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <path d={lp} stroke={C.terra} strokeWidth="1.2" fill="none" strokeDasharray="200" className="helix-line" filter="url(#hglow)"/>
      <path d={rp} stroke={C.ochre} strokeWidth="1.2" fill="none" strokeDasharray="200" className="helix-line-r" filter="url(#hglow)"/>
      {dots.map((d,i)=><circle key={i} cx={d.x} cy={d.y} r={d.c?3:1.5} fill={d.c?C.olive:C.terra} opacity={d.c?1:0.7}/>)}
      {crossY.map((y,i)=>(
        <g key={i}><line x1={cx-14} y1={y} x2={cx+14} y2={y} stroke={C.olive} strokeWidth="0.7" opacity="0.5"/>
        <text x={cx+amp+4} y={y+3} fill={C.charcoal} fontSize="7" style={{fontFamily:'IBM Plex Mono',opacity:0.3}}>{String(i).padStart(2,'0')}</text></g>
      ))}
    </svg>
  );
}

/* ── Sparkline (seeded stable) ──────────────────────────── */
function Sparkline({seed,color,w=100,h=36}){
  const data = useMemo(()=>{
    // Seeded pseudo-random so it doesn't regenerate
    let s=seed;
    const rng=()=>{ s=(s*9301+49297)%233280; return s/233280; };
    return Array.from({length:18},(_,i)=>42+rng()*18+i*1.2);
  },[seed]);
  const min=Math.min(...data), max=Math.max(...data);
  const pts=data.map((v,i)=>[( i/(data.length-1))*w, h-((v-min)/(max-min||1))*(h-4)-2]);
  const d=pts.map((p,i)=>(i===0?`M ${p[0]} ${p[1]}`:`L ${p[0]} ${p[1]}`)).join(' ');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <path d={d} stroke={color} strokeWidth="1.5" fill="none"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r={2.5} fill={color}/>
    </svg>
  );
}

/* ══════════════════════════════════════════════════════════
   VIEW 1 — BRIEFING
══════════════════════════════════════════════════════════ */
function BriefingView({ expenses, onAddExpense }) {
  const time = useClock();
  const kst  = new Date(time.toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
  const hh=String(kst.getHours()).padStart(2,'0');
  const mm=String(kst.getMinutes()).padStart(2,'0');
  const ss=String(kst.getSeconds()).padStart(2,'0');
  const dateStr=kst.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Seoul'});

  const [logInput, setLogInput] = useState('');
  const [logErr, setLogErr]     = useState('');

  const weather = [
    {loc:'Incheon', temp:'—', cond:'Open-Meteo', icon:'🌤️', note:'Live via API'},
    {loc:'Songdo',  temp:'—', cond:'Open-Meteo', icon:'🌥️', note:'Live via API'},
    {loc:'Sinchon', temp:'—', cond:'Open-Meteo', icon:'🌫️', note:'Live via API'},
  ];

  // Try to fetch real weather (Open-Meteo, no API key)
  const [wx, setWx] = useState([]);
  useEffect(()=>{
    const coords=[{loc:'Incheon',lat:37.456,lon:126.705},{loc:'Songdo',lat:37.383,lon:126.657},{loc:'Sinchon',lat:37.559,lon:126.937}];
    Promise.all(coords.map(c=>
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current_weather=true&hourly=relativehumidity_2m`)
        .then(r=>r.json())
        .then(d=>({
          loc:c.loc,
          temp:`${Math.round(d.current_weather.temperature)}°C`,
          cond:['Clear','Mainly Clear','Partly Cloudy','Overcast','Fog','Drizzle','Rain','Thunderstorm'][Math.min(Math.floor(d.current_weather.weathercode/10),7)]||'Clear',
          icon:['☀️','🌤️','⛅','☁️','🌫️','🌦️','🌧️','⛈️'][Math.min(Math.floor(d.current_weather.weathercode/10),7)]||'🌤️',
          hum: d.hourly?.relativehumidity_2m?.[new Date().getHours()]||'—',
        }))
        .catch(()=>({loc:c.loc,temp:'—',cond:'Unavailable',icon:'🌤️',hum:'—'}))
    )).then(setWx);
  },[]);

  const wxData = wx.length===3 ? wx : weather;
  const maxAmt = Math.max(...expenses.map(e=>e.amt),1);

  const miniPath = useMemo(()=>{
    const pts = expenses.slice(-5).map((e,i)=>{
      const x=20+i*60; const y=76-(e.amt/maxAmt)*60;
      return {x,y};
    });
    return pts.reduce((acc,p,i)=>acc+(i===0?`M ${p.x} ${p.y}`:`C ${p.x-28} ${p.y+8},${p.x-28} ${p.y-8},${p.x} ${p.y}`),'');
  },[expenses]);

  function handleLog(e){
    e.preventDefault();
    if(!logInput.trim()){ setLogErr('Type an expense first'); return; }
    const parsed = parseExpense(logInput);
    if(!parsed.amt){ setLogErr('Could not parse amount — try "12000 cafe C"'); return; }
    onAddExpense(parsed);
    setLogInput(''); setLogErr('');
  }

  const cardBudgets=[
    {card:'A',label:'Reimbursable',spent:expenses.filter(e=>e.card==='A').reduce((a,b)=>a+b.amt,0),cap:null,color:C.terra},
    {card:'B',label:'Monthly ₩300K',spent:expenses.filter(e=>e.card==='B').reduce((a,b)=>a+b.amt,0),cap:300000,color:C.ochre},
    {card:'C',label:'Min ₩500K',spent:expenses.filter(e=>e.card==='C').reduce((a,b)=>a+b.amt,0),cap:500000,color:C.olive},
  ];

  return (
    <div className="tab-view" style={{minHeight:'100vh',paddingBottom:60,position:'relative'}}>
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
        <FlowingDataWaves w={1200} h={420}/>
        <div style={{position:'absolute',bottom:20,right:30,opacity:0.12}} className="hide-mobile">
          <TopologicalMap width={260} height={150} color={C.ochre} offsetX={1.2}/>
        </div>
      </div>

      <div style={{position:'relative',zIndex:10,padding:'44px 44px 0'}} className="hero-pad">
        <span className="tag" style={{color:C.olive,borderColor:C.olive,opacity:0.7,marginBottom:8,display:'inline-block'}}>KST — Seoul Operations</span>
        <h1 className="font-serif hero-text" style={{fontSize:64,lineHeight:1,fontWeight:300,letterSpacing:'-0.02em',marginBottom:4}}>
          Morning<br/><em style={{color:C.terra}}>Briefing</em>
        </h1>
        <div className="font-mono" style={{fontSize:13,opacity:0.55,marginBottom:28,letterSpacing:'0.12em'}}>
          {hh}<span className="colon">:</span>{mm}<span className="colon">:</span>{ss} · {dateStr}
        </div>

        {/* Quick-log */}
        <div className="glass quick-log" style={{borderRadius:12,padding:'18px 22px',marginBottom:22,maxWidth:680}}>
          <p className="font-mono" style={{fontSize:9,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8}}>
            Quick Log · Format: "12000 cafe C" or "$8 amazon B"
          </p>
          <form onSubmit={handleLog} style={{display:'flex',gap:10}}>
            <input value={logInput} onChange={e=>{setLogInput(e.target.value);setLogErr('');}}
              placeholder='e.g.  8500 GS25 card B' autoComplete="off"/>
            <button type="submit" className="btn-primary" style={{whiteSpace:'nowrap'}}>+ Log</button>
          </form>
          {logErr && <p style={{fontSize:10,color:C.terra,marginTop:6,fontFamily:'IBM Plex Mono'}}>{logErr}</p>}
        </div>

        {/* Weather */}
        <div className="grid-3" style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:20}}>
          {wxData.map(w=>(
            <div key={w.loc} className="glass" style={{borderRadius:12,padding:'18px 20px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div>
                  <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:3}}>Weather · {w.loc}</p>
                  <p className="font-serif" style={{fontSize:30,fontWeight:300,lineHeight:1}}>{w.temp}</p>
                </div>
                <span style={{fontSize:26}}>{w.icon}</span>
              </div>
              <p style={{fontSize:11,opacity:0.6}}>{w.cond}</p>
              {w.hum!=='—' && <p className="font-mono" style={{fontSize:9,color:C.olive,marginTop:4}}>Humidity {w.hum}%</p>}
            </div>
          ))}
        </div>

        {/* Spending chart + card budgets */}
        <div className="grid-2" style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:18,alignItems:'start'}}>
          <div className="glass" style={{borderRadius:12,padding:'22px 26px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div>
                <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em'}}>Weekly · Expenditure</p>
                <p className="font-serif" style={{fontSize:20,fontWeight:300,marginTop:2}}>Spending Flow</p>
              </div>
              <p className="font-serif" style={{fontSize:22,color:C.terra,fontWeight:300}}>
                ₩{expenses.reduce((a,e)=>a+e.amt,0).toLocaleString()}
              </p>
            </div>
            <svg width="100%" height="90" viewBox="0 0 320 90" preserveAspectRatio="none" style={{marginBottom:10}}>
              <defs>
                <filter id="mg"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                <linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={C.terra} stopOpacity="0.14"/>
                  <stop offset="100%" stopColor={C.terra} stopOpacity="0.02"/>
                </linearGradient>
              </defs>
              <path d={miniPath+` L 260 90 L 20 90 Z`} fill="url(#wfill)"/>
              <path d={miniPath} stroke={C.terra} strokeWidth="1.8" fill="none" filter="url(#mg)"/>
              {expenses.slice(-5).map((e,i)=>{
                const x=20+i*60; const y=76-(e.amt/maxAmt)*60;
                return <g key={i}><circle cx={x} cy={y} r={3.5} fill="#EFEBE2" stroke={C.terra} strokeWidth="1.5"/>
                  <text x={x} y={87} fill={C.charcoal} fontSize="7.5" textAnchor="middle" style={{fontFamily:'IBM Plex Mono',opacity:0.4}}>{e.date}</text></g>;
              })}
              {[30,60].map(y=><line key={y} x1={0} y1={y} x2={320} y2={y} stroke={C.charcoal} strokeWidth="0.5" strokeDasharray="3 5" opacity="0.1"/>)}
            </svg>
            {expenses.slice(-5).map((e,i)=>(
              <div key={e.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:i<4?'1px solid rgba(44,44,44,0.06)':'none'}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{width:20,height:20,borderRadius:'50%',background:'rgba(44,44,44,0.07)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontFamily:'IBM Plex Mono',opacity:0.7}}>{e.card}</span>
                  <span style={{fontSize:12}}>{e.label}</span>
                </div>
                <span className="font-mono" style={{fontSize:11,opacity:0.7}}>{e.usd?'$'+(e.amt):'₩'+e.amt.toLocaleString()}</span>
              </div>
            ))}
          </div>

          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {cardBudgets.map(c=>(
              <div key={c.card} className="glass" style={{borderRadius:12,padding:'16px 18px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                  <div>
                    <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em'}}>Card {c.card}</p>
                    <p style={{fontSize:11,opacity:0.65,marginTop:1}}>{c.label}</p>
                  </div>
                  <Crosshair size={26} color={c.color} opacity={0.42}/>
                </div>
                <p className="font-serif" style={{fontSize:20,color:c.color,fontWeight:300}}>₩{c.spent.toLocaleString()}</p>
                {c.cap&&(
                  <div style={{marginTop:8}}>
                    <div style={{height:3,background:'rgba(44,44,44,0.08)',borderRadius:2}}>
                      <div style={{height:'100%',width:`${Math.min(100,(c.spent/c.cap)*100)}%`,background:c.color,borderRadius:2,opacity:0.7}}/>
                    </div>
                    <p className="font-mono" style={{fontSize:8,opacity:0.35,marginTop:3,textAlign:'right'}}>{Math.round((c.spent/c.cap)*100)}% used</p>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   VIEW 2 — MISSION
══════════════════════════════════════════════════════════ */
function MissionView({ tasks, onToggleTask, onAddTask, onDeleteTask }) {
  const [newTask, setNewTask]   = useState('');
  const [newPri,  setNewPri]    = useState('MED');
  const [newCat,  setNewCat]    = useState('Study');
  const [newDue,  setNewDue]    = useState('Today');
  const [showAdd, setShowAdd]   = useState(false);
  const [selectedDay, setSelDay]= useState(null);

  const today = new Date();
  const calStart = new Date(today.getFullYear(), today.getMonth(), 1).getDay();
  const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const priColor = {HIGH:C.terra, MED:C.ochre, LOW:C.olive};

  function submitTask(e){
    e.preventDefault();
    if(!newTask.trim()) return;
    onAddTask({ id:Date.now(), label:newTask.trim(), done:false, priority:newPri, cat:newCat, due:newDue });
    setNewTask(''); setShowAdd(false);
  }

  const dayTasks = selectedDay ? tasks.filter(t=>t.due===String(selectedDay)||t.due==='Today'&&selectedDay===today.getDate()) : [];

  return (
    <div className="tab-view" style={{minHeight:'100vh',paddingBottom:60,position:'relative'}}>
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
        <img src="https://images.unsplash.com/photo-1618945524163-32451704cbb8?w=400&q=70" alt=""
          className="collage-img" style={{position:'absolute',top:-20,right:50,width:260,height:360,objectFit:'cover',opacity:0.2,borderRadius:8}}/>
        <div style={{position:'absolute',top:60,right:180,width:300,height:300,borderRadius:'50%',background:C.terra,opacity:0.07,mixBlendMode:'multiply'}}/>
        <div style={{position:'absolute',bottom:30,right:30,opacity:0.1}} className="hide-mobile">
          <TopologicalMap width={220} height={130} color={C.olive}/>
        </div>
      </div>

      <div style={{position:'relative',zIndex:10,padding:'44px 44px 0'}} className="hero-pad">
        <span className="tag" style={{color:C.terra,borderColor:C.terra,opacity:0.8,marginBottom:8,display:'inline-block'}}>Tactical · Operations</span>
        <h1 className="font-serif hero-text" style={{fontSize:64,lineHeight:1,fontWeight:300,letterSpacing:'-0.02em',marginBottom:28}}>
          Mission<br/><em style={{color:C.ochre}}>Control</em>
        </h1>

        <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1.1fr 0.9fr',gap:22}}>
          {/* Tasks */}
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <h2 className="font-serif" style={{fontSize:26,fontWeight:400}}>Sorties</h2>
                <span className="font-mono" style={{fontSize:9,color:C.olive}}>{tasks.filter(t=>t.done).length}/{tasks.length} done</span>
              </div>
              <button onClick={()=>setShowAdd(v=>!v)} className="btn-primary" style={{fontSize:10,padding:'7px 14px'}}>
                {showAdd?'Cancel':'+ Add Task'}
              </button>
            </div>

            {showAdd&&(
              <form onSubmit={submitTask} className="glass torn" style={{borderRadius:10,padding:'16px 18px',marginBottom:14}}>
                <input className="add-task-input" value={newTask} onChange={e=>setNewTask(e.target.value)}
                  placeholder="Task label..." autoFocus/>
                <div style={{display:'flex',gap:10,marginTop:10,flexWrap:'wrap'}}>
                  {['HIGH','MED','LOW'].map(p=>(
                    <button key={p} type="button" onClick={()=>setNewPri(p)}
                      style={{fontFamily:'IBM Plex Mono',fontSize:9,padding:'3px 10px',border:`1px solid ${priColor[p]}`,
                        borderRadius:3,background:newPri===p?priColor[p]:'transparent',
                        color:newPri===p?'#EFEBE2':priColor[p],cursor:'pointer',letterSpacing:'0.06em'}}>{p}</button>
                  ))}
                  <input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Category"
                    style={{fontFamily:'IBM Plex Mono',fontSize:10,border:'none',borderBottom:'1px solid rgba(44,44,44,0.2)',
                      background:'transparent',padding:'2px 4px',width:90,outline:'none',color:C.charcoal}}/>
                  <input value={newDue} onChange={e=>setNewDue(e.target.value)} placeholder="Due (Today/Mon/...)"
                    style={{fontFamily:'IBM Plex Mono',fontSize:10,border:'none',borderBottom:'1px solid rgba(44,44,44,0.2)',
                      background:'transparent',padding:'2px 4px',width:100,outline:'none',color:C.charcoal}}/>
                  <button type="submit" className="btn-primary" style={{fontSize:10,padding:'5px 14px'}}>Save</button>
                </div>
              </form>
            )}

            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {tasks.map(t=>(
                <div key={t.id} className={`glass task-item torn ${t.done?'done':''}`}
                  style={{borderRadius:10,padding:'14px 18px',borderLeft:`3px solid ${priColor[t.priority]}`}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div style={{display:'flex',alignItems:'center',gap:12}}>
                      <button onClick={()=>onToggleTask(t.id)} style={{
                        width:20,height:20,borderRadius:'50%',border:`1.5px solid ${priColor[t.priority]}`,
                        background:t.done?priColor[t.priority]:'transparent',
                        display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0
                      }}>
                        {t.done&&<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 4l2 2 4-4" stroke="#EFEBE2" strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>}
                      </button>
                      <div>
                        <p style={{fontSize:13,textDecoration:t.done?'line-through':'none',fontWeight:500}}>{t.label}</p>
                        <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginTop:2}}>{t.cat} · {t.due}</p>
                      </div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <span className="tag" style={{color:priColor[t.priority],borderColor:priColor[t.priority],fontSize:7}}>{t.priority}</span>
                      <button onClick={()=>onDeleteTask(t.id)} style={{background:'none',border:'none',cursor:'pointer',opacity:0.3,fontSize:14,color:C.charcoal}} title="Delete">×</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Progress */}
            <div className="glass" style={{borderRadius:10,padding:'14px 18px',marginTop:14}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                <span className="font-mono" style={{fontSize:8,opacity:0.45,textTransform:'uppercase'}}>Daily Progress</span>
                <span className="font-serif" style={{fontSize:18,color:C.terra,fontWeight:300}}>
                  {tasks.length?Math.round((tasks.filter(t=>t.done).length/tasks.length)*100):0}%
                </span>
              </div>
              <div style={{height:4,background:'rgba(44,44,44,0.08)',borderRadius:2}}>
                <div style={{height:'100%',borderRadius:2,transition:'width 0.5s ease',
                  width:`${tasks.length?Math.round((tasks.filter(t=>t.done).length/tasks.length)*100):0}%`,
                  background:`linear-gradient(90deg,${C.terra},${C.ochre})`}}/>
              </div>
            </div>
          </div>

          {/* Calendar */}
          <div>
            <div className="glass" style={{borderRadius:12,padding:'20px',marginBottom:16}}>
              <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:4}}>Temporal · Grid</p>
              <p className="font-serif" style={{fontSize:18,fontWeight:300,marginBottom:14}}>
                {today.toLocaleString('default',{month:'long',year:'numeric'})}
              </p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:6}}>
                {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>(
                  <div key={d} className="font-mono" style={{fontSize:8,textAlign:'center',opacity:0.35,textTransform:'uppercase'}}>{d}</div>
                ))}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
                {Array.from({length:calStart},(_,i)=><div key={`p${i}`}/>)}
                {Array.from({length:daysInMonth},(_,i)=>{
                  const d=i+1, isToday=d===today.getDate();
                  const hasTasks=tasks.some(t=>t.due===String(d)||(isToday&&t.due==='Today'));
                  return (
                    <div key={d} onClick={()=>setSelDay(selectedDay===d?null:d)}
                      style={{height:28,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                        borderRadius:5,cursor:'pointer',
                        background:isToday?C.terra:selectedDay===d?'rgba(44,44,44,0.08)':'transparent'}}>
                      <span className="font-mono" style={{fontSize:9.5,color:isToday?'#EFEBE2':C.charcoal,opacity:isToday?1:d<today.getDate()?0.3:0.75}}>{d}</span>
                      {hasTasks&&!isToday&&<div style={{width:3,height:3,borderRadius:'50%',background:C.terra,marginTop:1}}/>}
                    </div>
                  );
                })}
              </div>
              {selectedDay&&dayTasks.length>0&&(
                <div style={{marginTop:12,borderTop:'1px solid rgba(44,44,44,0.1)',paddingTop:10}}>
                  {dayTasks.map(t=>(
                    <p key={t.id} className="font-mono" style={{fontSize:9,color:C.charcoal,opacity:0.7,marginBottom:4}}>· {t.label}</p>
                  ))}
                </div>
              )}
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              {[
                {label:'Done',val:tasks.filter(t=>t.done).length,unit:'tasks',color:C.terra},
                {label:'Pending',val:tasks.filter(t=>!t.done).length,unit:'sorties',color:C.ochre},
                {label:'High Pri',val:tasks.filter(t=>t.priority==='HIGH'&&!t.done).length,unit:'urgent',color:C.terra},
                {label:'Week',val:'W'+String(Math.ceil(today.getDate()/7)+Math.ceil((new Date(today.getFullYear(),today.getMonth(),1).getDay())/7)),unit:'2026',color:C.charcoal},
              ].map(s=>(
                <div key={s.label} className="glass" style={{borderRadius:10,padding:'14px 16px'}}>
                  <p className="font-mono" style={{fontSize:7.5,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em'}}>{s.label}</p>
                  <p className="font-serif" style={{fontSize:28,color:s.color,fontWeight:300,lineHeight:1.1,marginTop:4}}>{s.val}</p>
                  <p className="font-mono" style={{fontSize:8,opacity:0.35,marginTop:2}}>{s.unit}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

        </div>

          <div key={i} className="glass" style={{borderRadius:12,padding:'18px 22px',marginBottom:14}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:18}}>
              <div style={{flex:1}}>
                <div style={{display:'flex',gap:6,marginBottom:6}}>
                  <span className="tag" style={{color:C.olive,borderColor:C.olive}}>{a.type}</span>
                  <span className="tag" style={{color:C.charcoal,borderColor:'rgba(44,44,44,0.3)',opacity:0.55}}>{a.region}</span>
                </div>
                <p className="font-serif" style={{fontSize:20,fontWeight:400}}>{a.name}</p>
                <p className="font-mono" style={{fontSize:9,opacity:0.4,marginTop:2}}>{a.ticker}</p>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}} className="hide-mobile">
                <Sparkline seed={a.seed} color={a.pos?C.terra:C.olive}/>
                <span className="font-mono" style={{fontSize:7.5,opacity:0.3,textTransform:'uppercase'}}>7D Trend</span>
              </div>
              <div style={{textAlign:'right',minWidth:110}}>
                <p className="font-serif" style={{fontSize:22,fontWeight:300}}>{a.price}</p>
                <p className="font-mono" style={{fontSize:11,color:a.pos?C.terra:C.olive,marginTop:2}}>{a.change}</p>
              </div>
              <div style={{marginLeft:6}}><RadarAccent size={44} color={a.pos?C.ochre:C.olive}/></div>
            </div>
            <div style={{marginTop:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span className="font-mono" style={{fontSize:7.5,opacity:0.35}}>Allocation</span>
                <span className="font-mono" style={{fontSize:7.5,opacity:0.45}}>{a.alloc}%</span>
              </div>
              <div style={{height:2,background:'rgba(44,44,44,0.08)',borderRadius:1}}>
                <div style={{height:'100%',width:`${a.alloc}%`,background:a.pos?C.terra:C.olive,borderRadius:1,opacity:0.6}}/>
              </div>
            </div>
          </div>
        ))}

        <div className="glass" style={{borderRadius:12,padding:'18px 22px'}}>
          <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8}}>Field Note · Auto Analysis</p>
          <p className="font-serif" style={{fontSize:15,fontWeight:300,lineHeight:1.7,fontStyle:'italic',color:C.charcoal,opacity:0.85}}>
            "TIGER 360750.KS holds above its 200-day MA. USD/KRW softening suggests KRW strength — monitor BoK rate decision Jun 3rd. Portfolio remains US-equity heavy at 65%; consider adding KR domestic exposure for diversification. Cash buffer adequate for opportunistic deployment."
          </p>
          <p className="font-mono" style={{fontSize:8,opacity:0.28,marginTop:10}}>AGENT:RESEARCH · {new Date().toLocaleDateString('en-GB').replace(/\//g,'-')} · AUTO</p>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   VIEW 4 — COUNCIL
══════════════════════════════════════════════════════════ */
const CANNED = {
  BULL: `S&P500 momentum intact. Fed pivot narrative strengthening — CME FedWatch showing 78% probability of June cut. Q1 earnings beat rate at 78%. TIGER ETF target ₩16,400 by Q3 2026. Technical structure bullish: higher lows since Feb. Risk/reward favors long bias. Accumulate on any -5% pullback.`,
  BEAR: `USD/KRW structural weakness creates FX drag on USD-denominated returns. Korean retail sentiment elevated — contrarian concern. BOJ normalization compressing regional risk appetite. Global PMI divergence widening. Recommend reducing gross exposure 15% and adding KRW-denominated hedge. Probability of -12% drawdown within 60D: ~34%.`,
  RISK: `Portfolio VaR (95%, 1D): ₩28,400 — within tolerance band. Max drawdown since inception: -11.2%. Sharpe: 1.34. Sortino: 1.71. Correlation to SPX: 0.97 — single-factor risk elevated. Beta: 1.08. Recommend uncorrelated position (gold ETF or KR short-duration bond) to bring portfolio VaR below ₩22,000.`,
  PM:   `Synthesizing committee: 2 bullish signals, 1 cautionary, 1 risk flag. Decision: HOLD current TIGER allocation. Set alert ₩13,800 stop / ₩15,500 take-profit. BOK Jun 3rd is key trigger. No new capital deployment until VaR normalized. Review in 7 days or on trigger. Cash buffer 15% retained for opportunistic entry.`,
};

function CouncilView() {
  const [reports, setReports] = useState(()=>lsGet(LS_COUNCIL,{BULL:'',BEAR:'',RISK:'',PM:'',ts:null}));
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);

  useEffect(()=>{ lsSet(LS_COUNCIL,reports); },[reports]);

  function runCommittee(){
    setRunning(true); setElapsed(0);
    const start=Date.now();
    const tick=setInterval(()=>setElapsed(Math.round((Date.now()-start)/100)/10),100);
    // Simulate streaming agent responses with delays
    const delays={BULL:800, BEAR:1600, RISK:2400, PM:3400};
    Object.entries(delays).forEach(([agent,delay])=>{
      setTimeout(()=>{
        setReports(prev=>({...prev,[agent]:CANNED[agent]}));
      },delay);
    });
    setTimeout(()=>{
      clearInterval(tick);
      setRunning(false);
      setReports(prev=>({...prev,ts:new Date().toISOString()}));
    },4000);
  }

  const agents=[
    {id:'BULL',role:'Bull Analyst',  color:C.terra,   symbol:'▲'},
    {id:'BEAR',role:'Bear Analyst',  color:C.olive,   symbol:'▼'},
    {id:'RISK',role:'Risk Officer',  color:C.ochre,   symbol:'◆'},
    {id:'PM',  role:'Portfolio Mgr.',color:C.charcoal,symbol:'■'},
  ];

  return (
    <div className="tab-view" style={{minHeight:'100vh',paddingBottom:60,position:'relative'}}>
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
        <div style={{position:'absolute',top:0,left:0,right:0,opacity:0.09}}><TopologicalMap width={1200} height={180} color={C.terra} offsetX={2.1}/></div>
        <div style={{position:'absolute',top:'28%',left:'38%',opacity:0.08}}><RadarAccent size={220} color={C.charcoal}/></div>
        <div style={{position:'absolute',top:18,right:28}}><Crosshair size={56} color={C.terra} opacity={0.13}/></div>
        <div style={{position:'absolute',bottom:50,left:50}}><Crosshair size={40} color={C.ochre} opacity={0.12}/></div>
      </div>

      <div style={{position:'relative',zIndex:10,padding:'44px 44px 0'}} className="hero-pad">
        <span className="tag" style={{color:C.charcoal,borderColor:C.charcoal,opacity:0.45,marginBottom:8,display:'inline-block'}}>Classified · Committee Session</span>
        <h1 className="font-serif hero-text" style={{fontSize:64,lineHeight:1,fontWeight:300,letterSpacing:'-0.02em',marginBottom:8}}>
          Investment<br/><em style={{color:C.terra}}>Council</em>
        </h1>

        <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:24,flexWrap:'wrap'}}>
          <button onClick={runCommittee} disabled={running} className="btn-primary"
            style={{fontSize:11,padding:'10px 22px'}}>
            {running ? '▶ Running Committee…' : reports.ts ? '↻ Re-run Committee' : '▶ Run Committee'}
          </button>
          {running&&(
            <div style={{display:'flex',gap:5,alignItems:'center'}}>
              {[0,1,2].map(i=><div key={i} className="thinking-dot" style={{width:6,height:6,borderRadius:'50%',background:C.terra}}/>)}
              <span className="font-mono" style={{fontSize:10,opacity:0.5,marginLeft:4}}>{elapsed}s</span>
            </div>
          )}
          {reports.ts&&!running&&(
            <span className="font-mono" style={{fontSize:9,opacity:0.35}}>
              Last session: {new Date(reports.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
            </span>
          )}
        </div>

        <div className="grid-2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
          {agents.map(a=>(
            <div key={a.id} className="glass" style={{borderRadius:12,padding:'20px 24px',borderLeft:`3px solid ${a.color}`,position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',top:10,right:10,opacity:0.28}}><RadarAccent size={42} color={a.color}/></div>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                <div style={{width:30,height:30,borderRadius:6,border:`1px solid ${a.color}`,background:`rgba(44,44,44,0.05)`,
                  display:'flex',alignItems:'center',justifyContent:'center',color:a.color,fontSize:13}}>{a.symbol}</div>
                <div>
                  <p className="font-mono" style={{fontSize:8,color:a.color,textTransform:'uppercase',letterSpacing:'0.12em'}}>Agent · {a.id}</p>
                  <p className="font-serif" style={{fontSize:15,fontWeight:400}}>{a.role}</p>
                </div>
              </div>
              <div style={{minHeight:72,background:'rgba(44,44,44,0.03)',borderRadius:6,padding:'10px 12px',
                borderTop:'1px dashed rgba(44,44,44,0.1)',borderBottom:'1px dashed rgba(44,44,44,0.1)',marginBottom:12}}>
                {running&&!reports[a.id]?(
                  <div style={{display:'flex',gap:5,alignItems:'center',height:52,justifyContent:'center'}}>
                    {[0,1,2].map(i=><div key={i} className="thinking-dot" style={{width:5,height:5,borderRadius:'50%',background:a.color}}/>)}
                  </div>
                ):(
                  <p className="font-mono" style={{fontSize:10,lineHeight:1.7,opacity:reports[a.id]?0.8:0.3,color:C.charcoal}}>
                    {reports[a.id]||'— Awaiting session —'}
                  </p>
                )}
              </div>
              <svg style={{position:'absolute',bottom:0,left:0,width:'100%',height:3}}>
                <line x1="0" y1="1.5" x2="100%" y2="1.5" stroke={a.color} strokeWidth="1" strokeDasharray="4 6" opacity="0.4"/>
              </svg>
            </div>
          ))}
        </div>

        {reports.BULL&&reports.BEAR&&reports.RISK&&reports.PM&&(
          <div className="glass" style={{borderRadius:12,padding:'18px 24px',marginTop:18}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
              <Crosshair size={26} color={C.terra} opacity={0.55}/>
              <div>
                <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em'}}>Committee Consensus</p>
                <p className="font-serif" style={{fontSize:18,fontWeight:300}}>Strategic Verdict: <em style={{color:C.terra}}>Hold & Monitor</em></p>
              </div>
            </div>
            <div style={{display:'flex',gap:16,alignItems:'center',flexWrap:'wrap'}}>
              {[{l:'BULL',v:'ACCUMULATE',c:C.terra},{l:'BEAR',v:'HEDGE',c:C.olive},{l:'RISK',v:'MONITOR',c:C.ochre},{l:'PM',v:'HOLD',c:C.charcoal}].map((s,i,arr)=>(
                <React.Fragment key={s.l}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
                    <div style={{width:8,height:8,borderRadius:'50%',background:s.c}}/>
                    <span className="font-mono" style={{fontSize:8,color:s.c,textTransform:'uppercase'}}>{s.l}</span>
                    <span className="font-mono" style={{fontSize:7,opacity:0.45}}>{s.v}</span>
                  </div>
                  {i<arr.length-1&&<div style={{flex:1,height:1,borderTop:'1px dashed rgba(44,44,44,0.15)'}}/>}
                </React.Fragment>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   SIDEBAR NAV
══════════════════════════════════════════════════════════ */
const NAV=[
  {id:'briefing',label:'Briefing', icon:'radio'},
  {id:'mission', label:'Mission',  icon:'crosshair'},
  {id:'research',label:'Research', icon:'activity'},
  {id:'council', label:'Council',  icon:'users'},
];

/* ══════════════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════════════ */
function App(){
  const [active,   setActive]   = useState('briefing');
  const [tasks,    setTasks]    = useState(()=>lsGet(LS_TASKS, DEFAULT_TASKS));
  const [expenses, setExpenses] = useState(()=>lsGet(LS_EXPENSES, DEFAULT_EXPENSES));
  const [toast,    setToast]    = useState(null);

  useEffect(()=>{ lsSet(LS_TASKS,tasks); },    [tasks]);
  useEffect(()=>{ lsSet(LS_EXPENSES,expenses); },[expenses]);

  function showToast(msg){ setToast(msg); }

  function toggleTask(id){
    setTasks(t=>t.map(x=>x.id===id?{...x,done:!x.done}:x));
  }
  function addTask(t){
    setTasks(prev=>[...prev,t]);
    showToast(`Added: ${t.label}`);
  }
  function deleteTask(id){
    setTasks(prev=>prev.filter(t=>t.id!==id));
    showToast('Task removed');
  }
  function addExpense(e){
    setExpenses(prev=>[...prev,e]);
    showToast(`Logged: ${e.label} ${e.usd?'$'+e.amt:'₩'+e.amt.toLocaleString()} → Card ${e.card}`);
  }

  const views={
    briefing:<BriefingView expenses={expenses} onAddExpense={addExpense}/>,
    mission: <MissionView tasks={tasks} onToggleTask={toggleTask} onAddTask={addTask} onDeleteTask={deleteTask}/>,
    research:<ResearchView/>,
    council: <CouncilView/>,
  };

  return (
    <>
      <nav className="sidebar">
        {/* Logo */}
        <div style={{marginBottom:18}}>
          <svg width="26" height="26" viewBox="0 0 26 26">
            <rect x="2" y="2" width="22" height="22" stroke={C.charcoal} strokeWidth="1.1" fill="none" rx="4"/>
            <line x1="2" y1="9.5" x2="24" y2="9.5" stroke={C.terra} strokeWidth="0.8"/>
            <line x1="9.5" y1="2" x2="9.5" y2="24" stroke={C.terra} strokeWidth="0.8"/>
            <circle cx="9.5" cy="9.5" r="2.2" fill={C.terra}/>
          </svg>
        </div>
        <div style={{height:1,width:32,background:'rgba(44,44,44,0.1)',marginBottom:10}}/>
        {NAV.map(n=>(
          <button key={n.id} className={`nav-btn${active===n.id?' active':''}`} onClick={()=>setActive(n.id)}>
            <Icon name={n.icon} size={16}/>
            <span className="nav-tooltip">{n.label}</span>
          </button>
        ))}
        <div style={{marginTop:'auto',display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
          <div style={{height:1,width:32,background:'rgba(44,44,44,0.1)',marginBottom:4}}/>
          <button className="nav-btn" title="Settings"><Icon name="settings" size={15}/><span className="nav-tooltip">Settings</span></button>
        </div>
      </nav>

      <main className="main-scroll">
        <div key={active}>{views[active]}</div>
      </main>

      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

// Register service worker (only on https/http, not file://)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./frontend/sw.js').catch(()=>{});
}
</script>
</body>
</html>
