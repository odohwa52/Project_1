<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E8450A" />
  <title>Financial OS</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" onerror="this.src='vendor/react.js'"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" onerror="this.src='vendor/react-dom.js'"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" onerror="this.src='vendor/babel.min.js'"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════════
       FINANCIAL OS — DESIGN TOKENS
       Hybrid: light theme + terminal-grade typography density
       ═══════════════════════════════════════════════════════════════ */
    :root {
      /* Surfaces */
      --bg-page:         #F0F2F5;
      --bg-card:         #FFFFFF;
      --bg-overlay:      #F7F8FA;
      --bg-hover:        #FAFBFC;
      --bg-sidebar:      #1A1F2E;
      --bg-sidebar-hover:#252B3D;

      /* Borders */
      --border:          #E5E7EB;
      --border-strong:   #D1D5DB;
      --border-faint:    rgba(229, 231, 235, 0.5);

      /* Accent */
      --accent:          #E8450A;
      --accent-soft:     #FEF1EC;
      --accent-2:        #F97316;
      --navy:            #1E3A5F;

      /* Semantic */
      --positive:        #059669;
      --positive-soft:   #ECFDF5;
      --negative:        #DC2626;
      --negative-soft:   #FEF2F2;
      --warning:         #D97706;
      --warning-soft:    #FFFBEB;
      --gold:            #F59E0B;

      /* Text */
      --text:            #111827;
      --text-secondary:  #4B5563;
      --text-muted:      #6B7280;
      --text-faint:      #9CA3AF;
      --text-on-dark:    #F0F3FA;
      --text-on-dark-muted: #8B9DC3;

      /* Cards & shadows */
      --shadow-sm:       0 1px 2px rgba(17, 24, 39, 0.04);
      --shadow:          0 4px 20px rgba(17, 24, 39, 0.06);
      --shadow-lg:       0 12px 32px rgba(17, 24, 39, 0.10);
      --radius:          16px;
      --radius-sm:       8px;

      /* Type */
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg-page);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }

    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ─── APP SHELL ─────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
    }

    /* ─── SIDEBAR (DESKTOP) ─────────────────────────────────────── */
    .sidebar {
      background: var(--bg-sidebar);
      color: var(--text-on-dark);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    @media (max-width: 900px) {
      .sidebar { display: none; }
    }

    .sidebar-header {
      padding: 8px 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-logo {
      width: 8px; height: 8px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(232, 69, 10, 0.6);
    }

    .sidebar-name {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-on-dark);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-on-dark-muted);
      font-size: 13px;
      font-weight: 500;
      width: 100%;
      text-align: left;
      transition: background 150ms ease, color 150ms ease;
    }

    .nav-item:hover {
      background: var(--bg-sidebar-hover);
      color: var(--text-on-dark);
    }

    .nav-item.active {
      background: var(--bg-sidebar-hover);
      color: var(--text-on-dark);
    }

    .nav-item.active::before {
      content: '';
      width: 3px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
      margin-left: -12px;
      margin-right: 9px;
    }

    .nav-icon {
      width: 16px; height: 16px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
    }

    .sidebar-spacer { flex: 1; }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-on-dark-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-footer .row {
      display: flex; justify-content: space-between; align-items: center;
    }

    .sidebar-footer .ok { color: #5EE2D0; }
    .sidebar-footer .warn { color: #F59E0B; }

    /* ─── MAIN AREA ─────────────────────────────────────────────── */
    .main {
      padding: 32px 40px;
      max-width: 1400px;
      width: 100%;
      padding-bottom: 100px;
    }
    @media (max-width: 900px) {
      .main { padding: 20px 16px 100px; }
    }

    /* ─── PAGE HEADER ───────────────────────────────────────────── */
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .page-subtitle {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .page-actions {
      display: flex;
      gap: 8px;
    }

    /* ─── CARDS ─────────────────────────────────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      transition: box-shadow 200ms ease;
    }

    .card-tight { padding: 16px 20px; }

    .card-meta {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-faint);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-faint);
      margin-bottom: 14px;
    }

    .card-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      font-weight: 500;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .card-value {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .card-value.large {
      font-size: 36px;
      letter-spacing: -0.025em;
    }

    .card-row { display: flex; justify-content: space-between; align-items: baseline; }

    /* ─── BUTTONS ───────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      transition: background 150ms ease, transform 100ms ease;
      white-space: nowrap;
    }

    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #D03F08; }

    .btn-ghost {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--bg-hover); border-color: var(--border-strong); }

    .btn-icon {
      width: 32px; height: 32px;
      padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px;
      background: var(--bg-overlay);
      color: var(--text-muted);
    }
    .btn-icon:hover { background: var(--accent-soft); color: var(--accent); }

    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ─── DELTA PILLS ───────────────────────────────────────────── */
    .delta {
      display: inline-flex; align-items: center; gap: 3px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }
    .delta.positive { color: var(--positive); background: var(--positive-soft); }
    .delta.negative { color: var(--negative); background: var(--negative-soft); }
    .delta.warning  { color: var(--warning); background: var(--warning-soft); }
    .delta.neutral  { color: var(--text-muted); background: var(--bg-overlay); }

    /* ─── DONUT RING ─────────────────────────────────────────────── */
    .donut {
      width: 80px; height: 80px;
      transform: rotate(-90deg);
      flex-shrink: 0;
    }
    .donut-track { stroke: var(--border); }
    .donut-fill { transition: stroke-dashoffset 600ms cubic-bezier(0.4, 0, 0.2, 1); }

    /* ─── HOME GRID ─────────────────────────────────────────────── */
    .home-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .home-grid { grid-template-columns: 1fr; }
    }

    .home-left { display: flex; flex-direction: column; gap: 20px; }
    .home-right { display: flex; flex-direction: column; gap: 20px; }

    /* Briefing card */
    .briefing-list {
      display: flex; flex-direction: column;
      gap: 12px;
    }
    .briefing-item {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 13px;
    }
    .briefing-bullet {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 8px;
      flex-shrink: 0;
    }
    .briefing-bullet.muted { background: var(--text-faint); }

    /* Portfolio chart card */
    .portfolio-chart-svg {
      width: 100%; height: 140px;
      display: block;
      margin: 16px -4px -4px;
    }

    /* Three card grid for budget */
    .budget-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    @media (max-width: 600px) {
      .budget-grid { grid-template-columns: 1fr; }
    }

    .budget-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .budget-card-info { flex: 1; min-width: 0; }
    .budget-card-name {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .budget-card-value {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .budget-card-cap {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-faint);
      margin-top: 2px;
    }

    /* Quick log expense */
    .quick-log {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .quick-log input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: var(--bg-card);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .quick-log input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* Today list (right column) */
    .today-list { display: flex; flex-direction: column; gap: 10px; }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      transition: background 150ms ease, transform 100ms ease;
    }
    .task-item:hover { background: var(--bg-hover); }
    .task-item.type-academic { border-left-color: var(--accent); }
    .task-item.type-social   { border-left-color: var(--navy); }
    .task-item.type-personal { border-left-color: var(--text-faint); }
    .task-item.completed { opacity: 0.5; }
    .task-item.completed .task-content { text-decoration: line-through; }

    .task-checkbox {
      width: 18px; height: 18px;
      border: 1.5px solid var(--border-strong);
      border-radius: 4px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin-top: 2px;
      transition: background 150ms, border-color 150ms;
    }
    .task-checkbox.checked {
      background: var(--positive);
      border-color: var(--positive);
    }
    .task-checkbox.checked::after {
      content: ''; width: 4px; height: 8px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .task-body { flex: 1; min-width: 0; }
    .task-content {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
      word-break: break-word;
    }
    .task-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .task-meta .urgency.overdue { color: var(--negative); font-weight: 500; }
    .task-meta .urgency.today { color: var(--accent); font-weight: 500; }
    .task-meta .urgency.tomorrow { color: var(--warning); }

    .priority-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--negative);
      display: inline-block;
      margin-right: 4px;
    }

    /* ─── DATA TABLE ─────────────────────────────────────────────── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 12px;
    }

    .data-table thead tr { border-bottom: 1px solid var(--border-strong); }
    .data-table thead th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: var(--text-muted);
      font-weight: 500;
      padding: 10px 12px;
      text-align: left;
      font-family: var(--mono);
    }
    .data-table thead th.numeric { text-align: right; }

    .data-table tbody tr {
      border-bottom: 1px solid var(--border-faint);
      transition: background 100ms ease;
    }
    .data-table tbody tr:hover { background: var(--bg-hover); }

    .data-table tbody td {
      padding: 10px 12px;
      color: var(--text-secondary);
      vertical-align: middle;
    }
    .data-table tbody td.ticker { color: var(--text); font-weight: 500; }
    .data-table tbody td.numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ─── FORMS ─────────────────────────────────────────────────── */
    .form-row {
      display: flex; flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-row label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg-card);
    }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* ─── COMMITTEE DEBATE ──────────────────────────────────────── */
    .committee-stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    @media (max-width: 700px) {
      .committee-stage { grid-template-columns: 1fr; }
    }

    .agent-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: all 250ms ease;
      position: relative;
      min-height: 200px;
    }

    .agent-card.pending {
      opacity: 0.4;
      border-style: dashed;
    }

    .agent-card.thinking {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .agent-card.complete {
      border-color: var(--border-strong);
    }

    .agent-card.pm {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--accent-soft) 0%, var(--bg-card) 100%);
      border-color: var(--accent);
    }

    .agent-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }

    .agent-role {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .agent-icon {
      width: 24px; height: 24px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: #fff;
    }

    .agent-card.bull .agent-icon { background: var(--positive); }
    .agent-card.bear .agent-icon { background: var(--negative); }
    .agent-card.risk .agent-icon { background: var(--warning); }
    .agent-card.pm .agent-icon { background: var(--accent); }

    .agent-status {
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      padding: 3px 7px;
      border-radius: 4px;
      background: var(--bg-overlay);
    }

    .agent-status.thinking { color: var(--accent); background: var(--accent-soft); }
    .agent-status.complete { color: var(--positive); background: var(--positive-soft); }

    .agent-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .typing-indicator {
      display: inline-flex; gap: 3px;
      padding: 8px 0;
    }
    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: typing-bounce 1.4s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    /* ─── BOTTOM NAV (mobile) ───────────────────────────────────── */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 8px 0;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 50;
      grid-template-columns: repeat(4, 1fr);
    }
    @media (max-width: 900px) {
      .bottom-nav { display: grid; }
    }

    .bottom-nav-item {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      padding: 6px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
    }
    .bottom-nav-item.active { color: var(--accent); }
    .bottom-nav-item .nav-icon { width: 20px; height: 20px; }

    /* ─── MODAL ─────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(17, 24, 39, 0.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 16px;
      animation: fade-in 200ms ease;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slide-up 250ms ease;
    }
    @keyframes slide-up {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }

    .modal-title { font-size: 18px; font-weight: 600; }

    .modal-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }
    .modal-close:hover { background: var(--bg-overlay); color: var(--text); }

    /* ─── TOAST ─────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 80px;

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

// ═══════════════════════════════════════════════════════════════════
// LOCAL STORAGE LAYER — replaces backend for browser-only demo
// ═══════════════════════════════════════════════════════════════════
const STORAGE_KEY = 'financial-os-v1';
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:8000'
  : 'https://sophisticated-coordinator-bin-performing.trycloudflare.com';

const api = {
  post: (path, body) => fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json()),
  get:  (path) => fetch(API_BASE + path).then(r => r.json()),
};

const DEFAULT_STATE = {
  expenses: [],
  reimbursements: [],
  todos: [
    { id: 1, content: 'Problem set 4 due', type: 'academic', class_id: 1, due_date: dateOffset(1), priority: 'high', completed: false },
    { id: 2, content: 'Thesis literature review', type: 'academic', class_id: 2, due_date: dateOffset(3), priority: 'normal', completed: false },
    { id: 3, content: 'Reply to mentor email', type: 'personal', due_date: dateOffset(0), priority: 'high', completed: false },
    { id: 4, content: 'Daily Japanese vocab', type: 'personal', due_date: dateOffset(0), priority: 'normal', completed: false, repeat_pattern: 'daily' },
  ],
  classes: [
    { id: 1, name: 'EM Theory', code: 'PHY3120', semester: '2026-1', color: '#E8450A', archived: false },
    { id: 2, name: 'Junior Thesis', code: 'NSE3990', semester: '2026-1', color: '#E8450A', archived: false },
    { id: 3, name: 'Quantitative Methods', code: 'BUS3210', semester: '2026-1', color: '#1E3A5F', archived: false },
  ],
  friends: [
    { id: 1, name: 'Junho' },
    { id: 2, name: 'Minji' },
    { id: 3, name: 'Sora' },
  ],
  social_plans: [
    { id: 1, friend_ids: [1, 2], plan_date: dateOffset(0), plan_time: '19:00', location: 'Hongdae', notes: 'dinner' },
  ],
  research_history: [],
  committee_history: [],
  next_id: 100,
};

function dateOffset(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...DEFAULT_STATE, ...JSON.parse(raw) };
  } catch (e) { /* ignore */ }
  return DEFAULT_STATE;
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

// ═══════════════════════════════════════════════════════════════════
// EXPENSE PARSER (heuristic version — same logic as backend)
// ═══════════════════════════════════════════════════════════════════
const MERCHANT_DICT = {
  'gs25': ['GS25', 'convenience'],
  'cu': ['CU', 'convenience'],
  '7-eleven': ['7-Eleven', 'convenience'],
  'olive young': ['Olive Young', 'shopping'],
  'starbucks': ['Starbucks', 'dining'],
  'mega': ['Mega Coffee', 'dining'],
  'ediya': ['Ediya', 'dining'],
  'kakao': ['KakaoT', 'transport'],
  'uber': ['Uber', 'transport'],
  'subway': ['Subway', 'transport'],
  '지하철': ['Subway', 'transport'],
  '버스': ['Bus', 'transport'],
  'coupang': ['Coupang', 'shopping'],
  'netflix': ['Netflix', 'subscriptions'],
  'spotify': ['Spotify', 'subscriptions'],
  'youtube': ['YouTube Premium', 'subscriptions'],
  'lunch': ['Restaurant', 'dining'],
  'dinner': ['Restaurant', 'dining'],
};

function parseExpense(text) {
  const t = text.toLowerCase().trim();

  // Amount
  const amountMatch = t.match(/\b(\d{1,3}(?:,\d{3})+|\d+)\b/);
  const amount = amountMatch ? parseInt(amountMatch[1].replace(/,/g, ''), 10) : null;

  // Card
  let card_id = null;
  const cardMatch = t.match(/card\s+([abc])\b/);
  if (cardMatch) card_id = cardMatch[1].toUpperCase();
  else {
    const trailing = t.match(/\b([abc])\s*$/);
    if (trailing) card_id = trailing[1].toUpperCase();
  }

  // Recurring
  const is_recurring = /\b(monthly|recurring|subscription)\b/.test(t);

  // Reimb names
  let reimb_names = [];
  const splitMatch = t.match(/(?:split|share)\s+with\s+(.+?)(?:\s+card|\s*$)/);
  if (splitMatch) {
    reimb_names = splitMatch[1]
      .split(/\s*(?:,|and|&)\s*/)
      .map(n => n.trim())
      .filter(Boolean)
      .map(n => n.charAt(0).toUpperCase() + n.slice(1));
  }

  // Merchant
  let merchant = null, category = null;
  for (const [kw, [m, c]] of Object.entries(MERCHANT_DICT)) {
    if (t.includes(kw)) { merchant = m; category = c; break; }
  }

  // Defaults
  if (!card_id) card_id = (amount && amount >= 50000) ? 'C' : 'B';
  if (!category) category = 'other';
  if (!merchant) merchant = 'Unknown';

  return {
    amount, merchant, card_id, category, is_recurring, reimb_names,
    reimbursable: card_id === 'A',
  };
}

// ═══════════════════════════════════════════════════════════════════
// FORMATTERS
// ═══════════════════════════════════════════════════════════════════
const krw = (n) => '₩' + (n || 0).toLocaleString('ko-KR');
const pct = (n, dp = 2) => (n >= 0 ? '+' : '') + n.toFixed(dp) + '%';

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + 'h ago';
  return Math.floor(hours / 24) + 'd ago';
}

function urgencyFor(dateStr) {
  if (!dateStr) return null;
  const diff = (new Date(dateStr) - new Date(new Date().toDateString())) / 86400000;
  if (diff < 0) return 'overdue';
  if (diff === 0) return 'today';
  if (diff === 1) return 'tomorrow';
  if (diff <= 3) return 'soon';
  return null;
}

// ═══════════════════════════════════════════════════════════════════
// APP STATE / DATA HOOKS
// ═══════════════════════════════════════════════════════════════════
const StateContext = createContext(null);

function StateProvider({ children }) {
  const [state, setState] = useState(loadState);
  const [toast, setToast] = useState(null);

  useEffect(() => { saveState(state); }, [state]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  };

  const update = (updater) => {
    setState(prev => typeof updater === 'function' ? updater(prev) : { ...prev, ...updater });
  };

  // ─── EXPENSE OPS ─────────────────────────────────────────────
const logExpense = async (text) => {
    try {
      const result = await api.post('/api/expenses/log', { text });
      showToast(`Logged ${krw(result.amount)} · ${result.merchant} · Card ${result.card_id}`);
      update(s => ({ ...s, expenses: [result, ...s.expenses] }));
      return result;
    } catch (e) {
      const parsed = parseExpense(text);
      if (!parsed.amount) { showToast('Could not parse amount'); return null; }
      const id = Date.now();
      const expense = { id, amount: parsed.amount, merchant: parsed.merchant, card_id: parsed.card_id, category: parsed.category, reimbursable: parsed.reimbursable, is_recurring: parsed.is_recurring, raw_input: text, created_at: new Date().toISOString() };
      update(s => ({ ...s, expenses: [expense, ...s.expenses], next_id: s.next_id + 1 }));
      showToast(`[offline] Logged ${krw(parsed.amount)} · ${parsed.merchant}`);
      return expense;
    }
  };

  const settleReimbursement = (person) => {
    update(s => ({
      ...s,
      reimbursements: s.reimbursements.map(r =>
        r.person_name === person && r.status !== 'settled'
          ? { ...r, status: 'settled', amount_paid: r.amount_owed, settled_at: new Date().toISOString() }
          : r
      ),
    }));
    showToast(`Settled ${person}'s reimbursements`);
  };

  // ─── TODO OPS ────────────────────────────────────────────────
  const addTodo = (todo) => {
    update(s => ({
      ...s,
      todos: [{ id: s.next_id, completed: false, ...todo }, ...s.todos],
      next_id: s.next_id + 1,
    }));
    showToast('Added to plan');
  };

  const toggleTodo = (id) => {
    update(s => {
      const todo = s.todos.find(t => t.id === id);
      if (!todo) return s;
      const updated = s.todos.map(t =>
        t.id === id ? { ...t, completed: !t.completed, completed_at: !t.completed ? new Date().toISOString() : null } : t
      );
      // Repeat pattern: spawn next instance when completed
      if (!todo.completed && todo.repeat_pattern && todo.due_date) {
        const next = nextOccurrence(todo.due_date, todo.repeat_pattern);
        if (next) {
          updated.push({ ...todo, id: s.next_id, due_date: next, completed: false });
          return { ...s, todos: updated, next_id: s.next_id + 1 };
        }
      }
      return { ...s, todos: updated };
    });
  };

  const deleteTodo = (id) => {
    update(s => ({ ...s, todos: s.todos.filter(t => t.id !== id) }));
  };

  // ─── CLASS OPS ───────────────────────────────────────────────
  const addClass = (cls) => {
    update(s => ({
      ...s,
      classes: [...s.classes, { id: s.next_id, archived: false, ...cls }],
      next_id: s.next_id + 1,
    }));
    showToast(`Added ${cls.name}`);
  };

  const archiveClass = (id) => {
    update(s => ({
      ...s,
      classes: s.classes.map(c => c.id === id ? { ...c, archived: true } : c),
    }));
  };

  const restoreClass = (id) => {
    update(s => ({
      ...s,
      classes: s.classes.map(c => c.id === id ? { ...c, archived: false } : c),
    }));
  };

  const archiveSemester = (semester) => {
    update(s => ({
      ...s,
      classes: s.classes.map(c =>
        c.semester === semester && !c.archived ? { ...c, archived: true } : c
      ),
    }));
    showToast(`Archived ${semester} classes`);
  };

  // ─── FRIENDS ─────────────────────────────────────────────────
  const addFriend = (name, notes) => {
    update(s => ({
      ...s,
      friends: [...s.friends, { id: s.next_id, name, notes }],
      next_id: s.next_id + 1,
    }));
  };

  const addPlan = (plan) => {
    update(s => ({
      ...s,
      social_plans: [...s.social_plans, { id: s.next_id, ...plan }],
      next_id: s.next_id + 1,
    }));
    showToast('Plan saved');
  };

  // ─── HISTORY ─────────────────────────────────────────────────
  const recordResearch = (memo) => {
    update(s => ({
      ...s,
      research_history: [{ ...memo, id: s.next_id, created_at: new Date().toISOString() }, ...s.research_history],
      next_id: s.next_id + 1,
    }));
  };

  const recordCommittee = (decision) => {
    update(s => ({
      ...s,
      committee_history: [{ ...decision, id: s.next_id, created_at: new Date().toISOString() }, ...s.committee_history],
      next_id: s.next_id + 1,
    }));
  };

  const ctx = {
    state, update, showToast,
    logExpense, settleReimbursement,
    addTodo, toggleTodo, deleteTodo,
    addClass, archiveClass, restoreClass, archiveSemester,
    addFriend, addPlan,
    recordResearch, recordCommittee,
  };

  return (
    <StateContext.Provider value={ctx}>
      {children}
      {toast && <div className="toast">{toast}</div>}
    </StateContext.Provider>
  );
}

const useApp = () => useContext(StateContext);

function nextOccurrence(dateStr, pattern) {
  const d = new Date(dateStr);
  if (pattern === 'daily') d.setDate(d.getDate() + 1);
  else if (pattern === 'weekly') d.setDate(d.getDate() + 7);
  else if (pattern.startsWith('monthly')) d.setMonth(d.getMonth() + 1);
  else return null;
  return d.toISOString().split('T')[0];
}

// ═══════════════════════════════════════════════════════════════════
// COMPUTED VIEWS
// ═══════════════════════════════════════════════════════════════════
function useSpendingSummary() {
  const { state } = useApp();
  return useMemo(() => {
    const thisMonth = new Date().toISOString().slice(0, 7);
    const monthExpenses = state.expenses.filter(e =>
      e.created_at && e.created_at.slice(0, 7) === thisMonth
    );

    const cards = {
      A: { id: 'A', label: 'Group / Reimbursable', color: '#1E3A5F', spent: 0, budget_max: null },
      B: { id: 'B', label: 'Daily Use', color: '#E8450A', spent: 0, budget_max: 300000 },
      C: { id: 'C', label: 'Larger Purchases', color: '#F59E0B', spent: 0, budget_max: null, budget_min: 500000 },
    };

    monthExpenses.forEach(e => {
      if (cards[e.card_id]) cards[e.card_id].spent += e.amount;
    });

    Object.values(cards).forEach(c => {
      if (c.budget_max) {
        c.pct_used = Math.round(c.spent * 100 / c.budget_max * 10) / 10;
        c.remaining = c.budget_max - c.spent;
        c.over_budget = c.spent > c.budget_max;
      }
    });

    // Days remaining in month
    const today = new Date();
    const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    const daysRemaining = lastDay.getDate() - today.getDate();

    // Categories
    const catMap = {};
    monthExpenses.forEach(e => {
      catMap[e.category] = (catMap[e.category] || 0) + e.amount;
    });
    const categories = Object.entries(catMap)
      .map(([category, total]) => ({ category, total }))
      .sort((a, b) => b.total - a.total);

    return {
      cards,
      total_spent: monthExpenses.reduce((s, e) => s + e.amount, 0),
      days_remaining: daysRemaining,
      categories,
      monthExpenses,
    };
  }, [state.expenses]);
}

function useReimbursementsOutstanding() {
  const { state } = useApp();
  return useMemo(() => {
    const map = {};
    state.reimbursements
      .filter(r => r.status !== 'settled')
      .forEach(r => {
        if (!map[r.person_name]) map[r.person_name] = { person: r.person_name, owes: 0, count: 0 };
        map[r.person_name].owes += r.amount_owed - (r.amount_paid || 0);
        map[r.person_name].count += 1;
      });
    return Object.values(map).filter(p => p.owes > 0).sort((a, b) => b.owes - a.owes);
  }, [state.reimbursements]);
}

function useTodayView() {
  const { state } = useApp();
  return useMemo(() => {
    const today = dateOffset(0);
    const in3 = dateOffset(3);

    const academic = state.todos
      .filter(t => t.type === 'academic' && !t.completed)
      .filter(t => !t.due_date || t.due_date <= in3)
      .sort((a, b) => (a.due_date || '').localeCompare(b.due_date || ''));

    const personal = state.todos
      .filter(t => t.type === 'personal' && !t.completed)
      .filter(t => t.due_date === today || (!t.due_date && t.priority === 'high'));

    const social = state.social_plans
      .filter(p => p.plan_date === today)
      .map(p => ({
        ...p,
        friend_names: p.friend_ids
          .map(id => state.friends.find(f => f.id === id)?.name)
          .filter(Boolean)
          .join(', '),
      }));

    return { academic, personal, social, today };
  }, [state.todos, state.social_plans, state.friends]);
}

function usePortfolioSnapshot() {
  const [data, setData] = useState(null);
  useEffect(() => {
    api.get('/api/portfolio/snapshot').then(d => setData(d)).catch(() => {});
  }, []);

  const fallback = useMemo(() => {
    const seed = Math.floor(Date.now() / 86400000);
    let s = seed;
    const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const cost = 17400; const today_price = Math.round(cost * (1 + 0.05 + rand() * 0.10));
    const prev = Math.round(today_price * (1 + (rand() - 0.5) * 0.024));
    const history = []; let p = today_price * 0.93;
    for (let i = 0; i < 30; i++) { const d = new Date(); d.setDate(d.getDate() - (29 - i)); p = p * (1 + (rand() - 0.5) * 0.04); history.push({ date: d.toISOString().split('T')[0], price: Math.round(p) }); }
    history[history.length - 1].price = today_price;
    const quantity = 42; const market_value = today_price * quantity; const cost_value = cost * quantity; const total_return = market_value - cost_value;
    return { ticker: '360750.KS', name: 'TIGER S&P 500', quantity, cost_basis: cost, current_price: today_price, prev_close: prev, market_value, cost_value, total_return, total_return_pct: total_return / cost_value * 100, day_change: (today_price - prev) * quantity, day_change_pct: (today_price - prev) / prev * 100, history };
  }, []);

  return data || fallback;
}

function Icon({ name, ...props }) {

function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <div className="modal-title">{title}</div>
          <button className="modal-close" onClick={onClose}>
            <Icon name="x" />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Donut({ value, max, color, size = 80, stroke = 10 }) {
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const ratio = max ? Math.min(value / max, 1) : 0;
  const offset = circumference * (1 - ratio);
  return (
    <svg className="donut" width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={radius}
        fill="none" stroke="var(--border)" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={radius}
        fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={circumference}
        strokeDashoffset={offset}
        strokeLinecap="round"
        className="donut-fill" />
    </svg>
  );
}

function Sparkline({ data, color = '#E8450A', height = 140, fill = true }) {
  if (!data || data.length === 0) return null;
  const W = 600, H = height;
  const prices = data.map(d => d.price);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const range = max - min || 1;
  const stepX = W / (data.length - 1);

  const points = data.map((d, i) => {
    const x = i * stepX;
    const y = H - ((d.price - min) / range * (H - 20)) - 10;
    return [x, y];
  });

  const linePath = points.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ');
  const areaPath = `${linePath} L${W},${H} L0,${H} Z`;

  return (
    <svg className="portfolio-chart-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id="spk-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {fill && <path d={areaPath} fill="url(#spk-fill)" />}
      <path d={linePath} fill="none" stroke={color} strokeWidth="1.5"
        strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

    <div className="budget-card">

function generateResearchMemo(query, portfolio) {
  const min = Math.min(...portfolio.history.map(h => h.price));
  const max = Math.max(...portfolio.history.map(h => h.price));
  return `# Research Memo
**Date**: ${new Date().toISOString().split('T')[0]}

## Question
${query}

## Key Data
- ${portfolio.name} current: ₩${portfolio.current_price.toLocaleString()}/share
- 30-day range: ₩${min.toLocaleString()}–₩${max.toLocaleString()}
- Position return so far: ${portfolio.total_return_pct.toFixed(2)}%
- Daily move: ${pct(portfolio.day_change_pct)}

## Analysis

The position is up ${portfolio.total_return_pct.toFixed(1)}% from cost, well within a normal hold-and-add range for a passive index ETF strategy. The 30-day price action shows the typical small-amplitude noise that comes with broad-market exposure rather than a meaningful trend break either way.

Macro context this week leans neutral: rate-cut timing remains the swing factor, with FOMC minutes leaning slightly hawkish. For a long-horizon DCA strategy, this is largely noise. Won-dollar weakness is a tailwind for KRW-denominated S&P 500 ETFs in the near term but cuts both ways on reversals.

Cash situation is workable. Card B usage is well within month-end limits and outstanding reimbursements are small enough that they don't constrain available cash for the regular DCA increment.

## Recommendation
**Continue scheduled DCA at the standard size; do not chase or pause.** A larger one-shot buy is not warranted here — entry timing on a passive index ETF rarely beats consistent dollar-cost averaging at this position size.

---
*This memo was generated locally. Wire ANTHROPIC_API_KEY in .env to upgrade to live Claude analysis.*`;
}

function CommitteeScreen() {
  const portfolio = usePortfolioSnapshot();
   if (!portfolio || !portfolio.current_price) return null;
  const summary = useSpendingSummary();
  const reimb = useReimbursementsOutstanding();
  const { recordCommittee, state } = useApp();
  const [query, setQuery] = useState('');
  const [running, setRunning] = useState(false);
  const [agents, setAgents] = useState({
    bull: { status: 'idle', text: '' },
    bear: { status: 'idle', text: '' },
    risk: { status: 'idle', text: '' },
    pm:   { status: 'idle', text: '' },
  });

  const runCommittee = async (q) => {
    if (!q?.trim()) return;
    setRunning(true);
    setAgents({
      bull: { status: 'pending', text: '' },
      bear: { status: 'pending', text: '' },
      risk: { status: 'pending', text: '' },
      pm:   { status: 'pending', text: '' },
    });

try {
      const res = await fetch(API_BASE + '/api/committee/stream', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q }),
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const event = JSON.parse(line.slice(6));
          if (event.role) {
            setAgents(a => ({ ...a, [event.role]: { status: event.status || 'complete', text: event.text || '' } }));
          }
        }
      }
} catch (e) {
      // Fallback to canned responses
      const ctx = { portfolio, summary, reimb };
      const responses = generateCommitteeResponses(q, ctx);
      for (const role of ['bull', 'bear', 'risk', 'pm']) {
        setAgents(a => ({ ...a, [role]: { status: 'thinking', text: '' } }));
        await new Promise(r => setTimeout(r, 1200));
        setAgents(a => ({ ...a, [role]: { status: 'complete', text: responses[role] } }));
        await new Promise(r => setTimeout(r, 400));
      }
    }
    recordCommittee({
      query: q.trim(),
      rounds: { bull: agents.bull.text, bear: agents.bear.text, risk: agents.risk.text, pm: agents.pm.text },
      obsidian_path: `Decisions/${dateOffset(0)}-${q.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40)}.md`,
    });
    setRunning(false);
  };

  const showStage = agents.bull.status !== 'idle';

  return (
    <>
      <div className="page-head">
        <div>
          <div className="page-title">Committee</div>
          <div className="page-subtitle">FOUR-AGENT INVESTMENT DEBATE</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <div className="card-meta">QUESTION</div>
        <div className="quick-log">
          <input
            placeholder="e.g. Should I add ₩200K to my TIGER S&P 500 position this week?"
            value={query}
            onChange={e => setQuery(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && !running && runCommittee(query)}
            disabled={running}
          />
          {showStage ? (
            <button className="btn btn-ghost" onClick={reset} disabled={running}>Reset</button>
          ) : (
            <button className="btn btn-primary" disabled={!query.trim()} onClick={() => runCommittee(query)}>
              Convene committee
            </button>
          )}
        </div>

        {!showStage && (
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 12 }}>
            {[
              'Should I add ₩200K this week?',
              'Should I rebalance into bonds?',
              'Trim 10 shares to lock in gains?',
            ].map(q => (
              <button key={q} className="btn btn-ghost btn-sm" onClick={() => { setQuery(q); runCommittee(q); }}>
                {q}
              </button>
            ))}
          </div>
        )}
      </div>

      {showStage && (
        <div className="committee-stage">
          <AgentCard role="bull" name="Bull Analyst" agent={agents.bull} />
          <AgentCard role="bear" name="Bear Analyst" agent={agents.bear} />
          <AgentCard role="risk" name="Risk Manager" agent={agents.risk} />
          <AgentCard role="pm" name="Portfolio Manager" agent={agents.pm} />
        </div>
      )}

      {agents.pm.status === 'complete' && (
        <div style={{ marginTop: 16, fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)', letterSpacing: '0.08em', textTransform: 'uppercase', textAlign: 'center' }}>
          ✓ Decision memo saved to Obsidian — Decisions/{dateOffset(0)}-{query.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40)}.md
        </div>
      )}

      {/* Committee history */}
      {state.committee_history.length > 0 && !showStage && (
        <div className="card" style={{ marginTop: 20 }}>
          <div className="card-meta">DECISION HISTORY</div>
          <div className="today-list">
            {state.committee_history.slice(0, 5).map(d => (
              <div key={d.id} style={{
                padding: '12px 14px',
                background: 'var(--bg-overlay)',
                borderRadius: 8,
              }}>
                <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 4 }}>{d.query}</div>
                <div style={{ fontSize: 12, color: 'var(--text-secondary)', lineHeight: 1.5 }}>
                  {d.rounds.pm.slice(0, 180)}{d.rounds.pm.length > 180 ? '…' : ''}
                </div>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-muted)', marginTop: 6 }}>
                  {timeAgo(d.created_at)}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </>
  );
}

function AgentCard({ role, name, agent }) {
  const initials = { bull: 'BL', bear: 'BR', risk: 'RM', pm: 'PM' };
  const statusLabel = {
    pending: 'Waiting',
    thinking: 'Thinking',
    complete: 'Complete',
    idle: '',
  };
  return (
    <div className={`agent-card ${role} ${agent.status}`}>
      <div className="agent-header">
        <div className="agent-role">
          <div className="agent-icon">{initials[role]}</div>
          {name}
        </div>
        <div className={`agent-status ${agent.status}`}>{statusLabel[agent.status]}</div>
      </div>
      {agent.status === 'thinking' && (
        <div className="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      )}
      {agent.status === 'complete' && (
        <div className="agent-text">{agent.text}</div>
      )}
      {agent.status === 'pending' && (
        <div style={{ fontSize: 12, color: 'var(--text-faint)', fontStyle: 'italic' }}>
          {role === 'pm' ? 'Will hear all three reports first' : 'Pulling context…'}
        </div>
      )}
    </div>
  );
}

function generateCommitteeResponses(query, ctx) {
  const { portfolio, summary, reimb } = ctx;
  const cardBPct = summary.cards.B.pct_used || 0;
  const reimbTotal = reimb.reduce((s, r) => s + r.owes, 0);

  return {
    bull: `The position is up ${portfolio.total_return_pct.toFixed(1)}% from cost, which is healthy but well below the 30%+ region where you'd start trimming. Recent price action — currently ₩${portfolio.current_price.toLocaleString()}/share — sits in the upper half of the 30-day range, suggesting buyers are still in control. With S&P 500 at fresh highs and Korean retail flows turning positive (Korea Herald: 280B won net inflow in April), momentum and structural demand both lean constructive. For a long-horizon DCA program, there's no reason to pause — pausing during uptrends is how DCA underperforms.`,

    bear: `Two concerns. First, FOMC minutes this week leaned hawkish — the rate-cut path is now further out than what was priced into equities at the recent peak. Any disappointment on cuts could compress multiples 5–10% from here. Second, the won has weakened past 1,380 against the dollar, which is a tailwind today but cuts both ways: a sharp reversal would hit returns just as fast on the way down. The position is already up ${portfolio.total_return_pct.toFixed(1)}% — there's no rush to add. Waiting one cycle and observing how the rate path resolves is reasonable, not bearish.`,

    risk: `Card B is at ${cardBPct}% of cap with ${summary.days_remaining} days left in the month — ${cardBPct > 70 ? 'tight' : 'manageable but not loose'}. Outstanding reimbursements: ${krw(reimbTotal)}. Available cash for investing this cycle is real but bounded. Position concentration is high (single ETF) but that's acceptable for a long-horizon broad-index strategy. Recommendation: any add should be sized to the standard DCA increment, not a one-shot buy. Avoid drawing from Card A balances waiting on reimbursement.`,

    pm: `**Verdict: Continue scheduled DCA at standard size — no extra add this cycle.**

The Bull case is real but doesn't warrant deviation; the Bear's rate-path concern is valid enough to avoid a one-shot upsize; the Risk Manager confirms cash is fine for the regular increment but tight for anything larger. The boring answer is the right answer: stick to the program.`,
  };
}

// ═══════════════════════════════════════════════════════════════════
// SCREEN: SETTINGS
// ═══════════════════════════════════════════════════════════════════
function SettingsScreen() {
  const { state, update, showToast } = useApp();
  const [vault, setVault] = useState(localStorage.getItem('obsidian_vault') || '');
  const [briefingTime, setBriefingTime] = useState(localStorage.getItem('briefing_time') || '07:00');
  const [exporting, setExporting] = useState(false);

  const saveSetting = (key, value) => {
    localStorage.setItem(key, value);
    showToast('Saved');
  };

  const exportData = () => {
    setExporting(true);
    const dataStr = JSON.stringify(state, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `financial-os-export-${dateOffset(0)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setExporting(false);
  };

  const wipeData = () => {
    if (confirm('Wipe all local data? This cannot be undone.')) {
      localStorage.removeItem(STORAGE_KEY);
      window.location.reload();
    }
  };

  return (
    <>
      <div className="page-head">
        <div>
          <div className="page-title">Settings</div>
          <div className="page-subtitle">CONFIGURATION · DATA</div>
        </div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 640 }}>

        <div className="card">
          <div className="card-meta">OBSIDIAN VAULT</div>
          <div className="form-row">
            <label>Vault path on this device</label>
            <input value={vault} onChange={e => setVault(e.target.value)}
              placeholder="/Users/yourname/Documents/Obsidian/Vault" />
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 4 }}>
              Required for live memo writing. Leave blank to use local storage only.
            </div>
          </div>
          <button className="btn btn-primary btn-sm" onClick={() => saveSetting('obsidian_vault', vault)}>
            Save vault path
          </button>
        </div>

        <div className="card">
          <div className="card-meta">MORNING BRIEFING</div>
          <div className="form-row">
            <label>Daily generation time</label>
            <input type="time" value={briefingTime} onChange={e => setBriefingTime(e.target.value)} />
          </div>
          <button className="btn btn-primary btn-sm" onClick={() => saveSetting('briefing_time', briefingTime)}>
            Save
          </button>
        </div>

        <div className="card">
          <div className="card-meta">DATA</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500 }}>Export</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Download all data as JSON</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={exportData} disabled={exporting}>
                {exporting ? 'Exporting…' : 'Export'}
              </button>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--negative)' }}>Wipe local data</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Reset to defaults</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={wipeData} style={{ color: 'var(--negative)' }}>
                Wipe
              </button>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-meta">STATS</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 16, fontFamily: 'var(--mono)', fontSize: 12 }}>
            <div>
              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Expenses logged</div>
              <div style={{ fontSize: 18, fontWeight: 600, marginTop: 2 }}>{state.expenses.length}</div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Active todos</div>
              <div style={{ fontSize: 18, fontWeight: 600, marginTop: 2 }}>{state.todos.filter(t => !t.completed).length}</div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Research memos</div>
              <div style={{ fontSize: 18, fontWeight: 600, marginTop: 2 }}>{state.research_history.length}</div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Committee decisions</div>
              <div style={{ fontSize: 18, fontWeight: 600, marginTop: 2 }}>{state.committee_history.length}</div>
            </div>
          </div>
        </div>

      </div>
    </>
  );
}

          </div>
          <div className="row">
            <span>Sync</span>
            <span className="ok">●  OK</span>
          </div>
          <div className="row">

      {/* Main */}
      <main className="main">

      <nav className="bottom-nav">
