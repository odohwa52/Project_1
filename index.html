const RSS_FEEDS = [
  { label:'FT Markets',        url:'https://www.ft.com/markets?format=rss',                           tag:'MKT'   },
  { label:'WSJ Markets',       url:'https://feeds.content.dowjones.io/public/rss/mktw_realtimeheadlines', tag:'MKT'  },
  { label:'Yahoo Finance',     url:'https://finance.yahoo.com/news/rssindex',                         tag:'BIZ'   },
  { label:'Seeking Alpha',     url:'https://seekingalpha.com/market_currents.xml',                    tag:'BIZ'   },
  { label:'Reuters',           url:'https://feeds.reuters.com/reuters/businessNews',                   tag:'WIRE'  },
  { label:'CNBC Top News',     url:'https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114', tag:'WORLD' },
];
const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
const LS_NEWS_CACHE = 'finos_news_v1';

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (diff < 60)   return `${Math.round(diff)}s ago`;
  if (diff < 3600) return `${Math.round(diff/60)}m ago`;
  if (diff < 86400)return `${Math.round(diff/3600)}h ago`;
  return `${Math.round(diff/86400)}d ago`;
}

function NewsView() {
  const [articles,    setArticles]    = useState(()=>lsGet(LS_NEWS_CACHE, []));
  const [loading,     setLoading]     = useState(false);
  const [fetchErr,    setFetchErr]    = useState('');
  const [activeFeed,  setActiveFeed]  = useState('ALL');
  const [summaries,   setSummaries]   = useState({});
  const [summarising, setSummarising] = useState({});
  const [expandedId,  setExpandedId]  = useState(null);
  // Auto-fetch on mount if cache is empty or stale (>30 min)
  useEffect(()=>{
    const cached = lsGet(LS_NEWS_CACHE+'_ts', 0);
    if(!articles.length || (Date.now()-cached) > 30*60*1000) fetchNews();
  },[]);

  async function fetchNews() {
    setLoading(true); setFetchErr('');
    try {
      const results = await Promise.allSettled(
        RSS_FEEDS.map(feed =>
          fetch(`${RSS2JSON}${encodeURIComponent(feed.url)}&count=8`)
            .then(r=>r.json())
            .then(d=>(d.items||[]).map(item=>({
              id: btoa(item.link||item.title).slice(0,16),
              title: item.title,
              link:  item.link,
              date:  item.pubDate,
              source:feed.label,
              tag:   feed.tag,
              desc:  item.description?.replace(/<[^>]*>/g,'').slice(0,200)||'',
            })))
        )
      );
      const all = results
        .filter(r=>r.status==='fulfilled')
        .flatMap(r=>r.value)
        .sort((a,b)=>new Date(b.date)-new Date(a.date))
        .slice(0,40);
      setArticles(all);
      lsSet(LS_NEWS_CACHE, all);
      lsSet(LS_NEWS_CACHE+'_ts', Date.now());
    } catch(e) {
      setFetchErr('Feed fetch failed — check network');
    }
    setLoading(false);
  }

  async function summarise(article) {
    setSummarising(s=>({...s,[article.id]:true}));
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          max_tokens: 160,
          messages: [
            {role:'system', content:'You are a concise financial analyst. Given a news headline and snippet, write a 2-sentence summary covering: (1) what happened, (2) market/investment implication. Be direct, no filler. Output plain text only.'},
            {role:'user',   content:`Headline: ${article.title}\n\nSnippet: ${article.desc}`}
          ]
        })
      });
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content || '(No response)';
      setSummaries(s=>({...s,[article.id]:text}));
    } catch(e) {
      setSummaries(s=>({...s,[article.id]:`Error: ${e.message}`}));
    }
    setSummarising(s=>({...s,[article.id]:false}));
  }

  const filtered = activeFeed==='ALL' ? articles : articles.filter(a=>a.tag===activeFeed);
  const tagColors = { BIZ:C.terra, MKT:C.ochre, WIRE:C.olive, WORLD:C.charcoal };

  return (
    <div className="tab-view" style={{minHeight:'100vh',paddingBottom:60,position:'relative'}}>
      {/* Background deco */}
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
        <div style={{position:'absolute',top:0,left:0,right:0,opacity:0.07}}>
          <TopologicalMap width={1200} height={160} color={C.olive} offsetX={0.8}/>
        </div>
        <div style={{position:'absolute',bottom:40,right:40,opacity:0.08}} className="hide-mobile">
          <RadarAccent size={180} color={C.olive}/>
        </div>
        <div style={{position:'absolute',top:20,right:24}}><Crosshair size={44} color={C.olive} opacity={0.11}/></div>
      </div>

      <div style={{position:'relative',zIndex:10,padding:'44px 44px 0'}} className="hero-pad">
        {/* Header */}
        <span className="tag" style={{color:C.olive,borderColor:C.olive,opacity:0.7,marginBottom:8,display:'inline-block'}}>Reuters Wire · Signal Feed</span>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
          <h1 className="font-serif hero-text" style={{fontSize:64,lineHeight:1,fontWeight:300,letterSpacing:'-0.02em',marginBottom:8}}>
            Signal<br/><em style={{color:C.terra}}>Feed</em>
          </h1>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:8,marginTop:8}}>
            <button onClick={fetchNews} disabled={loading}
              style={{fontFamily:'IBM Plex Mono',fontSize:9,padding:'7px 16px',
                border:`1px solid ${loading?'rgba(44,44,44,0.2)':C.terra}`,borderRadius:6,
                background:loading?'transparent':`${C.terra}18`,
                color:loading?'rgba(44,44,44,0.3)':C.terra,cursor:loading?'not-allowed':'pointer',
                letterSpacing:'0.08em',textTransform:'uppercase',transition:'all 0.15s'}}>
              {loading ? '↻ Fetching…' : '↻ Refresh'}
            </button>
            <p className="font-mono" style={{fontSize:7.5,opacity:0.3,textAlign:'right'}}>
              {articles.length ? `${articles.length} articles · ${timeAgo(lsGet(LS_NEWS_CACHE+'_ts',Date.now()))}` : 'No data'}
            </p>
          </div>
        </div>
        <p className="font-mono" style={{fontSize:9,opacity:0.35,marginBottom:24,letterSpacing:'0.1em'}}>
          REUTERS RSS · GROQ SENTIMENT · LIVE WIRE
        </p>

        {/* Feed filter tabs */}
        <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
          {['ALL',...RSS_FEEDS.map(f=>f.tag)].map(tag=>(
            <button key={tag} type="button" onClick={()=>setActiveFeed(tag)}
              style={{fontFamily:'IBM Plex Mono',fontSize:9,padding:'5px 14px',borderRadius:20,
                border:`1px solid ${activeFeed===tag?(tagColors[tag]||C.charcoal):'rgba(44,44,44,0.2)'}`,
                background:activeFeed===tag?`${tagColors[tag]||C.charcoal}18`:'transparent',
                color:activeFeed===tag?(tagColors[tag]||C.charcoal):'rgba(44,44,44,0.5)',
                cursor:'pointer',letterSpacing:'0.06em',transition:'all 0.12s'}}>
              {tag}
            </button>
          ))}
        </div>

        {/* Error banner */}
        {fetchErr && <div className="error-banner" style={{marginBottom:16}}>{fetchErr}</div>}

        {/* Loading skeleton */}
        {loading && (
          <div style={{display:'grid',gap:10,marginBottom:20}}>
            {[1,2,3,4].map(i=>(
              <div key={i} className="glass" style={{borderRadius:10,padding:'16px 20px',opacity:0.5+i*0.1}}>
                <div style={{height:8,background:'rgba(44,44,44,0.08)',borderRadius:4,width:'60%',marginBottom:8}}/>
                <div style={{height:6,background:'rgba(44,44,44,0.06)',borderRadius:4,width:'85%',marginBottom:6}}/>
                <div style={{height:6,background:'rgba(44,44,44,0.06)',borderRadius:4,width:'40%'}}/>
              </div>
            ))}
          </div>
        )}

        {/* Empty state */}
        {!loading && !filtered.length && !fetchErr && (
          <div className="glass" style={{borderRadius:12,padding:'32px 24px',textAlign:'center',marginBottom:20}}>
            <p className="font-mono" style={{fontSize:11,opacity:0.4}}>No articles yet — hit Refresh to pull the live wire.</p>
          </div>
        )}

        {/* Article list */}
        {!loading && filtered.length > 0 && (
          <div style={{display:'grid',gap:10,maxWidth:860,marginBottom:32}}>
            {filtered.map(article=>{
              const expanded = expandedId===article.id;
              const tc = tagColors[article.tag]||C.charcoal;
              return (
                <div key={article.id} className="glass"
                  style={{borderRadius:10,padding:'16px 20px',borderLeft:`2px solid ${tc}`,
                    cursor:'pointer',transition:'box-shadow 0.15s',
                    boxShadow: expanded?'0 4px 24px rgba(44,44,44,0.1)':'none'}}
                  onClick={()=>setExpandedId(expanded?null:article.id)}>

                  {/* Top row */}
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,marginBottom:6}}>
                    <p className="font-serif" style={{fontSize:15,fontWeight:400,lineHeight:1.4,flex:1}}>{article.title}</p>
                    <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4,flexShrink:0}}>
                      <span className="tag" style={{fontSize:7,color:tc,borderColor:tc}}>{article.tag}</span>
                      <span className="font-mono" style={{fontSize:8,opacity:0.35,whiteSpace:'nowrap'}}>{timeAgo(article.date)}</span>
                    </div>
                  </div>

                  {/* Snippet */}
                  <p className="font-mono" style={{fontSize:9,opacity:0.45,lineHeight:1.6,marginBottom:8}}>
                    {article.desc}
                  </p>

                  {/* Expanded: Groq summary + link */}
                  {expanded && (
                    <div style={{borderTop:'1px dashed rgba(44,44,44,0.12)',paddingTop:12,marginTop:4}}>
                      {summaries[article.id] ? (
                        <div style={{marginBottom:10}}>
                          <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:6}}>
                            ◈ Groq Analysis
                          </p>
                          <p className="font-mono" style={{fontSize:10,lineHeight:1.7,opacity:0.78,color:C.charcoal}}>
                            {summaries[article.id]}
                          </p>
                        </div>
                      ) : (
                        <button
                          onClick={e=>{e.stopPropagation();summarise(article);}}
                          disabled={summarising[article.id]}
                          style={{fontFamily:'IBM Plex Mono',fontSize:9,padding:'5px 14px',
                            border:`1px solid ${C.olive}`,borderRadius:6,
                            background:summarising[article.id]?`${C.olive}10`:`${C.olive}18`,
                            color:summarising[article.id]?'rgba(44,44,44,0.35)':C.olive,
                            cursor:summarising[article.id]?'not-allowed':'pointer',
                            letterSpacing:'0.06em',marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
                          {summarising[article.id] ? (
                            <>{[0,1,2].map(i=><span key={i} className="thinking-dot" style={{width:4,height:4,borderRadius:'50%',background:C.olive,display:'inline-block'}}/>)}</>
                          ) : '◈ Analyse with Groq'}
                        </button>
                      )}
                      <a href={article.link} target="_blank" rel="noopener noreferrer"
                        onClick={e=>e.stopPropagation()}
                        style={{fontFamily:'IBM Plex Mono',fontSize:8,color:C.terra,letterSpacing:'0.06em',
                          textDecoration:'none',opacity:0.7,display:'inline-flex',alignItems:'center',gap:4}}>
                        Read on Reuters →
                      </a>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* Footer note */}
        <p className="font-mono" style={{fontSize:8,opacity:0.25,marginBottom:60,letterSpacing:'0.06em'}}>
          Source: FT · WSJ · Yahoo Finance · CNBC via rss2json.com · Analysis: Groq llama-3.3-70b · Data delayed ~15 min
        </p>
      </div>
    </div>
  );
}

const SCENES = ["forest","ocean","mountain","rain","field"];
const SCENE_LABELS = { forest:"🌲 Forest", ocean:"🌊 Ocean", mountain:"🏔 Mountain", rain:"🌧 Rain", field:"🌾 Field" };
const PHASE_LABELS = ["Dawn","Midday","Dusk"];
const PHASE_MINUTES = [0, 20, 50];
const SAMPLE_TASKS = [
  "Finish ORMS Problem Set","Review IB Math AA HL notes",
  "Read Murakami — 30 pages","TOEFL vocab review","FinOS Blueprint iteration",
];

function pickRandom(last) {
  const pool = SCENES.filter(s => s !== last);
  return pool[Math.floor(Math.random() * pool.length)];
}
function fmt(sec) {
  return {
    h: String(Math.floor(sec/3600)).padStart(2,"0"),
    m: String(Math.floor((sec%3600)/60)).padStart(2,"0"),
    s: String(sec%60).padStart(2,"0"),
  };
}
function kst() {
  return new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"});
}
function getPhase(sec) {
  const min = sec/60;
  return min >= PHASE_MINUTES[2] ? 2 : min >= PHASE_MINUTES[1] ? 1 : 0;
}
function focusScore(sec, dist) {
  if (!sec) return 100;
  return Math.max(0, Math.round((1 - (dist*120)/(sec+dist*120))*100));
}

// ─────────────────────────────────────────────────────────────────────────────
// OCEAN SCENE
// ─────────────────────────────────────────────────────────────────────────────
function OceanScene({ phase }) {
  const tickRef = useRef(0);
  const canvasRef = useRef(null);
  const rafRef = useRef(null);

  const palettes = [
    { sky0:"#7ab8d8", sky1:"#c8d8b0", water0:"rgba(70,130,170,0.95)", water1:"rgba(40,90,130,1)", foam:"rgba(230,245,255,0.7)", sunC:"#ffe4a0", sunG:"rgba(255,230,160,0.4)" },
    { sky0:"#3a8fcf", sky1:"#7ecff4", water0:"rgba(20,100,160,0.95)", water1:"rgba(10,60,110,1)", foam:"rgba(200,235,255,0.8)", sunC:"#fffde0", sunG:"rgba(255,255,200,0.35)" },
    { sky0:"#d46030", sky1:"#e89060", water0:"rgba(120,60,40,0.95)", water1:"rgba(70,30,20,1)",   foam:"rgba(255,200,160,0.6)", sunC:"#ff9a30", sunG:"rgba(255,120,30,0.5)" },
  ];
  const p = palettes[phase];

  const sunX = phase===0?150 : phase===1?400 : 650;
  const sunY = phase===0?100 : phase===1?55  : 110;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    function draw() {
      const W = canvas.width, H = canvas.height;
      tickRef.current += 0.012;
      const t = tickRef.current;
      ctx.clearRect(0, 0, W, H);

      const horizon = H * 0.48;

      // sky gradient
      const skyGrad = ctx.createLinearGradient(0,0,0,horizon);
      skyGrad.addColorStop(0, p.sky0);
      skyGrad.addColorStop(1, p.sky1);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, horizon);

      // sun glow
      const gx = (sunX/800)*W, gy = (sunY/500)*H;
      const grd = ctx.createRadialGradient(gx,gy,0,gx,gy,120);
      grd.addColorStop(0, p.sunG);
      grd.addColorStop(1, "transparent");
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.ellipse(gx,gy,120,120,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(gx,gy,phase===1?22:18,0,Math.PI*2);
      ctx.fillStyle = p.sunC; ctx.fill();

      // horizon shimmer
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.fillRect(0, horizon-2, W, 4);
      ctx.restore();

      // water base
      const waterGrad = ctx.createLinearGradient(0,horizon,0,H);
      waterGrad.addColorStop(0, p.water0);
      waterGrad.addColorStop(1, p.water1);
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, horizon, W, H-horizon);

      // 5 wave layers
      const waves = [
        { amp:18, period:0.008, speed:0.9, y:0.52, foam:true,  thick:3  },
        { amp:12, period:0.010, speed:1.3, y:0.60, foam:true,  thick:2.5},
        { amp:10, period:0.013, speed:1.7, y:0.68, foam:false, thick:2  },
        { amp:8,  period:0.016, speed:2.1, y:0.76, foam:false, thick:1.5},
        { amp:6,  period:0.020, speed:2.6, y:0.84, foam:false, thick:1  },
      ];

      waves.forEach(w => {
        const wY = H * w.y;
        ctx.beginPath();
        ctx.moveTo(0, wY);
        for (let x=0; x<=W; x+=3) {
          const y = wY + Math.sin(x*w.period + t*w.speed)*w.amp
                       + Math.sin(x*w.period*1.6 + t*w.speed*0.7)*w.amp*0.4;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();

        const wg = ctx.createLinearGradient(0,wY-w.amp,0,wY+w.amp+20);
        wg.addColorStop(0, w.foam ? p.foam : "transparent");
        wg.addColorStop(1, "transparent");
        ctx.fillStyle = wg;
        ctx.fill();

        if (w.foam) {
          ctx.beginPath();
          ctx.moveTo(0, wY);
          for (let x=0; x<=W; x+=3) {
            const y = wY + Math.sin(x*w.period + t*w.speed)*w.amp
                         + Math.sin(x*w.period*1.6 + t*w.speed*0.7)*w.amp*0.4;
            ctx.lineTo(x, y);
          }
          ctx.strokeStyle = p.foam;
          ctx.lineWidth = w.thick;
          ctx.stroke();
        }
      });

      // sun reflection on water
      const reflGrad = ctx.createLinearGradient(gx-40, horizon, gx+40, H);
      reflGrad.addColorStop(0,"transparent");
      reflGrad.addColorStop(0.3, p.sunG);
      reflGrad.addColorStop(1,"transparent");
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = reflGrad;
      ctx.fillRect(gx-50, horizon, 100, H-horizon);
      ctx.globalAlpha = 1;

      // seagulls at midday
      if (phase === 1) {
        [[120,H*0.3],[250,H*0.25],[380,H*0.28],[510,H*0.24]].forEach(([bx,by],i) => {
          const flap = Math.sin(t*3 + i)*6;
          ctx.beginPath();
          ctx.moveTo(bx-12, by+flap); ctx.quadraticCurveTo(bx, by-4, bx+12, by+flap);
          ctx.strokeStyle = "rgba(255,255,255,0.55)";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });
      }

      rafRef.current = requestAnimationFrame(draw);
    }
    draw();
    return () => { cancelAnimationFrame(rafRef.current); window.removeEventListener("resize",resize); };
  }, [phase]);

  return (
    <div style={{ position:"absolute", inset:0 }}>
      <canvas ref={canvasRef} style={{ width:"100%", height:"100%", display:"block" }}/>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// RAIN SCENE
// ─────────────────────────────────────────────────────────────────────────────
function RainScene({ phase }) {
  const canvasRef = useRef(null);
  const dropsRef  = useRef([]);
  const splashRef = useRef([]);
  const rafRef    = useRef(null);

  const bgs = ["#3a4a5a","#2d3d4d","#1c2030"];
  const bokehColors = [
    ["rgba(255,200,100,0.35)","rgba(100,180,255,0.3)","rgba(255,140,80,0.3)"],
    ["rgba(255,220,120,0.4)" ,"rgba(80,160,255,0.35)","rgba(255,160,80,0.3)"],
    ["rgba(200,160,80,0.35)" ,"rgba(60,120,200,0.3)" ,"rgba(180,100,50,0.25)"],
  ];

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      // init drops
      dropsRef.current = Array.from({length:120}, ()=>({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        len: 10+Math.random()*25,
        speed: 5+Math.random()*10,
        opacity: 0.15+Math.random()*0.45,
        thickness: 0.5+Math.random()*1,
      }));
    }
    resize();
    window.addEventListener("resize", resize);

    // bokeh lights — static positions
    const bokeh = bokehColors[phase].map((c,i)=>({
      x: [0.2,0.6,0.8][i], y: [0.3,0.5,0.2][i],
      r: 80+i*30, color: c,
    }));

    function draw() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0,0,W,H);

      // background
      ctx.fillStyle = bgs[phase];
      ctx.fillRect(0,0,W,H);

      // bokeh blobs
      bokeh.forEach(b => {
        const grd = ctx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,b.r);
        grd.addColorStop(0, b.color);
        grd.addColorStop(1,"transparent");
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(b.x*W, b.y*H, b.r, 0, Math.PI*2); ctx.fill();
      });

      // glass-blur overlay
      ctx.fillStyle = "rgba(30,40,60,0.28)";
      ctx.fillRect(0,0,W,H);

      // rain drops
      dropsRef.current.forEach(d => {
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + d.len*0.18, d.y + d.len);
        ctx.strokeStyle = `rgba(180,215,245,${d.opacity})`;
        ctx.lineWidth = d.thickness;
        ctx.stroke();
        d.y += d.speed;
        d.x += d.speed * 0.1;
        if (d.y > H + d.len) {
          d.y = -d.len;
          d.x = Math.random()*W;
          // spawn splash
          splashRef.current.push({ x:d.x, y:H-2, r:0, maxR:4+Math.random()*5, life:1 });
        }
      });

      // splashes
      splashRef.current = splashRef.current.filter(s => s.life > 0);
      splashRef.current.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(200,230,255,${s.life*0.5})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
        s.r += 0.5; s.life -= 0.07;
      });

      // slow glass-streak drops
      ctx.save();
      [0.15,0.35,0.55,0.7,0.85].forEach((xFrac,i) => {
        const cx = W*xFrac, startY = 0;
        const curveX = cx + Math.sin(Date.now()*0.0002 + i)*12;
        ctx.beginPath();
        ctx.moveTo(cx, startY);
        ctx.bezierCurveTo(cx+5, H*0.25, curveX-5, H*0.6, curveX, H*0.9);
        ctx.strokeStyle = `rgba(200,230,255,${0.08+i*0.02})`;
        ctx.lineWidth = 1.2+i*0.3;
        ctx.stroke();
      });
      ctx.restore();

      rafRef.current = requestAnimationFrame(draw);
    }
    draw();
    return () => { cancelAnimationFrame(rafRef.current); window.removeEventListener("resize",resize); };
  }, [phase]);

  return <div style={{position:"absolute",inset:0}}><canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block"}}/></div>;
}

// ─────────────────────────────────────────────────────────────────────────────
// FIELD SCENE
// ─────────────────────────────────────────────────────────────────────────────
function FieldScene({ phase }) {
  const W = 800, H = 500;

  const palettes = [
    { sky0:"#c0d4e8", sky1:"#e8d8b8", grass0:"#8aaa58", grass1:"#6a8a38", stem:"#7a9a48", flower:"#f8e86a", sunC:"#ffe8a0", sunG:"rgba(255,230,160,0.4)" },
    { sky0:"#70bce0", sky1:"#e8f0b0", grass0:"#a8c858", grass1:"#88a838", stem:"#98b848", flower:"#f8d840", sunC:"#fffde0", sunG:"rgba(255,250,200,0.35)" },
    { sky0:"#e07030", sky1:"#f0a860", grass0:"#c8a050", grass1:"#a87830", stem:"#b89040", flower:"#f8a020", sunC:"#ff9820", sunG:"rgba(255,140,20,0.5)" },
  ];
  const p = palettes[phase];

  const sunX = phase===0?120 : phase===1?400 : 680;
  const sunY = phase===0?110 : phase===1?55  : 120;
  const sunR  = phase===1?30  : 24;

  // grass blades — varied heights/positions
  const blades = Array.from({length:60},(_,i)=>({
    x: (i/60)*W + (Math.sin(i*7.3)*12),
    h: 55+Math.sin(i*3.7)*35,
    w: 2.5+Math.sin(i*5.1)*1.2,
    delay: (i*0.12)%3,
    speed: 3+Math.sin(i*2.3)*1.5,
  }));

  // pollen particles
  const pollen = Array.from({length:25},(_,i)=>({
    x: (i*33+20)%780,
    y: 280+Math.sin(i*4.1)*50,
    r: 1.5+Math.sin(i*2.7)*0.8,
    delay: i*0.35,
  }));

  return (
    <div style={{position:"absolute",inset:0,overflow:"hidden"}}>
      <style>{`
        @keyframes bladeSway {
          0%,100%{transform:rotate(-4deg) skewX(-2deg)}
          50%{transform:rotate(4deg) skewX(2deg)}
        }
        @keyframes pollenFloat {
          0%{transform:translate(0,0); opacity:0}
          20%{opacity:0.8}
          80%{opacity:0.6}
          100%{transform:translate(${phase===2?-20:20}px,-80px); opacity:0}
        }
        @keyframes sunPulse {
          0%,100%{filter:drop-shadow(0 0 20px rgba(255,220,100,0.5))}
          50%{filter:drop-shadow(0 0 40px rgba(255,220,100,0.8))}
        }
      `}</style>

      <svg width="100%" height="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="fsky2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={p.sky0} style={{transition:"stop-color 6s"}}/>
            <stop offset="100%" stopColor={p.sky1} style={{transition:"stop-color 6s"}}/>
          </linearGradient>
          <linearGradient id="fgrass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={p.grass0} style={{transition:"stop-color 6s"}}/>
            <stop offset="100%" stopColor={p.grass1} style={{transition:"stop-color 6s"}}/>
          </linearGradient>
          <filter id="fglow"><feGaussianBlur stdDeviation="14"/></filter>
          <filter id="fglow5"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>

        {/* sky */}
        <rect width={W} height={H} fill="url(#fsky2)"/>

        {/* sun */}
        <circle cx={sunX} cy={sunY} r={100} fill={p.sunG} filter="url(#fglow)" style={{transition:"cx 6s,cy 6s"}}/>
        <circle cx={sunX} cy={sunY} r={sunR} fill={p.sunC} filter="url(#fglow5)"
          style={{transition:"cx 6s,cy 6s,fill 6s,r 6s", animation:"sunPulse 4s ease-in-out infinite"}}/>

        {/* horizon haze */}
        <rect x={0} y={320} width={W} height={30} fill={`rgba(${phase===2?"210,150,60":"200,220,160"},0.35)`}
          filter="url(#fglow5)" style={{transition:"fill 6s"}}/>

        {/* ground base */}
        <rect x={0} y={340} width={W} height={H-340} fill="url(#fgrass)"/>

        {/* grass blades — back half */}
        {blades.slice(0,30).map((b,i)=>(
          <g key={i} style={{
            transformOrigin:`${b.x}px ${360}px`,
            animation:`bladeSway ${b.speed}s ease-in-out infinite`,
            animationDelay:`${b.delay}s`,
          }}>
            <path
              d={`M${b.x},360 C${b.x-b.w},${360-b.h*0.5} ${b.x+b.w},${360-b.h*0.7} ${b.x},${360-b.h}`}
              stroke={p.stem} strokeWidth={b.w} fill="none" opacity={0.75}
              style={{transition:"stroke 6s"}}
            />
          </g>
        ))}

        {/* wildflowers */}
        {[80,170,260,350,445,530,620,710].map((fx,i)=>{
          const fy = 335+(i%3)*8;
          const fc = i%4===0?p.flower : i%4===1?"#ff9898" : i%4===2?"#ffffff" : "#ff88cc";
          return (
            <g key={i}>
              <line x1={fx} y1={fy} x2={fx} y2={fy+25} stroke={p.stem} strokeWidth="1.5" style={{transition:"stroke 6s"}}/>
              <circle cx={fx} cy={fy} r={5} fill={fc} style={{transition:"fill 6s"}}/>
              <circle cx={fx} cy={fy} r={2.5} fill="rgba(255,255,255,0.7)"/>
            </g>
          );
        })}

        {/* grass blades — front */}
        {blades.slice(30).map((b,i)=>{
          const bx = b.x, by = 400;
          return (
            <g key={i} style={{
              transformOrigin:`${bx}px ${by}px`,
              animation:`bladeSway ${b.speed*0.9}s ease-in-out infinite`,
              animationDelay:`${b.delay+0.2}s`,
            }}>
              <path
                d={`M${bx},${by} C${bx-b.w*1.2},${by-b.h*0.45} ${bx+b.w*1.2},${by-b.h*0.65} ${bx},${by-b.h*0.9}`}
                stroke={p.grass1} strokeWidth={b.w+1} fill="none" opacity={0.9}
                style={{transition:"stroke 6s"}}
              />
            </g>
          );
        })}

        {/* pollen / seeds floating up */}
        {pollen.map((pol,i)=>(
          <circle key={i} cx={pol.x} cy={pol.y} r={pol.r} fill="rgba(255,240,180,0.85)"
            style={{animation:`pollenFloat ${5+i*0.2}s ease-in-out infinite`, animationDelay:`${pol.delay}s`}}/>
        ))}
      </svg>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// BRACKET CORNER
// ─────────────────────────────────────────────────────────────────────────────
function Bracket({ pos, color="#1B6FE8", size=16, pulse=false }) {
  const s = {
    position:"absolute", width:size, height:size,
    ...(pulse ? { animation:"bPulse 2.5s ease-in-out infinite" } : {}),
  };
  const b = {
    tl:{ top:0,left:0,  borderTop:`2px solid ${color}`,borderLeft:`2px solid ${color}`  },
    tr:{ top:0,right:0, borderTop:`2px solid ${color}`,borderRight:`2px solid ${color}`, animationDelay:"0.6s" },
    bl:{ bottom:0,left:0,  borderBottom:`2px solid ${color}`,borderLeft:`2px solid ${color}`, animationDelay:"1.2s" },
    br:{ bottom:0,right:0, borderBottom:`2px solid ${color}`,borderRight:`2px solid ${color}`, animationDelay:"1.8s" },
  };
  return <div style={{...s,...b[pos]}}/>;
}

function Glitch({ on }) {
  if (!on) return null;
  return (

      <div style={{position:"absolute",inset:0,background:"rgba(255,255,255,0.07)",

    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// FOCUS SCREEN
// ─────────────────────────────────────────────────────────────────────────────
function FocusScreen({ task, scene, onEnd }) {
  const [elapsed,setElapsed]         = useState(0);
  const [phase,setPhase]             = useState(0);
  const [time,setTime]               = useState(kst());
  const [distractions,setDistr]      = useState(0);
  const [log,setLog]                 = useState([]);
  const [showInt,setShowInt]         = useState(false);
  const [showDebrief,setShowDebrief] = useState(false);
  const [glitch,setGlitch]           = useState(false);
  const fsRef  = useRef(false);
  const supRef = useRef(false);

  const accent = ["#7ab8e8","#1B6FE8","#e8960a"][phase];

  useEffect(()=>{
    const id = setInterval(()=>{
      setElapsed(e=>{ const n=e+1; setPhase(getPhase(n)); return n; });
      setTime(kst());
    },1000);
    return ()=>clearInterval(id);
  },[]);

  useEffect(()=>{
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    fsRef.current = true;
    const onFsc = ()=>{
      if (!document.fullscreenElement && fsRef.current && !supRef.current && !showDebrief) {
        setGlitch(true); setTimeout(()=>setGlitch(false),400);
        setDistr(d=>d+1); setLog(l=>[...l,kst()]);
        setShowInt(true); fsRef.current=false;
      }
    };
    document.addEventListener("fullscreenchange",onFsc);
    return ()=>{ document.removeEventListener("fullscreenchange",onFsc); };
  },[]);

  const resume = ()=>{ setShowInt(false); const el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); fsRef.current=true; };
  const abort  = ()=>{ supRef.current=true; setShowInt(false);  setShowDebrief(true); if(document.exitFullscreen&&document.fullscreenElement) document.exitFullscreen().catch(()=>{}); };
  const done   = ()=>{ supRef.current=true; setShowDebrief(true); if(document.exitFullscreen&&document.fullscreenElement) document.exitFullscreen().catch(()=>{}); };

  const {h,m,s} = fmt(elapsed);

  return (
    <div style={{position:"fixed",inset:0,overflow:"hidden",fontFamily:"'IBM Plex Mono',monospace"}}>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
      <style>{`
        @keyframes bPulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
        @keyframes timerGlow { 0%,100%{text-shadow:0 0 20px rgba(255,255,255,0.3)} 50%{text-shadow:0 0 50px rgba(255,255,255,0.65),0 0 80px rgba(255,255,255,0.15)} }
        @keyframes glitch { 0%{opacity:1;filter:saturate(0) brightness(1.5)} 100%{opacity:0;filter:none} }
      `}</style>

      {/* scene */}
      <Scene scene={scene} phase={phase}/>

      {/* readability gradients */}
      <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,rgba(0,0,0,0.38) 0%,rgba(0,0,0,0.06) 35%,rgba(0,0,0,0.06) 70%,rgba(0,0,0,0.45) 100%)",pointerEvents:"none"}}/>

      <Glitch on={glitch}/>

      {/* top bar */}
      <div style={{position:"absolute",top:0,left:0,right:0,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 24px",background:"rgba(8,14,24,0.42)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.09)",zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <span style={{fontSize:11,letterSpacing:"0.18em",fontWeight:600,color:accent,transition:"color 4s"}}>◈ FINOS</span>
          <span style={{fontSize:10,opacity:0.3,color:"#fff"}}>FOCUS MODE</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:20,fontSize:11,color:"#fff"}}>
          <span style={{opacity:0.6}}>{time} KST</span>
          <span style={{opacity:0.28,letterSpacing:"0.1em"}}>SESSION</span>
          <span style={{color:distractions>0?"#e85d04":"rgba(255,255,255,0.38)",letterSpacing:"0.08em"}}>
            {distractions>0?`⚠ ${distractions} distraction${distractions!==1?"s":""}` : "● FOCUSED"}
          </span>
        </div>
      </div>

      {/* HUD card */}
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",zIndex:10}}>
        <div style={{position:"relative",padding:"2rem 2.25rem",borderRadius:2,minWidth:320,maxWidth:410,background:"rgba(6,12,22,0.55)",backdropFilter:"blur(28px)",border:"1px solid rgba(255,255,255,0.13)",boxShadow:`0 0 90px rgba(0,0,0,0.55), 0 0 45px ${accent}1a`}}>
          {["tl","tr","bl","br"].map(p=><Bracket key={p} pos={p} color={accent} size={16} pulse/>)}

          <div style={{fontSize:9,letterSpacing:"0.22em",color:accent,marginBottom:10,opacity:0.8,transition:"color 4s"}}>⌗ ACTIVE SORTIE</div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.88)",marginBottom:22,lineHeight:1.55,maxWidth:290}}>{task||"Free Focus"}</div>

          {/* big timer */}
          <div style={{textAlign:"center",marginBottom:6}}>
            <div style={{fontSize:56,fontWeight:300,letterSpacing:"0.06em",color:"#fff",lineHeight:1,animation:"timerGlow 3.5s ease-in-out infinite"}}>
              {h}<span style={{opacity:0.28,fontSize:38,margin:"0 1px"}}>:</span>
              {m}<span style={{opacity:0.28,fontSize:38,margin:"0 1px"}}>:</span>
              {s}
            </div>
            <div style={{fontSize:9,letterSpacing:"0.2em",color:"rgba(255,255,255,0.28)",marginTop:7}}>ELAPSED</div>
          </div>

          {/* phase indicator */}
          <div style={{display:"flex",justifyContent:"center",gap:6,marginTop:10,marginBottom:4}}>
            {PHASE_LABELS.map((l,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:4,fontSize:9,letterSpacing:"0.1em",opacity:i===phase?1:0.25,transition:"opacity 4s",color:i===phase?accent:"rgba(255,255,255,0.6)"}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:i===phase?accent:"rgba(255,255,255,0.3)",transition:"background 4s"}}/>
                {l}
              </div>
            ))}
          </div>

          <div style={{borderTop:"1px solid rgba(255,255,255,0.07)",margin:"18px 0"}}/>

          <div style={{display:"flex",gap:10}}>
            <button onClick={done} style={{flex:1,padding:"9px",fontSize:10,letterSpacing:"0.14em",background:`${accent}18`,border:`1px solid ${accent}88`,color:accent,cursor:"pointer",borderRadius:2,fontFamily:"'IBM Plex Mono',monospace",transition:"all 0.2s"}}>
              ✓ COMPLETE
            </button>
            <button onClick={abort} style={{padding:"9px 16px",fontSize:10,letterSpacing:"0.14em",background:"rgba(232,93,4,0.1)",border:"1px solid rgba(232,93,4,0.4)",color:"rgba(232,93,4,0.85)",cursor:"pointer",borderRadius:2,fontFamily:"'IBM Plex Mono',monospace"}}>
              ✗
            </button>
          </div>
        </div>
      </div>

      {/* bottom bar */}
      <div style={{position:"absolute",bottom:0,left:0,right:0,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 24px",background:"rgba(8,14,24,0.38)",backdropFilter:"blur(14px)",borderTop:"1px solid rgba(255,255,255,0.07)",zIndex:10}}>
        <div style={{fontSize:10,color:"rgba(255,255,255,0.38)"}}>{SCENE_LABELS[scene]} — {PHASE_LABELS[phase]}</div>
        <div style={{fontSize:9,color:"rgba(255,255,255,0.18)",letterSpacing:"0.15em"}}>FINOS BLUEPRINT OS</div>
      </div>

      {showInt && <Interrupt onResume={resume} onAbort={abort}/>}
      {showDebrief && <Debrief elapsed={elapsed} distractions={distractions} log={log} task={task} onClose={()=>{ setShowDebrief(false); onEnd(); }}/>}
    </div>
  );
}

/* FocusView — thin wrapper that owns entry↔focus state machine */
function FocusView({ onEnd }) {
  const [screen, setScreen] = useState('entry');
  const [task,   setTask]   = useState('');
  const [scene,  setScene]  = useState(null);

  function start(t, chosenScene) {
    let s;
    if (chosenScene === 'random' || !chosenScene) {
      const last = localStorage.getItem('finos-last-scene');
      s = pickRandom(last);
    } else {
      s = chosenScene;
    }
    localStorage.setItem('finos-last-scene', s);
    setTask(t); setScene(s); setScreen('focus');
  }

  if (screen === 'focus' && scene)
    return <FocusScreen task={task} scene={scene} onEnd={onEnd}/>;
  return <Entry onStart={start}/>;
}


/* ══════════════════════════════════════════════════════════
   SIDEBAR NAV
══════════════════════════════════════════════════════════ */
const NAV=[
  {id:'briefing',label:'Briefing', icon:'radio'},
  {id:'mission', label:'Mission',  icon:'crosshair'},
  {id:'research',label:'Research', icon:'activity'},
  {id:'council', label:'Council',  icon:'users'},
  {id:'signal',  label:'Signal',   icon:'rss'},
  {id:'focus',   label:'Focus',    icon:'target'},
];

/* ══════════════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════════════ */
function App(){
  const [active,   setActive]   = useState('briefing');
  const [tasks,    setTasks]    = useState(()=>lsGet(LS_TASKS, DEFAULT_TASKS));
  const [expenses, setExpenses] = useState(()=>lsGet(LS_EXPENSES, DEFAULT_EXPENSES));
  const [toast,    setToast]    = useState(null);

  useEffect(()=>{ lsSet(LS_TASKS,tasks); },    [tasks]);
  useEffect(()=>{ lsSet(LS_EXPENSES,expenses); },[expenses]);

  function showToast(msg){ setToast(msg); }

  function toggleTask(id, completedDate){
    setTasks(t=>t.map(x=>x.id===id?{...x,done:!x.done,completedDate:!x.done?completedDate:null}:x));
  }
  function addTask(t){
    setTasks(prev=>[...prev,t]);
    showToast(`Added: ${t.label}`);
  }
  function deleteTask(id){
    setTasks(prev=>prev.filter(t=>t.id!==id));
    showToast('Task removed');
  }
  function addExpense(e){
    setExpenses(prev=>[...prev,e]);
    showToast(`Logged: ${e.label} ₩${e.amt.toLocaleString()} → Card ${e.card}`);
  }
  function deleteExpense(id){
    setExpenses(prev=>prev.filter(e=>e.id!==id));
    showToast('Entry removed');
  }
  function editExpense(id, updates){
    setExpenses(prev=>prev.map(e=>e.id===id?{...e,...updates}:e));
    showToast('Entry updated');
  }

  const views={
    briefing:<BriefingView expenses={expenses} onAddExpense={addExpense} onDeleteExpense={deleteExpense} onEditExpense={editExpense}/>,
    mission: <MissionView tasks={tasks} onToggleTask={toggleTask} onAddTask={addTask} onDeleteTask={deleteTask}/>,
    research:<ResearchView/>,
    council: <CouncilView/>,
    signal:  <NewsView/>,
  };

  // Sidebar badge counts
  const todayStr2 = new Date().toDateString();
  const urgentCount = tasks.filter(t=>t.priority==='HIGH'&&!t.done).length;
  const cardBSpent = expenses.filter(e=>e.card==='B').reduce((a,b)=>a+b.amt,0);
  const cardBPct = cardBSpent/300000;
  const cardBWarn = cardBPct >= 0.8;

  return (
    <>
      {active==='focus' ? (
        <FocusView onEnd={()=>setActive('mission')}/>
      ) : (
        <>
          <nav className="sidebar">
        {/* Logo */}
        <div style={{marginBottom:18}}>
          <svg width="26" height="26" viewBox="0 0 26 26">
            <rect x="2" y="2" width="22" height="22" stroke={C.charcoal} strokeWidth="1.1" fill="none" rx="4"/>
            <line x1="2" y1="9.5" x2="24" y2="9.5" stroke={C.terra} strokeWidth="0.8"/>
            <line x1="9.5" y1="2" x2="9.5" y2="24" stroke={C.terra} strokeWidth="0.8"/>
            <circle cx="9.5" cy="9.5" r="2.2" fill={C.terra}/>
          </svg>
        </div>
        <div style={{height:1,width:32,background:'rgba(44,44,44,0.1)',marginBottom:10}}/>
        {[
          {id:'briefing', label:'Briefing', icon:'radio',    badge: cardBWarn ? '!' : null, badgeColor: C.ochre},
          {id:'mission',  label:'Mission',  icon:'crosshair',badge: urgentCount>0 ? String(urgentCount) : null, badgeColor: C.terra},
          {id:'research', label:'Research', icon:'activity', badge: null},
          {id:'council',  label:'Council',  icon:'users',    badge: null},
          {id:'signal',   label:'Signal',   icon:'rss',      badge: null},
          {id:'focus',    label:'Focus',    icon:'target',   badge: null},
        ].map(n=>(
          <button key={n.id} className={`nav-btn${active===n.id?' active':''}`} onClick={()=>setActive(n.id)}
            style={{position:'relative'}}>
            <Icon name={n.icon} size={16}/>
            <span className="nav-tooltip">{n.label}</span>
            {n.badge&&(
              <span style={{
                position:'absolute',top:2,right:2,
                minWidth:13,height:13,borderRadius:7,
                background:n.badgeColor,color:'#EFEBE2',
                fontFamily:'IBM Plex Mono',fontSize:7,fontWeight:600,
                display:'flex',alignItems:'center',justifyContent:'center',
                padding:'0 3px',lineHeight:1,border:'1.5px solid #EFEBE2',
              }}>{n.badge}</span>
            )}
          </button>
        ))}
        <div style={{marginTop:'auto',display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
          <div style={{height:1,width:32,background:'rgba(44,44,44,0.1)',marginBottom:4}}/>
          <button className="nav-btn" title="Settings"><Icon name="settings" size={15}/><span className="nav-tooltip">Settings</span></button>
        </div>
      </nav>

      <main className="main-scroll">
        <div key={active}>{views[active]}</div>
      </main>

      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
        </>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
