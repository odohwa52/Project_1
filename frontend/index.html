          {AGENT_DEFS.map(a=>(
            <div key={a.id} className="glass" style={{borderRadius:12,padding:'20px 24px',borderLeft:`3px solid ${a.color}`,position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',top:10,right:10,opacity:0.28}}><RadarAccent size={42} color={a.color}/></div>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                <div style={{width:30,height:30,borderRadius:6,border:`1px solid ${a.color}`,background:`rgba(44,44,44,0.05)`,
                  display:'flex',alignItems:'center',justifyContent:'center',color:a.color,fontSize:13}}>{a.symbol}</div>
                <div>
                  <p className="font-mono" style={{fontSize:8,color:a.color,textTransform:'uppercase',letterSpacing:'0.12em'}}>Agent · {a.id}</p>
                  <p className="font-serif" style={{fontSize:15,fontWeight:400}}>{a.role}</p>
                </div>
              </div>
              <div style={{minHeight:80,background:'rgba(44,44,44,0.03)',borderRadius:6,padding:'10px 12px',
                borderTop:'1px dashed rgba(44,44,44,0.1)',borderBottom:'1px dashed rgba(44,44,44,0.1)',marginBottom:12}}>
                {running&&!reports[a.id]?(
                  <div style={{display:'flex',gap:5,alignItems:'center',height:60,justifyContent:'center'}}>
                    {[0,1,2].map(i=><div key={i} className="thinking-dot" style={{width:5,height:5,borderRadius:'50%',background:a.color}}/>)}
                    <span className="font-mono" style={{fontSize:9,opacity:0.4,marginLeft:6}}>deliberating…</span>
                  </div>
                ):(
                  <div>
                    <p className="font-mono" style={{fontSize:10,lineHeight:1.75,opacity:reports[a.id]?0.82:0.3,color:C.charcoal}}>
                      {reports[a.id]||'— Awaiting session —'}
                    </p>
                    {/* Round 2 rebuttal for BULL and BEAR */}
                    {(a.id==='BULL'&&reports.BULL2)||(a.id==='BEAR'&&reports.BEAR2)?(
                      <div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed rgba(44,44,44,0.1)'}}>
                        <p className="font-mono" style={{fontSize:7.5,color:a.color,opacity:0.6,textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:4}}>Round 2 Rebuttal</p>
                        <p className="font-mono" style={{fontSize:10,lineHeight:1.7,opacity:0.72,color:C.charcoal,fontStyle:'italic'}}>
                          {a.id==='BULL'?reports.BULL2:reports.BEAR2}
                        </p>
                      </div>
                    ):null}
                  </div>
                )}
              </div>
              <svg style={{position:'absolute',bottom:0,left:0,width:'100%',height:3}}>
                <line x1="0" y1="1.5" x2="100%" y2="1.5" stroke={a.color} strokeWidth="1" strokeDasharray="4 6" opacity="0.4"/>
              </svg>
            </div>
          ))}
        </div>

        {/* Final verdict when all agents done */}
        {reports.BULL&&reports.BEAR&&reports.RISK&&reports.PM&&!running&&(
          <div className="glass" style={{borderRadius:12,padding:'20px 24px',marginTop:20}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
              <Crosshair size={26} color={C.terra} opacity={0.55}/>
              <div>
                <p className="font-mono" style={{fontSize:8,color:C.olive,textTransform:'uppercase',letterSpacing:'0.1em'}}>Committee Summary · {new Date(reports.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</p>
                <p className="font-serif" style={{fontSize:17,fontWeight:300}}>{reports.question}</p>
              </div>
            </div>
            <p className="font-mono" style={{fontSize:10,opacity:0.5,lineHeight:1.7,fontStyle:'italic'}}>
              Bull ↔ Bear debate resolved by PM. See agent cards for individual positions.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   SIDEBAR NAV
══════════════════════════════════════════════════════════ */
const NAV=[
  {id:'briefing',label:'Briefing', icon:'radio'},
  {id:'mission', label:'Mission',  icon:'crosshair'},
  {id:'research',label:'Research', icon:'activity'},
  {id:'council', label:'Council',  icon:'users'},
];

/* ══════════════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════════════ */
function App(){
  const [active,   setActive]   = useState('briefing');
  const [tasks,    setTasks]    = useState(()=>lsGet(LS_TASKS, DEFAULT_TASKS));
  const [expenses, setExpenses] = useState(()=>lsGet(LS_EXPENSES, DEFAULT_EXPENSES));
  const [toast,    setToast]    = useState(null);

  useEffect(()=>{ lsSet(LS_TASKS,tasks); },    [tasks]);
  useEffect(()=>{ lsSet(LS_EXPENSES,expenses); },[expenses]);

  function showToast(msg){ setToast(msg); }

  function toggleTask(id, completedDate){
    setTasks(t=>t.map(x=>x.id===id?{...x,done:!x.done,completedDate:!x.done?completedDate:null}:x));
  }
  function addTask(t){
    setTasks(prev=>[...prev,t]);
    showToast(`Added: ${t.label}`);
  }
  function deleteTask(id){
    setTasks(prev=>prev.filter(t=>t.id!==id));
    showToast('Task removed');
  }
  function addExpense(e){
    setExpenses(prev=>[...prev,e]);
    showToast(`Logged: ${e.label} ₩${e.amt.toLocaleString()} → Card ${e.card}`);
  }
  function deleteExpense(id){
    setExpenses(prev=>prev.filter(e=>e.id!==id));
    showToast('Entry removed');
  }
  function editExpense(id, updates){
    setExpenses(prev=>prev.map(e=>e.id===id?{...e,...updates}:e));
    showToast('Entry updated');
  }

  const views={
    briefing:<BriefingView expenses={expenses} onAddExpense={addExpense} onDeleteExpense={deleteExpense} onEditExpense={editExpense}/>,
    mission: <MissionView tasks={tasks} onToggleTask={toggleTask} onAddTask={addTask} onDeleteTask={deleteTask}/>,
    research:<ResearchView/>,
    council: <CouncilView/>,
  };

  // Sidebar badge counts
  const todayStr2 = new Date().toDateString();
  const urgentCount = tasks.filter(t=>t.priority==='HIGH'&&!t.done).length;
  const cardBSpent = expenses.filter(e=>e.card==='B').reduce((a,b)=>a+b.amt,0);
  const cardBPct = cardBSpent/300000;
  const cardBWarn = cardBPct >= 0.8;

  return (
    <>
      <nav className="sidebar">
        {/* Logo */}
        <div style={{marginBottom:18}}>
          <svg width="26" height="26" viewBox="0 0 26 26">
            <rect x="2" y="2" width="22" height="22" stroke={C.charcoal} strokeWidth="1.1" fill="none" rx="4"/>
            <line x1="2" y1="9.5" x2="24" y2="9.5" stroke={C.terra} strokeWidth="0.8"/>
            <line x1="9.5" y1="2" x2="9.5" y2="24" stroke={C.terra} strokeWidth="0.8"/>
            <circle cx="9.5" cy="9.5" r="2.2" fill={C.terra}/>
          </svg>
        </div>
        <div style={{height:1,width:32,background:'rgba(44,44,44,0.1)',marginBottom:10}}/>
        {[
          {id:'briefing', label:'Briefing', icon:'radio',    badge: cardBWarn ? '!' : null, badgeColor: C.ochre},
          {id:'mission',  label:'Mission',  icon:'crosshair',badge: urgentCount>0 ? String(urgentCount) : null, badgeColor: C.terra},
          {id:'research', label:'Research', icon:'activity', badge: null},
          {id:'council',  label:'Council',  icon:'users',    badge: null},
        ].map(n=>(
          <button key={n.id} className={`nav-btn${active===n.id?' active':''}`} onClick={()=>setActive(n.id)}
            style={{position:'relative'}}>
            <Icon name={n.icon} size={16}/>
            <span className="nav-tooltip">{n.label}</span>
            {n.badge&&(
              <span style={{
                position:'absolute',top:2,right:2,
                minWidth:13,height:13,borderRadius:7,
                background:n.badgeColor,color:'#EFEBE2',
                fontFamily:'IBM Plex Mono',fontSize:7,fontWeight:600,
                display:'flex',alignItems:'center',justifyContent:'center',
                padding:'0 3px',lineHeight:1,border:'1.5px solid #EFEBE2',
              }}>{n.badge}</span>
            )}
          </button>
        ))}
        <div style={{marginTop:'auto',display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
          <div style={{height:1,width:32,background:'rgba(44,44,44,0.1)',marginBottom:4}}/>
          <button className="nav-btn" title="Settings"><Icon name="settings" size={15}/><span className="nav-tooltip">Settings</span></button>
        </div>
      </nav>

      <main className="main-scroll">
        <div key={active}>{views[active]}</div>
      </main>

      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// Register service worker (only on https/http, not file://)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./frontend/sw.js').catch(()=>{});
}
</script>
</body>
</html>
