<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint | FinOS</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#EFEBE2',
                        charcoal: '#2C2C2C',
                        terracotta: '#D96A53',
                        ochre: '#C49A45',
                        olive: '#6B705C'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #EFEBE2; color: #2C2C2C; overflow: hidden; }
        .glass-panel {
            background-color: rgba(239, 235, 226, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(44, 44, 44, 0.15);
        }
        .torn-edge {
            clip-path: polygon(0% 0%, 100% 0%, 98% 10%, 100% 20%, 97% 30%, 100% 40%, 98% 50%, 100% 60%, 97% 70%, 100% 80%, 98% 90%, 100% 100%, 0% 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DECORATIVE SVG COMPONENTS ---

        const NoiseFilter = () => (
            <svg className="pointer-events-none fixed inset-0 z-50 h-full w-full opacity-[0.35]" style={{ mixBlendMode: 'multiply' }}>
                <filter id="noiseFilter">
                    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
                </filter>
                <rect width="100%" height="100%" filter="url(#noiseFilter)" />
            </svg>
        );

        const DraftingGrid = () => (
            <svg className="pointer-events-none fixed inset-0 z-0 h-full w-full opacity-5" width="100%" height="100%">
                <defs>
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2C2C2C" strokeWidth="1"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)" />
            </svg>
        );

        const FlowingDataWaves = () => (
            <svg className="absolute top-0 left-0 w-full h-full pointer-events-none z-0" viewBox="0 0 1000 500" preserveAspectRatio="none">
                <defs>
                    <filter id="inkBleed" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <path d="M0,200 C300,300 500,100 1000,250" fill="none" stroke="#D96A53" strokeWidth="2" filter="url(#inkBleed)" className="opacity-60" />
                <path d="M0,220 C400,150 600,350 1000,200" fill="none" stroke="#C49A45" strokeWidth="1.5" filter="url(#inkBleed)" className="opacity-50" />
                <path d="M0,240 C200,400 700,50 1000,280" fill="none" stroke="#6B705C" strokeWidth="1" opacity="0.4" />
                {/* Data Nodes */}
                <circle cx="200" cy="235" r="3" fill="#D96A53" />
                <circle cx="600" cy="275" r="3" fill="#C49A45" />
                <circle cx="800" cy="180" r="3" fill="#6B705C" />
            </svg>
        );

        const DataHelix = () => (
            <svg className="absolute left-1/2 top-0 w-64 h-full pointer-events-none z-0 transform -translate-x-1/2 opacity-30" viewBox="0 0 200 1000" preserveAspectRatio="none">
                {[...Array(25)].map((_, i) => (
                    <g key={i}>
                        <path d={`M 50 ${i * 40} Q 100 ${i * 40 + 20} 150 ${i * 40}`} fill="none" stroke="#2C2C2C" strokeWidth="0.5" strokeDasharray="2 2" />
                        <circle cx={50 + Math.sin(i) * 30} cy={i * 40} r="2" fill="#D96A53" />
                        <circle cx={150 - Math.sin(i) * 30} cy={i * 40} r="2" fill="#6B705C" />
                    </g>
                ))}
                <path d="M 50 0 Q 20 200 80 400 T 50 800 T 100 1000" fill="none" stroke="#2C2C2C" strokeWidth="1" />
                <path d="M 150 0 Q 180 200 120 400 T 150 800 T 100 1000" fill="none" stroke="#C49A45" strokeWidth="1" />
            </svg>
        );

        const TopologicalMap = () => (
            <svg className="absolute -right-20 -bottom-20 w-96 h-96 pointer-events-none z-0 opacity-20" viewBox="0 0 200 200">
                {[...Array(15)].map((_, i) => (
                    <path key={i} d={`M 0 ${100 + i*5} C 50 ${80 - i*10}, 150 ${120 + i*10}, 200 ${100 + i*5}`} fill="none" stroke="#2C2C2C" strokeWidth="0.5" />
                ))}
            </svg>
        );

        const MeasurementTicks = () => (
            <div className="absolute left-0 top-0 h-full w-8 border-r border-charcoal/10 flex flex-col justify-between py-10 opacity-40">
                {[...Array(20)].map((_, i) => (
                    <div key={i} className="w-full flex justify-end pr-1">
                        <div className={`h-[1px] bg-charcoal ${i % 5 === 0 ? 'w-4' : 'w-2'}`}></div>
                    </div>
                ))}
            </div>
        );

        const Crosshair = () => (
            <svg className="absolute -top-2 -right-2 w-6 h-6 opacity-40" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" fill="none" stroke="#2C2C2C" strokeWidth="0.5" />
                <line x1="12" y1="0" x2="12" y2="24" stroke="#2C2C2C" strokeWidth="0.5" />
                <line x1="0" y1="12" x2="24" y2="12" stroke="#2C2C2C" strokeWidth="0.5" />
            </svg>
        );

        // --- VIEWS ---

        const BriefingView = () => (
            <div className="relative w-full h-full p-12 overflow-y-auto z-10">
                <FlowingDataWaves />
                
                <header className="mb-16 relative z-10">
                    <h1 className="font-serif text-6xl tracking-tight text-charcoal mb-4">Morning Briefing</h1>
                    <div className="flex gap-6 font-mono text-sm text-charcoal/70">
                        <span>SYS.DATE: MAY 26, 2026</span>
                        <span>LOC: INCHEON, KR</span>
                        <span>T: 16:19:02 KST</span>
                    </div>
                </header>

                <div className="grid grid-cols-12 gap-8 relative z-10">
                    {/* Weather Module */}
                    <div className="col-span-4 glass-panel p-6">
                        <h3 className="font-sans text-xs tracking-[0.2em] uppercase text-charcoal/50 mb-6 border-b border-charcoal/10 pb-2">Atmospheric Data</h3>
                        <ul className="space-y-4">
                            <li className="flex justify-between items-center font-mono">
                                <span>Incheon</span>
                                <span className="text-terracotta">18°C / Clear</span>
                            </li>
                            <li className="flex justify-between items-center font-mono">
                                <span>Songdo</span>
                                <span className="text-ochre">19°C / Haze</span>
                            </li>
                            <li className="flex justify-between items-center font-mono">
                                <span>Sinchon</span>
                                <span className="text-olive">20°C / Sunny</span>
                            </li>
                        </ul>
                    </div>

                    {/* Spending Flow */}
                    <div className="col-span-8 glass-panel p-6 relative overflow-hidden">
                        <Crosshair />
                        <h3 className="font-sans text-xs tracking-[0.2em] uppercase text-charcoal/50 mb-6 border-b border-charcoal/10 pb-2">Capital Outflow (Recent)</h3>
                        <div className="space-y-4 font-mono text-sm">
                            <div className="flex justify-between items-end border-b border-charcoal/5 pb-2">
                                <div>
                                    <div className="text-charcoal font-medium">Study Materials</div>
                                    <div className="text-charcoal/40 text-xs">TRX-992A</div>
                                </div>
                                <div className="text-terracotta">₩ 45,000</div>
                            </div>
                            <div className="flex justify-between items-end border-b border-charcoal/5 pb-2">
                                <div>
                                    <div className="text-charcoal font-medium">Sinchon Cafe</div>
                                    <div className="text-charcoal/40 text-xs">TRX-992B</div>
                                </div>
                                <div className="text-ochre">₩ 12,500</div>
                            </div>
                            <div className="flex justify-between items-end border-b border-charcoal/5 pb-2">
                                <div>
                                    <div className="text-charcoal font-medium">Clothes</div>
                                    <div className="text-charcoal/40 text-xs">TRX-992C</div>
                                </div>
                                <div className="text-charcoal">₩ 120,000</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const MissionView = () => (
            <div className="relative w-full h-full p-12 overflow-y-auto z-10 flex">
                {/* Surreal Background Elements */}
                <div className="absolute top-10 right-20 w-[400px] h-[500px] pointer-events-none z-0 mix-blend-multiply grayscale contrast-125 opacity-70">
                    <img src="https://images.unsplash.com/photo-1549880181-56a44cf4a9a5?auto=format&fit=crop&w=600&q=80" alt="Bust" className="w-full h-full object-cover" />
                </div>
                <div className="absolute bottom-0 left-40 w-[300px] h-[400px] pointer-events-none z-0 mix-blend-multiply grayscale contrast-125 opacity-50">
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80" alt="Brutalism" className="w-full h-full object-cover" />
                </div>

                <div className="relative z-10 w-1/2">
                    <h1 className="font-serif text-7xl italic tracking-tighter text-charcoal mb-12">The<br/>Mission</h1>
                    
                    {/* Torn Paper Task List */}
                    <div className="glass-panel p-8 w-4/5 torn-edge bg-cream shadow-xl">
                        <h3 className="font-mono text-sm font-bold border-b-2 border-charcoal mb-4 pb-2">SORTIES // ACTIVE</h3>
                        <ul className="space-y-3 font-sans text-lg">
                            <li className="flex items-center gap-3"><span className="w-3 h-3 rounded-full border border-terracotta"></span> Japanese</li>
                            <li className="flex items-center gap-3"><span className="w-3 h-3 rounded-full bg-charcoal"></span> Math Tutoring Prep</li>
                            <li className="flex items-center gap-3"><span className="w-3 h-3 rounded-full border border-ochre"></span> Club Event</li>
                            <li className="flex items-center gap-3"><span className="w-3 h-3 rounded-full border border-charcoal"></span> Lab Reports</li>
                            <li className="flex items-center gap-3"><span className="w-3 h-3 rounded-full border border-olive"></span> Gym Progress</li>
                        </ul>
                    </div>
                </div>

                <div className="relative z-10 w-1/2 flex justify-end items-start mt-20">
                    <div className="glass-panel p-6 grid grid-cols-7 gap-2">
                        <div className="col-span-7 font-mono text-xs text-right mb-2 opacity-50">TEMPORAL GRID</div>
                        {[...Array(28)].map((_, i) => (
                            <div key={i} className={`w-8 h-8 flex items-center justify-center font-mono text-xs border ${i === 25 ? 'bg-terracotta text-cream border-terracotta' : 'border-charcoal/20 hover:bg-charcoal/5'} transition-colors cursor-pointer`}>
                                {i + 1}
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const ResearchView = () => (
            <div className="relative w-full h-full p-12 overflow-y-auto z-10">
                <DataHelix />
                
                <header className="mb-12 relative z-10 text-center">
                    <h1 className="font-serif text-5xl tracking-widest uppercase text-charcoal">Research & Assets</h1>
                    <div className="w-px h-16 bg-charcoal/30 mx-auto mt-6"></div>
                </header>

                <div className="grid grid-cols-2 gap-16 relative z-10 max-w-4xl mx-auto mt-12">
                    <div className="glass-panel p-8 relative">
                        <Crosshair />
                        <h3 className="font-sans text-xl mb-6">Primary Reserves</h3>
                        <div className="font-mono text-4xl text-charcoal mb-2">₩ 12,450,000</div>
                        <div className="font-mono text-sm text-olive">+2.4% / MTD</div>
                        
                        <div className="mt-8 h-24 flex items-end gap-2 border-b border-charcoal/20 pb-2">
                            {[40, 60, 45, 80, 55, 90, 75].map((h, i) => (
                                <div key={i} className="flex-1 bg-charcoal/20 hover:bg-terracotta transition-colors" style={{ height: `${h}%` }}></div>
                            ))}
                        </div>
                    </div>

                    <div className="glass-panel p-8 relative">
                        <Crosshair />
                        <h3 className="font-sans text-xl mb-6">Foreign Exchange</h3>
                        <div className="font-mono text-4xl text-charcoal mb-2">$ 3,240.50</div>
                        <div className="font-mono text-sm text-terracotta">-0.8% / MTD</div>
                        
                        <div className="mt-8 space-y-3 font-mono text-xs">
                            <div className="flex justify-between"><span>USD/KRW</span><span>1,340.21</span></div>
                            <div className="flex justify-between"><span>JPY/KRW</span><span>8.95</span></div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const CouncilView = () => (
            <div className="relative w-full h-full p-12 overflow-y-auto z-10">
                <TopologicalMap />
                
                <header className="mb-12 relative z-10 flex justify-between items-end border-b-2 border-charcoal pb-4">
                    <h1 className="font-serif text-5xl font-bold text-charcoal">The Council</h1>
                    <div className="font-mono text-xs tracking-widest uppercase">Classified Intel // War Room</div>
                </header>

                <div className="grid grid-cols-2 gap-8 relative z-10">
                    {/* Agent Cards */}
                    {[
                        { name: 'Agent: BULL', role: 'Growth & Acquisition', color: 'border-ochre text-ochre', text: 'Market sentiment positive. Recommending aggressive expansion into emerging tech sectors. Capitalize on KRW strength.' },
                        { name: 'Agent: BEAR', role: 'Hedge & Defense', color: 'border-terracotta text-terracotta', text: 'Inflationary pressures remaining. Liquidate volatile assets. Increase cash position by 15% before Q3.' },
                        { name: 'Agent: RISK', role: 'Compliance & Safety', color: 'border-olive text-olive', text: 'Current exposure within acceptable parameters. Monitor USD volatility closely. Gym progress sortie mitigating physical entropy.' },
                        { name: 'Agent: PM', role: 'Project Manager', color: 'border-charcoal text-charcoal', text: 'Lab Reports require immediate resource allocation. Japanese studies progressing on schedule. Club Event logistics pending.' }
                    ].map((agent, i) => (
                        <div key={i} className="glass-panel p-6 relative">
                            <svg className="absolute -left-4 top-1/2 w-4 h-px bg-charcoal/30" />
                            <svg className="absolute top-0 left-4 w-px h-full bg-charcoal/10" />
                            
                            <div className={`font-mono text-xs font-bold border ${agent.color} inline-block px-2 py-1 mb-4`}>
                                {agent.name}
                            </div>
                            <h4 className="font-sans text-sm uppercase tracking-wider mb-4 border-b border-charcoal/10 pb-2">{agent.role}</h4>
                            <p className="font-serif text-lg leading-relaxed text-charcoal/80">
                                "{agent.text}"
                            </p>
                        </div>
                    ))}
                </div>
            </div>
        );

        // --- MAIN APP ---

        const App = () => {
            const [activeTab, setActiveTab] = useState('briefing');

            useEffect(() => {
                lucide.createIcons();
            }, [activeTab]);

            const tabs = [
                { id: 'briefing', icon: 'activity', label: 'Briefing' },
                { id: 'mission', icon: 'crosshair', label: 'Mission' },
                { id: 'research', icon: 'microscope', label: 'Research' },
                { id: 'council', icon: 'users', label: 'Council' }
            ];

            return (
                <div className="flex h-screen w-screen relative">
                    <NoiseFilter />
                    <DraftingGrid />
                    <MeasurementTicks />

                    {/* Sidebar Nav */}
                    <nav className="w-24 h-full border-r border-charcoal/20 flex flex-col items-center py-8 z-50 glass-panel">
                        <div className="w-10 h-10 border-2 border-charcoal rounded-full flex items-center justify-center font-serif font-bold text-xl mb-16">
                            B
                        </div>
                        
                        <div className="flex-1 flex flex-col gap-10">
                            {tabs.map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`relative group flex flex-col items-center ${activeTab === tab.id ? 'text-terracotta' : 'text-charcoal/40 hover:text-charcoal'} transition-colors`}
                                >
                                    <i data-lucide={tab.icon} className="w-6 h-6 mb-2"></i>
                                    <span className="font-mono text-[10px] uppercase tracking-widest opacity-0 group-hover:opacity-100 absolute left-full ml-4 bg-charcoal text-cream px-2 py-1 rounded whitespace-nowrap transition-opacity">
                                        {tab.label}
                                    </span>
                                    {activeTab === tab.id && (
                                        <span className="absolute -left-6 top-1/2 -translate-y-1/2 w-1 h-6 bg-terracotta"></span>
                                    )}
                                </button>
                            ))}
                        </div>
                        
                        <div className="font-mono text-[10px] text-charcoal/30 rotate-180" style={{ writingMode: 'vertical-rl' }}>
                            SYS.V.2.0.4 // OFFLINE
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 relative overflow-hidden">
                        {activeTab === 'briefing' && <BriefingView />}
                        {activeTab === 'mission' && <MissionView />}
                        {activeTab === 'research' && <ResearchView />}
                        {activeTab === 'council' && <CouncilView />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
