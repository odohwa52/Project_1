<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blueprint — FinOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
  :root {
    --cream: #EFEBE2;
    --charcoal: #2C2C2C;
    --terra: #D96A53;
    --ochre: #C49A45;
    --olive: #6B705C;
    --terra-light: rgba(217, 106, 83, 0.15);
    --ochre-light: rgba(196, 154, 69, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* Noise grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.038;
    pointer-events: none;
    z-index: 9999;
  }

  /* Drafting grid */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(44,44,44,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(44,44,44,0.055) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 1;
  }

  .font-serif { font-family: 'Cormorant Garamond', serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  .font-sans { font-family: 'Inter', sans-serif; }

  /* Glass card */
  .glass {
    background: rgba(239, 235, 226, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(44, 44, 44, 0.12);
  }

  .glass-dark {
    background: rgba(239, 235, 226, 0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(44, 44, 44, 0.18);
  }

  /* Torn paper edge */
  .torn-top {
    clip-path: polygon(0% 8px, 5% 0%, 12% 9px, 20% 2px, 28% 10px, 36% 1px, 44% 8px, 52% 0%, 60% 7px, 68% 2px, 76% 9px, 84% 1px, 92% 8px, 100% 0%, 100% 100%, 0% 100%);
  }

  .torn-bottom {
    clip-path: polygon(0% 0%, 100% 0%, 100% calc(100% - 8px), 95% 100%, 87% calc(100% - 9px), 79% 100%, 71% calc(100% - 7px), 63% 100%, 55% calc(100% - 8px), 47% 100%, 39% calc(100% - 9px), 31% 100%, 23% calc(100% - 7px), 15% 100%, 7% calc(100% - 8px), 0% 100%);
  }

  /* Sidebar */
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 64px;
    background: rgba(239, 235, 226, 0.95);
    backdrop-filter: blur(20px);
    border-right: 1px solid rgba(44,44,44,0.12);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0;
    gap: 8px;
  }

  .nav-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    color: rgba(44,44,44,0.45);
    border: 1px solid transparent;
  }

  .nav-btn:hover {
    color: var(--charcoal);
    background: rgba(44,44,44,0.06);
  }

  .nav-btn.active {
    color: var(--terra);
    background: rgba(217, 106, 83, 0.1);
    border-color: rgba(217, 106, 83, 0.25);
  }

  /* Scrollable content area */
  .main-content {
    position: fixed;
    left: 64px;
    top: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 10;
  }

  /* SVG bg layers */
  .bg-art {
    position: fixed;
    left: 64px;
    top: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* Collage images */
  .collage-img {
    mix-blend-mode: multiply;
    filter: grayscale(1) contrast(1.15);
    opacity: 0.22;
  }

  /* Helix path animation */
  @keyframes dash-flow {
    to { stroke-dashoffset: -400; }
  }

  .helix-animated { animation: dash-flow 8s linear infinite; }

  /* Wave animation */
  @keyframes wave-drift {
    0% { transform: translateX(0) scaleY(1); }
    50% { transform: translateX(-20px) scaleY(0.95); }
    100% { transform: translateX(0) scaleY(1); }
  }

  .wave-drift { animation: wave-drift 12s ease-in-out infinite; }
  .wave-drift-2 { animation: wave-drift 16s ease-in-out infinite reverse; }

  /* Clock pulse */
  @keyframes pulse-slow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .colon-pulse { animation: pulse-slow 1s ease-in-out infinite; }

  /* Dashed connector lines */
  .dashed-line {
    stroke-dasharray: 4 6;
    animation: dash-flow 6s linear infinite;
  }

  /* Scroll */
  .main-content::-webkit-scrollbar { width: 4px; }
  .main-content::-webkit-scrollbar-track { background: transparent; }
  .main-content::-webkit-scrollbar-thumb { background: rgba(44,44,44,0.15); border-radius: 2px; }

  /* Tab fade transition */
  .tab-view { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* Radar spin */
  @keyframes radar-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .radar-arm { transform-origin: 50% 50%; animation: radar-spin 4s linear infinite; }

  /* Tag */
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border: 1px solid currentColor;
    border-radius: 2px;
    display: inline-block;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── Color tokens ─────────────────────────────────────────────
const C = {
  terra: '#D96A53',
  ochre: '#C49A45',
  olive: '#6B705C',
  charcoal: '#2C2C2C',
  cream: '#EFEBE2',
};

// ─── Lucide icons helper ───────────────────────────────────────
function Icon({ name, size = 18, ...props }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const svg = window.lucide.createElement(name);
      if (svg) {
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        ref.current.appendChild(svg);
      }
    }
  }, [name, size]);
  return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center' }} {...props} />;
}

// ─── Live Clock ───────────────────────────────────────────────
function useClock() {
  const [time, setTime] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  return time;
}

// ─── Topological Map (reusable decorative) ────────────────────
function TopologicalMap({ width = 320, height = 180, color = C.terra, opacity = 0.18, offsetX = 0 }) {
  const lines = [];
  for (let i = 0; i < 14; i++) {
    const y0 = 20 + i * 12;
    const amp = 18 + Math.sin(i * 0.7) * 14;
    const freq = 0.018 + i * 0.002;
    let d = `M 0 ${y0}`;
    for (let x = 0; x <= width; x += 4) {
      const y = y0 + amp * Math.sin(x * freq + i * 0.5 + offsetX);
      d += ` L ${x} ${y}`;
    }
    lines.push(<path key={i} d={d} stroke={color} strokeWidth="0.8" fill="none" opacity={0.6 + (i % 3) * 0.15} />);
  }
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ overflow: 'visible' }}>
      {lines}
    </svg>
  );
}

// ─── Measurement Ticks (reusable) ─────────────────────────────
function MeasurementTicks({ width = 120, height = 60, color = C.charcoal, opacity = 0.18 }) {
  const ticks = [];
  for (let i = 0; i <= 10; i++) {
    const x = (i / 10) * width;
    const h = i % 5 === 0 ? 10 : i % 2 === 0 ? 6 : 3;
    ticks.push(<line key={i} x1={x} y1={0} x2={x} y2={h} stroke={color} strokeWidth="0.8" opacity={opacity} />);
    if (i % 5 === 0) {
      ticks.push(<text key={`t${i}`} x={x} y={18} fill={color} fontSize="7" textAnchor="middle"
        style={{ fontFamily: 'IBM Plex Mono', opacity: opacity * 1.5 }}>{i * 10}</text>);
    }
  }
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <line x1={0} y1={0} x2={width} y2={0} stroke={color} strokeWidth="0.8" opacity={opacity} />
      {ticks}
    </svg>
  );
}

// ─── Crosshair accent ─────────────────────────────────────────
function Crosshair({ size = 40, color = C.ochre, opacity = 0.5 }) {
  const r = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ opacity }}>
      <circle cx={r} cy={r} r={r - 2} stroke={color} strokeWidth="0.8" fill="none" strokeDasharray="3 4" />
      <circle cx={r} cy={r} r={4} stroke={color} strokeWidth="0.8" fill="none" />
      <line x1={0} y1={r} x2={size} y2={r} stroke={color} strokeWidth="0.8" />
      <line x1={r} y1={0} x2={r} y2={size} stroke={color} strokeWidth="0.8" />
      <circle cx={r} cy={r} r={1.5} fill={color} />
    </svg>
  );
}

// ─── Radar accent ─────────────────────────────────────────────
function RadarAccent({ size = 60, color = C.olive }) {
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ opacity: 0.4 }}>
      <circle cx={size/2} cy={size/2} r={size/2-2} stroke={color} strokeWidth="0.7" fill="none" strokeDasharray="2 3" />
      <circle cx={size/2} cy={size/2} r={size/3} stroke={color} strokeWidth="0.7" fill="none" opacity={0.6} />
      <circle cx={size/2} cy={size/2} r={size/6} stroke={color} strokeWidth="0.7" fill="none" opacity={0.4} />
      <g className="radar-arm">
        <line x1={size/2} y1={size/2} x2={size/2} y2={2} stroke={color} strokeWidth="1" opacity={0.8} />
      </g>
      {[0,60,120,180,240,300].map(angle => {
        const rad = (angle * Math.PI) / 180;
        const x2 = size/2 + (size/2-2) * Math.sin(rad);
        const y2 = size/2 - (size/2-2) * Math.cos(rad);
        return <line key={angle} x1={size/2} y1={size/2} x2={x2} y2={y2} stroke={color} strokeWidth="0.5" opacity={0.25} />;
      })}
    </svg>
  );
}

// ─── Flowing Data Waves (Briefing BG) ─────────────────────────
function FlowingDataWaves({ width, height }) {
  const defs = (
    <defs>
      <filter id="ink-glow-terra" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
      <filter id="ink-glow-ochre" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="10" result="blur" />
        <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
  );

  const w = width || 1200;
  const h = height || 400;

  const terraWaves = [
    `M -20 ${h*0.35} C ${w*0.15} ${h*0.15}, ${w*0.35} ${h*0.55}, ${w*0.55} ${h*0.28} S ${w*0.8} ${h*0.1}, ${w+20} ${h*0.32}`,
    `M -20 ${h*0.48} C ${w*0.12} ${h*0.22}, ${w*0.38} ${h*0.68}, ${w*0.58} ${h*0.38} S ${w*0.82} ${h*0.18}, ${w+20} ${h*0.44}`,
    `M -20 ${h*0.55} C ${w*0.2} ${h*0.3}, ${w*0.42} ${h*0.72}, ${w*0.62} ${h*0.45} S ${w*0.88} ${h*0.25}, ${w+20} ${h*0.52}`,
  ];

  const ochreWaves = [
    `M -20 ${h*0.6} C ${w*0.18} ${h*0.38}, ${w*0.4} ${h*0.78}, ${w*0.6} ${h*0.5} S ${w*0.85} ${h*0.3}, ${w+20} ${h*0.58}`,
    `M -20 ${h*0.72} C ${w*0.22} ${h*0.5}, ${w*0.45} ${h*0.85}, ${w*0.65} ${h*0.62} S ${w*0.9} ${h*0.42}, ${w+20} ${h*0.7}`,
  ];

  const oliveWaves = [
    `M -20 ${h*0.82} C ${w*0.25} ${h*0.6}, ${w*0.48} ${h*0.92}, ${w*0.68} ${h*0.72} S ${w*0.92} ${h*0.55}, ${w+20} ${h*0.8}`,
  ];

  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid slice"
      style={{ position: 'absolute', top: 0, left: 0, right: 0 }}>
      {defs}
      <g className="wave-drift-2">
        {ochreWaves.map((d, i) => (
          <path key={i} d={d} stroke={C.ochre} strokeWidth={1.2 - i * 0.2} fill="none"
            opacity={0.45 - i * 0.08} filter="url(#ink-glow-ochre)" />
        ))}
      </g>
      <g className="wave-drift">
        {terraWaves.map((d, i) => (
          <path key={i} d={d} stroke={C.terra} strokeWidth={1.8 - i * 0.3} fill="none"
            opacity={0.5 - i * 0.1} filter="url(#ink-glow-terra)" />
        ))}
      </g>
      {oliveWaves.map((d, i) => (
        <path key={i} d={d} stroke={C.olive} strokeWidth="0.8" fill="none" opacity={0.3} />
      ))}
      {/* Data nodes */}
      {[[w*0.28, h*0.35], [w*0.55, h*0.28], [w*0.72, h*0.22], [w*0.42, h*0.62]].map(([x,y], i) => (
        <g key={i}>
          <circle cx={x} cy={y} r={3} fill={C.terra} opacity={0.7} />
          <circle cx={x} cy={y} r={7} stroke={C.terra} strokeWidth="0.8" fill="none" opacity={0.3} />
        </g>
      ))}
      {/* Measurement ticks along bottom */}
      {Array.from({length: 20}, (_, i) => (
        <line key={i} x1={i*(w/20)} y1={h-6} x2={i*(w/20)} y2={i%5===0?h-14:h-10}
          stroke={C.charcoal} strokeWidth="0.7" opacity={0.12} />
      ))}
    </svg>
  );
}

// ─── Data Helix (Research BG) ─────────────────────────────────
function DataHelix({ height = 800 }) {
  const cx = 80;
  const amplitude = 55;
  const period = 90;
  const steps = Math.floor(height / 4);
  
  let leftPath = '', rightPath = '';
  const dots = [];
  const crossings = [];
  
  for (let i = 0; i <= steps; i++) {
    const y = i * 4;
    const x = cx + amplitude * Math.sin((y / period) * 2 * Math.PI);
    const x2 = cx - amplitude * Math.sin((y / period) * 2 * Math.PI);
    if (i === 0) {
      leftPath = `M ${x} ${y}`;
      rightPath = `M ${x2} ${y}`;
    } else {
      leftPath += ` L ${x} ${y}`;
      rightPath += ` L ${x2} ${y}`;
    }
    if (Math.abs(Math.sin((y / period) * 2 * Math.PI)) < 0.05) {
      dots.push({ x: cx, y, crossing: true });
      crossings.push(y);
    } else if (i % 12 === 0) {
      dots.push({ x, y });
    }
  }

  return (
    <svg width={cx * 2 + amplitude + 20} height={height} style={{ position: 'absolute', right: 0, top: 0, opacity: 0.22 }}>
      <defs>
        <filter id="helix-glow">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>
      <path d={leftPath} stroke={C.terra} strokeWidth="1.2" fill="none"
        strokeDasharray="200" className="helix-animated" filter="url(#helix-glow)" />
      <path d={rightPath} stroke={C.ochre} strokeWidth="1.2" fill="none"
        strokeDasharray="200" style={{ animationDelay: '2s' }} className="helix-animated" filter="url(#helix-glow)" />
      {dots.map((d, i) => (
        <circle key={i} cx={d.x} cy={d.y} r={d.crossing ? 3 : 1.5}
          fill={d.crossing ? C.olive : C.terra} opacity={d.crossing ? 1 : 0.7} />
      ))}
      {crossings.map((y, i) => (
        <g key={i}>
          <line x1={cx - 14} y1={y} x2={cx + 14} y2={y} stroke={C.olive} strokeWidth="0.7" opacity={0.5} />
          <text x={cx + amplitude + 6} y={y + 3} fill={C.charcoal} fontSize="7"
            style={{ fontFamily: 'IBM Plex Mono', opacity: 0.35 }}>{String(i).padStart(2,'0')}</text>
        </g>
      ))}
    </svg>
  );
}

// ─── VIEW 1: BRIEFING ─────────────────────────────────────────
function BriefingView() {
  const time = useClock();
  const kst = new Date(time.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
  const hh = String(kst.getHours()).padStart(2,'0');
  const mm = String(kst.getMinutes()).padStart(2,'0');
  const ss = String(kst.getSeconds()).padStart(2,'0');
  const dateStr = kst.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Seoul' });

  const weather = [
    { loc: 'Incheon', temp: '24°C', cond: 'Partly Cloudy', hum: '68%', icon: '⛅' },
    { loc: 'Songdo', temp: '22°C', cond: 'Clear', hum: '61%', icon: '☀️' },
    { loc: 'Sinchon', temp: '26°C', cond: 'Hazy', hum: '74%', icon: '🌫️' },
  ];

  const spending = [
    { cat: 'Clothes', amt: 89000, card: 'A', date: 'Mon' },
    { cat: 'Study Materials', amt: 34500, card: 'B', date: 'Tue' },
    { cat: 'Sinchon Cafe', amt: 12000, card: 'C', date: 'Wed' },
    { cat: 'Convenience', amt: 8700, card: 'C', date: 'Thu' },
    { cat: 'Transport', amt: 5300, card: 'B', date: 'Fri' },
  ];

  const maxAmt = Math.max(...spending.map(s => s.amt));
  const wMax = 300;

  // Mini wave chart path
  const miniWave = spending.reduce((acc, s, i) => {
    const x = 20 + i * 60;
    const y = 80 - (s.amt / maxAmt) * 60;
    return acc + (i === 0 ? `M ${x} ${y}` : ` C ${x-30} ${y+10}, ${x-30} ${y-10}, ${x} ${y}`);
  }, '');

  return (
    <div className="tab-view min-h-screen relative" style={{ paddingBottom: 60 }}>
      {/* BG Art */}
      <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>
        <FlowingDataWaves width={1200} height={420} />
        <div style={{ position: 'absolute', bottom: 20, right: 40 }}>
          <TopologicalMap width={280} height={160} color={C.ochre} opacity={0.14} offsetX={1.2} />
        </div>
        <div style={{ position: 'absolute', top: '35%', left: 20 }}>
          <MeasurementTicks width={140} height={50} color={C.charcoal} opacity={0.14} />
        </div>
      </div>

      <div style={{ position: 'relative', zIndex: 10, padding: '48px 48px 0 48px' }}>
        {/* Hero header */}
        <div style={{ marginBottom: 8 }}>
          <p className="tag" style={{ color: C.olive, borderColor: C.olive, opacity: 0.7 }}>KST — Seoul Operations</p>
        </div>
        <h1 className="font-serif" style={{ fontSize: 72, lineHeight: 1, color: C.charcoal, fontWeight: 300, letterSpacing: '-0.02em', marginBottom: 4 }}>
          Morning<br /><em style={{ color: C.terra }}>Briefing</em>
        </h1>
        
        {/* Clock */}
        <div className="font-mono" style={{ fontSize: 13, color: C.charcoal, opacity: 0.6, marginBottom: 32, letterSpacing: '0.12em' }}>
          {hh}<span className="colon-pulse">:</span>{mm}<span className="colon-pulse">:</span>{ss} &nbsp;·&nbsp; {dateStr}
        </div>

        {/* Main grid */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 20 }}>
          
          {/* Weather cards */}
          {weather.map(w => (
            <div key={w.loc} className="glass" style={{ borderRadius: 12, padding: '20px 24px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
                <div>
                  <p className="font-mono" style={{ fontSize: 9, color: C.olive, letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 4 }}>Weather · {w.loc}</p>
                  <p className="font-serif" style={{ fontSize: 32, color: C.charcoal, fontWeight: 300, lineHeight: 1 }}>{w.temp}</p>
                </div>
                <span style={{ fontSize: 28 }}>{w.icon}</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                <span className="font-sans" style={{ fontSize: 11, color: C.charcoal, opacity: 0.6 }}>{w.cond}</span>

  ];

  // Sparkline generator
  function Sparkline({ data, color, width=100, height=36 }) {
    const min = Math.min(...data), max = Math.max(...data);
    const pts = data.map((v,i) => {
      const x = (i/(data.length-1)) * width;
      const y = height - ((v-min)/(max-min)) * (height-4) - 2;
      return `${x},${y}`;
    });
    const d = pts.map((p,i) => (i===0 ? `M ${p}` : `L ${p}`)).join(' ');
    return (
      <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ overflow: 'visible' }}>
        <path d={d} stroke={color} strokeWidth="1.5" fill="none" />
        {pts.map((p,i) => {
          if (i !== pts.length - 1) return null;
          const [x,y] = p.split(',');
          return <circle key={i} cx={x} cy={y} r={2.5} fill={color} />;
        })}
      </svg>
    );
  }

  const mockSparkline = (seed, len=18) => Array.from({length:len}, (_,i) => 50 + Math.sin(i*0.8+seed)*15 + i*0.8 + Math.random()*6);

      </div>

      <div style={{ position: 'relative', zIndex: 10, padding: '48px 48px 0 48px' }}>
        <div style={{ marginBottom: 8 }}>
          <p className="tag" style={{ color: C.ochre, borderColor: C.ochre, opacity: 0.8 }}>Field · Intelligence</p>
        </div>
        <h1 className="font-serif" style={{ fontSize: 68, lineHeight: 1, color: C.charcoal, fontWeight: 300, letterSpacing: '-0.02em', marginBottom: 8 }}>
